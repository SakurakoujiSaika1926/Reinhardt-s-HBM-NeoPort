        def manualSource = file('src/main/resources/assets/reinhardtshbm/manual/material/cinnabar.json').getText('UTF-8')
        if (!manualSource.contains('hbm:item.cinnabar') || manualSource.contains('hbm:item.cinnebar')) {
            problems << 'The cinnabar manual page must use only the canonical cinnabar trigger and icon.'
        }

        def itemSource = file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java').getText('UTF-8')
