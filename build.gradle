tasks.register('validateLangFiles') {
    group = 'verification'
    description = 'Checks language JSON, locale parity, source translation keys, and audited 1.7.10 dynamic keys.'

    inputs.dir file('src/main/resources/assets/reinhardtshbm/lang')
    inputs.dir file('src/main/java')
    outputs.upToDateWhen { false }

    doLast {
        def langRoot = file('src/main/resources/assets/reinhardtshbm/lang')
        def problems = []
        def parsedLocales = [:]
        def genericMojibakePattern = ~/[ÃÂ�]/
        def chineseMojibakePattern = ~/[閻濞閸闂缁闁濠鐐鍕鏋鐎鐢娴鍙鍌闆绋閾婵瀹灏璐鑱鐫]/ 
        def replacementQuestionPattern = ~/\?{3,}/
        def intentionalReplacementQuestionKeys = [
                'advancements.reinhardtshbm.c20_5.description' // 1.7.10 achievement.c20_5.desc is intentionally "???".
        ] as Set
        fileTree(langRoot) {
            include '*.json'
        }.each { langFile ->
            byte[] bytes = langFile.bytes
            if (bytes.length >= 3 && (bytes[0] & 0xff) == 0xef && (bytes[1] & 0xff) == 0xbb && (bytes[2] & 0xff) == 0xbf) {
                problems << "${project.relativePath(langFile)} starts with a UTF-8 BOM"
            }
            def text = langFile.getText('UTF-8')
            def parsedLang = null
            try {
                parsedLang = new groovy.json.JsonSlurper().parseText(text)
                if (parsedLang instanceof Map) {
                    parsedLocales[langFile.name.toLowerCase(Locale.ROOT)] = parsedLang
                }
            } catch (Exception ex) {
                problems << "${project.relativePath(langFile)} is not valid JSON: ${ex.message}"
            }
            def duplicateKeys = [:].withDefault { 0 }
            (text =~ /(?m)^\s*"([^"\\]+)"\s*:/).each { match ->
                duplicateKeys[match[1]]++
            }
            duplicateKeys.findAll { key, count -> count > 1 }.each { key, count ->
                problems << "${project.relativePath(langFile)} contains duplicate key '${key}' (${count} times)"
            }
            def genericMojibake = text.find(genericMojibakePattern)
            if (genericMojibake != null) {
                problems << "${project.relativePath(langFile)} contains mojibake-like text near '${genericMojibake}'"
            }
            if (langFile.name.equalsIgnoreCase('zh_cn.json')) {
                if (text.contains('\\\\u')) {
                    problems << "${project.relativePath(langFile)} contains literal unicode escape text"
                }
                def replacementQuestionEntry = parsedLang instanceof Map ? parsedLang.find { key, value ->
                    value instanceof String
                            && (value =~ replacementQuestionPattern).find()
                            && !intentionalReplacementQuestionKeys.contains(key)
                } : null
                if (replacementQuestionEntry != null) {
                    problems << "${project.relativePath(langFile)} contains replacement question marks near '${replacementQuestionEntry.value}'"
                } else if (!(parsedLang instanceof Map) && text.find(replacementQuestionPattern) != null) {
                    problems << "${project.relativePath(langFile)} contains replacement question marks"
                }
                def chineseMojibake = text.find(chineseMojibakePattern)
                if (chineseMojibake != null) {
                    problems << "${project.relativePath(langFile)} contains Chinese mojibake-like text near '${chineseMojibake}'"
                }
                def hangulLike = text.find(/[\uac00-\ud7af]/)
                if (hangulLike != null) {
                    problems << "${project.relativePath(langFile)} contains non-Chinese mojibake-like text near '${hangulLike}'"
                }
            }
        }

        def english = parsedLocales['en_us.json']
        def chinese = parsedLocales['zh_cn.json']
        if (english instanceof Map && chinese instanceof Map) {
            def englishKeys = english.keySet() as Set
            def chineseKeys = chinese.keySet() as Set
            (englishKeys - chineseKeys).sort().each { key ->
                problems << "zh_cn.json is missing key '${key}' from en_us.json"
            }
            (chineseKeys - englishKeys).sort().each { key ->
                problems << "en_us.json is missing key '${key}' from zh_cn.json"
            }

            def externalLiteralKeys = [
                    'commands.locate.no_match',
                    'commands.locate.none_found',
                    'commands.locate.success.coordinates'
            ] as Set
            def literalKeyPattern = ~/(?s)(?:Component\.translatable|I18n\.get|I18n\.exists)\(\s*"([^"]+)"\s*[,\)]/
            def literalKeys = [] as Set
            fileTree('src/main/java') {
                include '**/*.java'
            }.each { sourceFile ->
                (sourceFile.getText('UTF-8') =~ literalKeyPattern).each { match ->
                    literalKeys << match[1]
                }
            }
            (literalKeys - externalLiteralKeys).sort().each { key ->
                if (!english.containsKey(key)) {
                    problems << "en_us.json is missing source translation key '${key}'"
                }
                if (!chinese.containsKey(key)) {
                    problems << "zh_cn.json is missing source translation key '${key}'"
                }
            }

            // These names/descriptions are assembled at runtime, so a literal-call scan cannot see them.
            // Every entry below was audited against the 1.7.10 en_US/zh_CN language files or hardcoded lore.
            def requiredPortedKeys = [] as Set
            [
                    'cell_anti_schrabidium', 'cell_antimatter', 'cell_deuterium', 'cell_puf6', 'cell_sas3', 'cell_uf6',
                    'coin_token', 'cube_power', 'early_explosive_lenses', 'explosive_lenses', 'fluid_duct',
                    'holotape_damaged', 'laser_crystal_dnt', 'mp_warhead_15_nuclear_mimi', 'nuke_electric_kit',
                    'rod_zirnox_les_fuel_depleted', 'rod_zirnox_mox_fuel_depleted',
                    'rod_zirnox_natural_uranium_fuel_depleted', 'rod_zirnox_plutonium_fuel_depleted',
                    'rod_zirnox_thorium_fuel_depleted', 'rod_zirnox_u233_fuel_depleted',
                    'rod_zirnox_u235_fuel_depleted', 'rod_zirnox_uranium_fuel_depleted',
                    'rod_zirnox_zfb_mox_depleted', 'rpa_boots', 'rpa_helmet', 'rpa_legs', 'rpa_plate',
                    'structure_custommachine', 'hat'
            ].each { id -> requiredPortedKeys << "item.reinhardtshbm.${id}" }
            [
                    'asphalt_stairs', 'icf_controller', 'machine_reactor', 'machine_weapon_table',
                    'ore_bedrock', 'rebar', 'vending_machine'
            ].each { id -> requiredPortedKeys << "block.reinhardtshbm.${id}" }
            ['casing', 'port', 'cell', 'emitter', 'capacitor', 'turbo'].each { variant ->
                requiredPortedKeys << "block.reinhardtshbm.icf_laser_component.${variant}"
            }
            [
                    'black', 'red', 'green', 'brown', 'blue', 'purple', 'cyan', 'silver',
                    'gray', 'pink', 'lime', 'yellow', 'lightblue', 'magenta', 'orange', 'white'
            ].each { color -> requiredPortedKeys << "item.reinhardtshbm.crayon.${color}" }
            [
                    'asbestos', 'ass', 'bark', 'beef', 'bhole', 'cheese', 'chinese', 'diesel', 'fist',
                    'fried', 'hotdogs', 'kerosene', 'leftovers', 'milk', 'mystery', 'napalm', 'oil',
                    'pashtet', 'pizza', 'recursion', 'slime', 'spam', 'stew', 'tomato', 'tube', 'tuna', 'yogurt'
            ].each { type ->
                requiredPortedKeys << "item.reinhardtshbm.canned_${type}"
                requiredPortedKeys << "item.reinhardtshbm.canned_${type}.desc"
            }
            [
                    'billet_flashlead', 'billet_gh336', 'bolt_spike', 'burnt_bark', 'circuit_star',
                    'crystal_charred', 'crystal_horn', 'custom_fall', 'dust', 'early_explosive_lenses',
                    'entanglement_kit', 'explosive_lenses', 'flame_conspiracy', 'flame_opinion',
                    'flame_politics', 'flame_pony', 'gem_tantalium', 'igniter', 'ingot_asbestos',
                    'ingot_combine_steel', 'ingot_euphemium', 'ingot_fiberglass', 'ingot_gh336',
                    'ingot_lanthanium', 'ingot_neptunium', 'ingot_tantalium', 'key_red', 'key_red_cracked',
                    'mech_key', 'missile_soyuz_lander', 'nugget_euphemium', 'nugget_gh336',
                    'pellet_cluster', 'pin', 'plate_bismuth', 'powder_asbestos', 'powder_euphemium',
                    'powder_fire', 'powder_poison', 'powder_tantalium', 'watch'
            ].each { id -> requiredPortedKeys << "item.reinhardtshbm.${id}.desc" }
            requiredPortedKeys << 'item.reinhardtshbm.laser_crystal_dnt.desc'
            requiredPortedKeys << 'tooltip.reinhardtshbm.health_armor_mod'
            [ams_core_sing: 6, ams_core_wormhole: 10, ams_core_eyeofharmony: 7, ams_core_thingy: 10].each { id, lines ->
                (1..lines).each { line -> requiredPortedKeys << "tooltip.reinhardtshbm.${id}.${line}" }
            }
            requiredPortedKeys.sort().each { key ->
                def normalizedKey = key.toString()
                if (!english.containsKey(normalizedKey)) {
                    problems << "en_us.json is missing audited 1.7.10 key '${normalizedKey}'"
                }
                if (!chinese.containsKey(normalizedKey)) {
                    problems << "zh_cn.json is missing audited 1.7.10 key '${normalizedKey}'"
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Language validation failed:\n - " + problems.join('\n - '))
        }
    }
}

tasks.register('validateDamageTypes') {
    group = 'verification'
    description = 'Checks custom damage type JSONs contain the fields required by Minecraft 1.21.1.'

    inputs.dir file("src/main/resources/data/${project.mod_id}/damage_type")
    outputs.upToDateWhen { false }

    doLast {
        def root = file("src/main/resources/data/${project.mod_id}/damage_type")
        def parser = new groovy.json.JsonSlurper()
        def problems = []
        fileTree(root) {
            include '*.json'
        }.each { damageTypeFile ->
            def definition
            try {
                definition = parser.parseText(damageTypeFile.getText('UTF-8'))
            } catch (Exception ex) {
                problems << "${project.relativePath(damageTypeFile)} is not valid JSON: ${ex.message}"
                return
            }
            ['message_id', 'scaling', 'exhaustion'].each { required ->
                if (!definition.containsKey(required)) {
                    problems << "${project.relativePath(damageTypeFile)} is missing required Minecraft 1.21.1 damage type field '${required}'"
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Damage type validation failed:\n - " + problems.join('\n - '))
        }
    }
}

tasks.register('validateLegacyRecipes') {
    group = 'verification'
    description = 'Checks migrated data-driven machine recipes against legacy 1.7.10 defaults where the migration is complete.'

    inputs.dir file('src/main/resources/data/reinhardtshbm/recipe/particle_accelerator')
