                problems << "PressBlockEntityRenderer reintroduced shared/incorrect press transform '${forbidden}'."
            }
        }

        def dfcRendererSource = readSource('src/main/java/com/reinhardt/hbm/client/render/DfcComponentBlockEntityRenderer.java')
        ['applyEmitterPose', 'applyReceiverPose', 'applyInjectorPose', 'applyStabilizerPose'].each { method ->
            if (!dfcRendererSource?.contains(method + '(')) {
                problems << "DfcComponentBlockEntityRenderer is missing dedicated '${method}'."
            }
        }
        if (dfcRendererSource?.contains('applyLegacyTransform(')) {
            problems << 'DFC kinds must not share applyLegacyTransform; each component owns its six-direction pose.'
        }

        def rbmkBlockSource = readSource('src/main/java/com/reinhardt/hbm/block/RbmkComponentBlock.java')
        if (rbmkBlockSource?.contains('rotateOldDimension(')) {
            problems << 'RbmkComponentBlock must not share rotateOldDimension across console kinds.'
        }
        ['addConsoleDimension', 'addCraneConsoleDimension'].each { method ->
            if (!rbmkBlockSource?.contains(method + '(')) {
                problems << "RbmkComponentBlock is missing dedicated '${method}'."
            }
        }

        def legacyNukeDefinitionSource = readSource('src/main/java/com/reinhardt/hbm/block/LegacyNukeDefinition.java')
        if (legacyNukeDefinitionSource?.contains('worldYaw(')) {
            problems << 'LegacyNukeDefinition must remain data-only and must not own a shared worldYaw transform.'
        }

        def fusionRendererSourcePolicy = readSource('src/main/java/com/reinhardt/hbm/client/render/FusionMachineBlockEntityRenderer.java')
        ['applyKlystronTransform', 'applyCreativeKlystronTransform', 'applyBoilerTransform',
         'applyBreederTransform', 'applyCollectorTransform', 'applyCouplerTransform',
         'applyMhdtTransform', 'applyPlasmaForgeTransform'].each { method ->
            if (!fusionRendererSourcePolicy?.contains(method + '(')) {
                problems << "FusionMachineBlockEntityRenderer is missing dedicated '${method}'."
            }
        }
        ['legacyFusionYaw(', 'renderFacingModel(', 'facingPose('].each { forbidden ->
            if (fusionRendererSourcePolicy?.contains(forbidden)) {
                problems << "FusionMachineBlockEntityRenderer reintroduced shared fusion orientation '${forbidden}'."
            }
        }

        def radioTorchRendererPolicy = readSource('src/main/java/com/reinhardt/hbm/client/render/RadioTorchBlockEntityRenderer.java')
        ['Sender', 'Receiver', 'Counter', 'Logic', 'Reader', 'Controller'].each { kind ->
            ['render', 'apply', 'bounds'].each { role ->
                def fragment = role == 'apply' ? "apply${kind}Pose(" :
                        role == 'bounds' ? "${kind.toLowerCase()}Bounds(" : "render${kind}("
                if (!radioTorchRendererPolicy?.contains(fragment)) {
                    problems << "RadioTorchBlockEntityRenderer is missing dedicated '${fragment}'."
                }
            }
        }
        ['applyLegacyFacing(', 'facingYaw(', 'MODELS[kind.ordinal()]'].each { forbidden ->
            if (radioTorchRendererPolicy?.contains(forbidden)) {
                problems << "RadioTorchBlockEntityRenderer reintroduced shared kind orientation '${forbidden}'."
            }
        }
        if (radioTorchRendererPolicy =~ /Axis\.ZP\.rotationDegrees\(-90\.0F\)\);\s*poseStack\.mulPose\(Axis\.YP/) {
            problems << 'RadioTorchBlockEntityRenderer reversed the legacy RTTY Y/Z matrix order.'
        }
        def radioTorchBlockPolicy = readSource('src/main/java/com/reinhardt/hbm/block/RadioTorchBlock.java')
        ['senderShape(', 'receiverShape(', 'counterShape(', 'logicShape(', 'readerShape(',
         'controllerShape(', 'senderCanSurvive(', 'receiverCanSurvive(', 'counterCanSurvive(',
         'logicCanSurvive(', 'readerCanSurvive(', 'controllerCanSurvive('].each { fragment ->
            if (!radioTorchBlockPolicy?.contains(fragment)) {
                problems << "RadioTorchBlock is missing dedicated kind geometry/support '${fragment}'."
            }
        }
        if (radioTorchBlockPolicy?.contains('shapeFor(')) {
            problems << 'RadioTorchBlock must not share shapeFor across six RTTY kinds.'
        }
        def radioTorchEntityPolicy = readSource('src/main/java/com/reinhardt/hbm/blockentity/RadioTorchBlockEntity.java')
        ['senderSupport(', 'readerSupport(', 'counterSupport('].each { fragment ->
            if (!radioTorchEntityPolicy?.contains(fragment)) {
                problems << "RadioTorchBlockEntity is missing dedicated runtime support mapping '${fragment}'."
            }
        }
        if (radioTorchEntityPolicy?.contains('BlockPos support(BlockPos')) {
            problems << 'RadioTorchBlockEntity must not share one support-direction mapper across runtime kinds.'
        }

        def spotlightRendererPolicy = readSource('src/main/java/com/reinhardt/hbm/client/render/SpotlightBlockEntityRenderer.java')
        def spotlightRendererPolicyLf = spotlightRendererPolicy?.replace('\r\n', '\n')
        ['renderIncandescent(', 'renderFluorescent(', 'renderHalogen(',
         'updateIncandescentSnapshot(', 'updateFluorescentSnapshot(', 'updateHalogenSnapshot(',
         'applyIncandescentPose(', 'applyFluorescentPose(', 'applyHalogenPose('].each { fragment ->
            if (!spotlightRendererPolicy?.contains(fragment)) {
                problems << "SpotlightBlockEntityRenderer is missing dedicated kind contract '${fragment}'."
            }
        }
        ['modularRoll(', 'float pitch(', 'float yaw(', 'facing.getStepX()',
         'facing.getStepY()', 'facing.getStepZ()'].each { forbidden ->
            if (spotlightRendererPolicy?.contains(forbidden)) {
                problems << "SpotlightBlockEntityRenderer reintroduced shared spotlight orientation '${forbidden}'."
            }
        }
        [
                'poseStack.mulPose(Axis.ZP.rotationDegrees(-90.0F));\n                applyFluorescentDownRoll',
                'poseStack.mulPose(Axis.ZP.rotationDegrees(90.0F));\n                applyFluorescentUpRoll',
                'poseStack.mulPose(Axis.YP.rotationDegrees(90.0F));\n                applyFluorescentNorthRoll',
                'poseStack.mulPose(Axis.YP.rotationDegrees(-90.0F));\n                applyFluorescentSouthRoll',
                'poseStack.mulPose(Axis.YP.rotationDegrees(180.0F));\n                applyFluorescentWestRoll'
        ].each { orderedFragment ->
            if (!spotlightRendererPolicyLf?.contains(orderedFragment)) {
                problems << "SpotlightBlockEntityRenderer lost verified legacy matrix order '${orderedFragment}'."
            }
        }
        def spotlightBlockPolicy = readSource('src/main/java/com/reinhardt/hbm/block/SpotlightBlock.java')
        ['incandescentShape(', 'fluorescentShape(', 'halogenShape(',
         'incandescentCanSurvive(', 'fluorescentCanSurvive(', 'halogenCanSurvive(',
         'propagateIncandescentBeam(', 'propagateFluorescentBeam(', 'propagateHalogenBeam(',
         'unpropagateIncandescentBeam(', 'unpropagateFluorescentBeam(', 'unpropagateHalogenBeam('].each { fragment ->
            if (!spotlightBlockPolicy?.contains(fragment)) {
                problems << "SpotlightBlock is missing dedicated kind geometry/runtime mapping '${fragment}'."
            }
        }
        ['float[] bounds = switch (kind)', 'swizzleBounds('].each { forbidden ->
            if (spotlightBlockPolicy?.contains(forbidden)) {
                problems << "SpotlightBlock reintroduced shared spotlight shape swizzling '${forbidden}'."
            }
        }
        ['float x = 0.25F;', 'float y = 0.20F;', 'float z = 0.15F;',
         'float x = 0.50F;', 'float y = 0.50F;', 'float z = 0.10F;',
         'float x = 0.35F;', 'float y = 0.25F;', 'float z = 0.20F;'].each { oldBound ->
            if (!spotlightBlockPolicy?.contains(oldBound)) {
                problems << "SpotlightBlock lost exact 1.7.10 half-bound '${oldBound}'."
            }
        }

        def wallChargeRendererPolicy = readSource('src/main/java/com/reinhardt/hbm/client/render/WallChargeBlockEntityRenderer.java')
        ['Dynamite', 'Miner', 'C4', 'Semtex'].each { kind ->
            ['render', 'apply'].each { role ->
                def fragment = role == 'apply' ? "apply${kind}Pose(" : "render${kind}("
                if (!wallChargeRendererPolicy?.contains(fragment)) {
                    problems << "WallChargeBlockEntityRenderer is missing dedicated '${fragment}'."
                }
            }
        }
        ['dynamiteBounds(', 'minerBounds(', 'c4Bounds(', 'semtexBounds('].each { fragment ->
            if (!wallChargeRendererPolicy?.contains(fragment)) {
                problems << "WallChargeBlockEntityRenderer is missing dedicated bounds '${fragment}'."
            }
        }
        if (wallChargeRendererPolicy?.contains('applyLegacyFacing(')) {
            problems << 'WallChargeBlockEntityRenderer must not share applyLegacyFacing across charge kinds.'
        }
        def wallChargeBlockPolicy = readSource('src/main/java/com/reinhardt/hbm/block/WallChargeBlock.java')
        ['dynamiteShape(', 'minerShape(', 'c4Shape(', 'semtexShape(',
         'dynamiteCanSurvive(', 'minerCanSurvive(', 'c4CanSurvive(', 'semtexCanSurvive('].each { fragment ->
            if (!wallChargeBlockPolicy?.contains(fragment)) {
                problems << "WallChargeBlock is missing dedicated kind geometry/support '${fragment}'."
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException('Renderer culling/bounds validation failed:\n - ' + problems.join('\n - '))
        }
        logger.lifecycle("Renderer culling/bounds validation passed: ${registrationCallCount} registrations / ${registered.size()} renderer classes covered (${unitRendererWhitelist.size()} audited unit renderers).")
    }
}

tasks.register('validateEntityRendererCullingBounds') {
    group = 'verification'
    description = 'Audits every registered entity renderer for finite model-derived culling and explicit vanilla-size exceptions.'

    inputs.file(file('src/main/java/com/reinhardt/hbm/client/render/HbmClientRenderers.java'))
    inputs.files(fileTree('src/main/java/com/reinhardt/hbm/client/render') { include '**/*.java' })
    inputs.files(fileTree('src/main/java/com/reinhardt/hbm/entity') { include '**/*.java' })
    outputs.upToDateWhen { false }

    doLast {
        def problems = []
        def readSource = { String path ->
            def sourceFile = file(path)
            sourceFile.isFile() ? sourceFile.getText('UTF-8') : null
        }

        def registry = readSource('src/main/java/com/reinhardt/hbm/client/render/HbmClientRenderers.java')
        def calls = []
        def callMatcher = java.util.regex.Pattern.compile(
                'registerEntityRenderer\\s*\\(.*?\\);',
                java.util.regex.Pattern.DOTALL).matcher(registry)
        while (callMatcher.find()) calls << callMatcher.group()
        if (calls.isEmpty()) {
            problems << 'HbmClientRenderers yielded no entity-renderer registrations.'
        }

        def providers = new LinkedHashSet<String>()
        calls.each { String call ->
            def methodReference = java.util.regex.Pattern.compile(
                    '([A-Za-z_$][A-Za-z0-9_$.]*)(?:<[^;()]+>)?\\s*::\\s*new')
                    .matcher(call)
            def lambdaConstructor = java.util.regex.Pattern.compile(
                    '\\bnew\\s+([A-Za-z_$][A-Za-z0-9_$.]*)')
                    .matcher(call)
            String provider = null
            if (methodReference.find()) provider = methodReference.group(1)
            if (provider == null && lambdaConstructor.find()) provider = lambdaConstructor.group(1)
            if (provider == null) {
                problems << "Could not parse entity-renderer provider from: ${call.replaceAll('\\s+', ' ')}"
            } else {
                providers.add(provider)
            }
        }

        // These renderers deliberately retain the vanilla culling contract.
        // Each reason records the geometry/transform proof or the exact
        // vanilla renderer delegation that makes a custom envelope unnecessary.
        def defaultCullingWhitelist = [
                'ItemEntityRenderer'                 : 'Unmodified Minecraft item-entity renderer and model contract.',
                'NoopRenderer'                       : 'Emits no vertices.',
                'RubberBoatEntityRenderer'           : 'Only replaces BoatRenderer texture; model, transforms and culling remain vanilla.',
                'LegacyDuckEntityRenderer'           : 'Only replaces ChickenRenderer texture; model, transforms and culling remain vanilla.',
                'LegacyFbiEntityRenderer'            : 'Unscaled vanilla HumanoidModel with an arm pose; vanilla living-entity culling contract.',
                'LegacyGhostEntityRenderer'          : 'Unscaled vanilla player HumanoidModel; only the render type is translucent.',
                'LegacyDummyEntityRenderer'          : 'Unscaled vanilla HumanoidModel and the vanilla living-entity transform.',
                'LegacyUndeadSoldierEntityRenderer'  : 'Unscaled zombie/skeleton HumanoidModel layers with vanilla armor and living transforms.',
                'ParasiteMaggotEntityRenderer'       : 'Unscaled vanilla SilverfishModel and vanilla MobRenderer transforms.',
                'LegacyPigeonEntityRenderer'         : 'Authored pivots/cubes, including fat-wing motion, stay inside the entity AABB plus vanilla 0.5 culling margin.',
                'LegacyPlasticBagEntityRenderer'     : 'Face-used OBJ radius is below 0.5 under both entity rotations; registered AABB plus 0.5 margin contains it.',
                'LegacyChopperMineEntityRenderer'    : 'The authored 8-pixel cube scaled 1.5 has radius sqrt(3)*0.375; its registered 12x12 AABB is strictly larger.',
                'LegacyShrapnelEntityRenderer'       : 'The analytic cube maximum corner radius is 0.439727 under its norm-preserving rotations, below the registered AABB plus 0.5 margin.',
                'ConveyorMovingItemRenderer'         : 'Uses Minecraft item-display culling; the renderer adds at most 0.0625 Y and never enlarges the selected vanilla display model.',
                'GlyphidAcidSprayEntityRenderer'     : 'Particle-only projectile; this renderer emits no vertices.'
        ]

        def externalProviders = ['ItemEntityRenderer', 'NoopRenderer'] as Set
        providers.each { String provider ->
            String topLevel = provider.contains('.') ? provider.substring(0, provider.indexOf('.')) : provider
            if (externalProviders.contains(topLevel)) {
                if (!defaultCullingWhitelist.containsKey(topLevel)) {
                    problems << "External provider ${topLevel} lacks an explicit culling rationale."
                }
                return
            }

            String path = "src/main/java/com/reinhardt/hbm/client/render/${topLevel}.java"
            String source = readSource(path)
            if (source == null) {
                problems << "Registered entity renderer ${provider} has no source file ${path}."
                return
            }
            boolean customCulling = source =~ /boolean\s+shouldRender\s*\(/
            boolean vanillaContract = defaultCullingWhitelist.containsKey(topLevel)
            if (customCulling && vanillaContract) {
                problems << "${topLevel} has custom culling but remains in the vanilla-contract whitelist."
            } else if (!customCulling && !vanillaContract) {
                problems << "${topLevel} has neither a model-derived shouldRender() nor an audited vanilla-size exception."
            }
            if (customCulling && !source.contains('EntityRenderBounds.shouldRender')) {
                problems << "${topLevel} custom culling must use the finite shared distance/frustum policy."
            }
        }
        defaultCullingWhitelist.each { String name, String reason ->
            if (!providers.any { String provider ->
                String top = provider.contains('.') ? provider.substring(0, provider.indexOf('.')) : provider
                top == name
            }) {
                problems << "Entity default-culling whitelist entry ${name} is not registered."
            }
            if (reason == null || reason.trim().isEmpty()) {
                problems << "Entity default-culling whitelist entry ${name} needs a geometry rationale."
            }
        }

        def requiredContracts = [
                'EntityRenderBounds.java'                    : ['includePreviousRenderOrigin', 'entity.xOld - entity.getX()', 'distanceSquaredToRenderOriginSegment', 'isWithinRenderDistance', 'worldBounds.getSize()', '64.0D * Entity.getViewScale()', 'frustum.isVisible'],
                'UniversalGrenadeEntityRenderer.java'        : ['UniversalGrenadeItemRenderer.groundBounds', 'EntityRenderBounds.shouldRender'],
                'UniversalGrenadeItemRenderer.java'          : ['BakedBlockGeometrySnapshot.build', 'applyLegacyTransform(shell, ItemDisplayContext.GROUND'],
                'TimedExplosiveEntityRenderer.java'          : ['BakedBlockGeometrySnapshot.build', 'applyRenderPose', 'EntityRenderBounds.shouldRender'],
                'LegacyGrenadeEntityRenderer.java'           : ['BakedItemGeometrySnapshot.build', 'ItemDisplayContext.GROUND', 'EntityRenderBounds.shouldRender'],
                'GlyphidAcidBombEntityRenderer.java'         : ['BakedItemGeometrySnapshot.build', 'ItemDisplayContext.GROUND', 'EntityRenderBounds.shouldRender'],
                'LegacyCreeperEntityRenderer.java'           : ['animatedPartRadius', 'fixedPartRadius', 'swellMod', 'EntityRenderBounds.shouldRender', 'EntityRenderBounds.isWithinRenderDistance'],
                'LegacyFbiDroneEntityRenderer.java'          : ['BakedBlockGeometrySnapshot.build', 'applyBasePose', 'EntityRenderBounds.shouldRender'],
                'DigammaSpearEntityRenderer.java'            : ['LOCAL_VISUAL_BOUNDS', 'EntityRenderBounds.shouldRender'],
                'LegacyQuackosEntityRenderer.java'           : ['ADULT_MODEL_RADIUS', 'BABY_MODEL_RADIUS', 'radius += Math.abs(entity.getEyeHeight(Pose.STANDING) - 0.1D);', 'EntityRenderBounds.shouldRender', 'EntityRenderBounds.isWithinRenderDistance'],
                'GlyphidEntityRenderer.java'                 : ['Mth.rotLerp(partialTick, glyphid.yBodyRotO, glyphid.yBodyRot)', 'Axis.YP.rotationDegrees(180.0F - bodyYaw)', 'animatedModelRadius', 'EntityRenderBounds.shouldRender'],
                'LegacyBlockSpiderEntityRenderer.java'       : ['captureBodyBounds', 'LEG_RADIUS', 'EntityRenderBounds.shouldRender'],
                'LegacyCyberCrabEntityRenderer.java'         : ['authoredMaximumRootRadius', 'radius += Math.abs(entity.getEyeHeight(Pose.STANDING) - 0.1D);', 'EntityRenderBounds.shouldRender', 'EntityRenderBounds.isWithinRenderDistance'],
                'LegacyRadBeastEntityRenderer.java'          : ['BLAZE_MODEL_RADIUS', 'authoredMaximumRootRadius', 'radius += Math.abs(entity.getEyeHeight(Pose.STANDING) - 0.1D);', 'includeBeamBounds', 'beamTarget', 'EntityRenderBounds.shouldRender', 'EntityRenderBounds.isWithinRenderDistance'],
                'FireworksEntityRenderer.java'               : ['captureGlyphRadius', 'BoundsVertexConsumer', 'EntityRenderBounds.shouldRender'],
                'CogEntityRenderer.java'                     : ['BakedBlockGeometrySnapshot.build', 'EntityRenderBounds.shouldRender'],
                'SawbladeEntityRenderer.java'                : ['BakedBlockGeometrySnapshot.build', 'EntityRenderBounds.shouldRender'],
                'RbmkDebrisEntityRenderer.java'              : ['maximumFaceRadius', 'EntityRenderBounds.shouldRender'],
                'ZirnoxDebrisEntityRenderer.java'            : ['BakedItemGeometrySnapshot.build', 'EntityRenderBounds.shouldRender'],
                'LegacyFallingNukeEntityRenderer.java'       : ['BakedBlockGeometrySnapshot.build', 'applyFacingPose', 'EntityRenderBounds.shouldRender'],
                'NukeTorexEntityRenderer.java'               : ['visualBounds', 'billboardSweepExtent', 'EntityRenderBounds.shouldRender'],
                'LegacyBlackHoleEntityRenderer.java'         : ['visualBounds', 'gamma64', 'EntityRenderBounds.shouldRender'],
                'LegacyVortexEntityRenderer.java'            : ['visualBounds', 'gamma64', 'EntityRenderBounds.shouldRender']
        ]
        requiredContracts.each { String name, List<String> fragments ->
            String source = readSource("src/main/java/com/reinhardt/hbm/client/render/${name}")
            if (source == null) {
                problems << "Missing entity culling contract source ${name}."
                return
            }
            fragments.each { String fragment ->
                if (!source.contains(fragment)) {
                    problems << "${name} is missing proved culling contract '${fragment}'."
                }
            }
        }

        [
                'LegacyCreeperEntityRenderer.java',
                'LegacyCyberCrabEntityRenderer.java',
                'LegacyQuackosEntityRenderer.java',
                'LegacyRadBeastEntityRenderer.java'
        ].each { String name ->
            String source = readSource("src/main/java/com/reinhardt/hbm/client/render/${name}")
            if (source != null && source.contains('entity.shouldRender(cameraX, cameraY, cameraZ)')) {
                problems << "${name} reintroduced the vanilla collision-box distance fallback for leash holders."
            }
        }

        def allJava = fileTree('src/main/java/com/reinhardt/hbm') { include '**/*.java' }
        allJava.each { File sourceFile ->
            String source = sourceFile.getText('UTF-8')
            if (source =~ /noCulling\s*=\s*true/) {
                problems << "${sourceFile.name} reintroduced forced entity no-culling."
            }
            if (source =~ /new\s+AABB\s*\([^)]*(?:POSITIVE|NEGATIVE)_INFINITY/) {
                problems << "${sourceFile.name} constructs an infinite render AABB."
            }
            if (sourceFile.name != 'LongRangeBlockEntityRenderer.java'
                    && source =~ /boolean\s+shouldRenderOffScreen\s*\(/) {
                problems << "${sourceFile.name} reintroduced a concrete off-screen BER override."
            }
        }

        // Old HBM explicitly forced these eight moving/effect entities to stay
        // distance-visible. Every other unconditional override is a regression.
        def legacyAlwaysDistanceVisible = [
                'CogEntity.java', 'SawbladeEntity.java', 'NukeTorexEntity.java', 'MeteorEntity.java',
                'LegacyLauncherMissileEntity.java', 'LegacyHimarsRocketEntity.java',
                'LegacyBomberEntity.java', 'LegacyArtilleryShellEntity.java'
        ] as Set
        fileTree('src/main/java/com/reinhardt/hbm/entity') { include '**/*.java' }.each { File sourceFile ->
            String source = sourceFile.getText('UTF-8')
            boolean unconditional = source =~ /(?s)shouldRenderAtSqrDistance\s*\([^)]*\)\s*\{\s*return\s+true\s*;\s*\}/
            if (unconditional && !legacyAlwaysDistanceVisible.contains(sourceFile.name)) {
                problems << "${sourceFile.name} has an unconditional render-distance override without a verified 1.7.10 counterpart."
            }
        }
        legacyAlwaysDistanceVisible.each { String name ->
            File sourceFile = fileTree('src/main/java/com/reinhardt/hbm/entity') {
                include "**/${name}"
            }.files.find()
            if (sourceFile == null || !(sourceFile.getText('UTF-8') =~ /(?s)shouldRenderAtSqrDistance\s*\([^)]*\)\s*\{\s*return\s+true\s*;\s*\}/)) {
                problems << "Verified legacy always-visible entity ${name} lost its explicit distance contract."
            }
        }

        ['FireworksEntityRenderer.invalidateGlyphBounds()',
         'MineRubbleEntityRenderer.invalidateBounds()',
         'LegacyBlockSpiderEntityRenderer.invalidateBounds()',
         'CogEntityRenderer.invalidateBounds()',
         'SawbladeEntityRenderer.invalidateBounds()',
         'ZirnoxDebrisEntityRenderer.invalidateBounds()',
         'TimedExplosiveEntityRenderer.invalidateBounds()',
         'LegacyGrenadeEntityRenderer.invalidateBounds()',
         'GlyphidAcidBombEntityRenderer.invalidateBounds()',
         'LegacyFbiDroneEntityRenderer.invalidateBounds()',
         'LauncherMissileRenderer.invalidateEntityBounds()',
         'UniversalGrenadeEntityRenderer.invalidateBounds()',
         'LegacyFallingNukeEntityRenderer.invalidateBounds()'].each { String fragment ->
            if (!registry.contains(fragment)) {
                problems << "Model-bake invalidation is missing '${fragment}'."
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException('Entity renderer culling validation failed:\n - ' + problems.join('\n - '))
        }
        logger.lifecycle("Entity renderer culling validation passed: ${calls.size()} registrations / ${providers.size()} providers covered (${defaultCullingWhitelist.size()} explicit vanilla contracts).")
    }
}

tasks.register('validateThermalParity') {
    group = 'verification'
    description = 'Guards the audited 1.7.10 heat-source, boiler, and solar-boiler numerical contracts.'

    def thermalSources = [
            'src/main/java/com/reinhardt/hbm/blockentity/HeaterBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/HeatBoilerBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/IndustrialBoilerBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/SolarBoilerBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/fluid/HbmThermalConversions.java'
    ]
    inputs.files(thermalSources.collect { file(it) })
    outputs.upToDateWhen { false }

    doLast {
        def source = { String path -> file(path).getText('UTF-8') }
        def heater = source('src/main/java/com/reinhardt/hbm/blockentity/HeaterBlockEntity.java')
        def boiler = source('src/main/java/com/reinhardt/hbm/blockentity/HeatBoilerBlockEntity.java')
        def industrialBoiler = source('src/main/java/com/reinhardt/hbm/blockentity/IndustrialBoilerBlockEntity.java')
        def solarBoiler = source('src/main/java/com/reinhardt/hbm/blockentity/SolarBoilerBlockEntity.java')
        def thermalConversions = source('src/main/java/com/reinhardt/hbm/fluid/HbmThermalConversions.java')
        def problems = []

        [
                'this.kind == Kind.OVEN ? 0.125D : 1.0D',
                'return baseHeat * 15;',
                'return baseHeat * 3;',
                'return baseHeat * 5;',
                'return baseHeat * 2;',
                'int baseHeat = this.kind == Kind.OVEN ? 500 : 100;',
                'this.burnHeat = heat;',
                'addHeat(this.burnHeat);',
                'return Math.max(0, stack.getBurnTime(null));'
        ].each { required ->
            if (!heater.contains(required)) {
                problems << "Heater is missing audited 1.7.10 fuel contract '${required}'."
            }
        }
        if (heater.contains('WoodBurnerBlockEntity.fuelDuration(stack)') || heater.contains('this.burnHeat = fuelHeat()')) {
            problems << 'Heater must not inherit wood-burner bonuses or overwrite the ModuleBurnTime heat value each tick.'
        }
        [
                'public static final int HEATEX_TANK_CAPACITY = 24_000;',
                'private final HbmFluidTank heatExInputTank',
                'private final HbmFluidTank heatExOutputTank',
                'private void tickHeatExchanger(Level level)',
                'int ops = Math.min(this.heatExchangerAmountToCool, Math.min(inputOps, outputOps));',
                'this.heatEnergy = (int) (this.heatEnergy * 0.999D);',
                'public List<Port> heatExchangerPorts(LevelAccessor level)'
        ].each { required ->
            if (!heater.contains(required)) {
                problems << "Heat exchanger is missing audited 1.7.10 contract '${required}'."
            }
        }
        if (heater.contains('heater.addHeat(240)')) {
            problems << 'Heat exchanger must not use the removed fixed 240 TU/t approximation.'
        }

        [
                'this.inputTank = new HbmFluidTank(HbmFluids.byName("water").orElse(HbmFluids.none()), inputCapacity);',
                'this.outputTank = new HbmFluidTank(HbmFluids.byName("steam").orElse(HbmFluids.none()), inputCapacity * 100);'
        ].each { required ->
            if (!boiler.contains(required)) {
                problems << "Heat boiler is missing audited 1.7.10 contract '${required}'."
            }
        }
        if (!thermalConversions.contains('case "water" -> heating(input, "steam", 200, 1, 100, 1.0D)')) {
            problems << 'Water-to-steam conversion must retain the 1.7.10 200 TU per 1 mB -> 100 mB steam step.'
        }
        if (!boiler.contains('if (level.isClientSide) {')) {
            problems << 'Heat boiler tank and heat mutations must remain server-authoritative as in 1.7.10.'
        }
        if (boiler.contains('outputPerPort') || boiler.contains('Math.min(outputPerPort(), this.outputTank.amount())')) {
            problems << 'Heat boiler output must not be throttled per port; 1.7.10 exposes the full tank to every connection pass.'
        }
        [
                'case "steam" -> heating(',
                'case "hotsteam" -> heating(',
                'case "superhotsteam" -> heating('
        ].each { forbidden ->
            if (thermalConversions.contains(forbidden)) {
                problems << "Boilers must not heat ${forbidden.substring(6, forbidden.indexOf('"', 6))}; 1.7.10 only exposes water\'s first boiler step."
            }
        }
        [
                'case "steam" -> cooling(input, "spentsteam", 100, 1, 200, 0.5D)',
                'case "hotsteam" -> cooling(input, "steam", 1, 10, 2, 0.5D)',
                'case "superhotsteam" -> cooling(input, "hotsteam", 1, 10, 18, 0.5D)',
                'case "ultrahotsteam" -> cooling(input, "superhotsteam", 1, 10, 120, 0.5D)',
                'case "lead_hot" -> cooling(input, "lead", 1, 1, 680, 1.0D)',
                'case "thorium_salt_hot" -> cooling(input, "thorium_salt_depleted", 1, 1, 400, 1.0D)'
        ].each { required ->
            if (!thermalConversions.contains(required)) {
                problems << "Heat exchanger thermal conversion is missing '${required}'."
            }
        }
        if (!industrialBoiler.contains('super(HbmBlockEntities.INDUSTRIAL_BOILER.get(), pos, blockState, 64_000)')
                || !industrialBoiler.contains('private static final int MAX_HEAT = 12_800_000;')) {
            problems << 'Industrial boiler must retain the 1.7.10 64,000 mB water tank and 12,800,000 TU heat capacity.'
        }

        [
                'public static final int INPUT_CAPACITY = 100;',
                'public static final int OUTPUT_CAPACITY = 10_000;',
                'this.heat += amount;',
                'this.heatDisplay = process;',
                'this.heat = 0;'
        ].each { required ->
            if (!solarBoiler.contains(required)) {
                problems << "Solar boiler is missing audited 1.7.10 contract '${required}'."
            }
        }
        if (solarBoiler.contains('0.999D') || solarBoiler.contains('MAX_HEAT')) {
            problems << 'Solar boiler must not cap or decay mirror heat; 1.7.10 treats it as a transient per-tick value.'
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Thermal parity validation failed:\n - " + problems.join('\n - '))
        }
    }
}

tasks.register('validatePowerParity') {
    group = 'verification'
    description = 'Guards audited 1.7.10 turbine, storage, flywheel, and power-gauge contracts.'

    def powerSources = [
            'src/main/java/com/reinhardt/hbm/blockentity/SteamCondenserBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/LargeTurbineBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/IndustrialTurbineBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/LeviathanTurbineBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/GasTurbineBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/PoweredSteamCondenserBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/BatteryReddBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/PowerGaugeBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/client/model/CableModelGeometry.java',
            'src/main/java/com/reinhardt/hbm/client/model/PowerGaugeBakedModel.java',
            'src/main/java/com/reinhardt/hbm/client/HbmLookOverlay.java',
            'src/main/java/com/reinhardt/hbm/power/PowerNetworkManager.java',
            'src/main/java/com/reinhardt/hbm/fluid/HbmThermalConversions.java'
    ]
    inputs.files(powerSources.collect { file(it) })
    inputs.files(
            file('src/main/resources/assets/reinhardtshbm/textures/block/cable_gauge.png'),
            file('src/main/resources/assets/reinhardtshbm/textures/block/deco_red_copper.png')
    )
    outputs.upToDateWhen { false }

    doLast {
        def source = { String path -> file(path).getText('UTF-8') }
        def steamCondenser = source('src/main/java/com/reinhardt/hbm/blockentity/SteamCondenserBlockEntity.java')
        def largeTurbine = source('src/main/java/com/reinhardt/hbm/blockentity/LargeTurbineBlockEntity.java')
        def industrialTurbine = source('src/main/java/com/reinhardt/hbm/blockentity/IndustrialTurbineBlockEntity.java')
        def leviathan = source('src/main/java/com/reinhardt/hbm/blockentity/LeviathanTurbineBlockEntity.java')
        def gasTurbine = source('src/main/java/com/reinhardt/hbm/blockentity/GasTurbineBlockEntity.java')
        def poweredCondenser = source('src/main/java/com/reinhardt/hbm/blockentity/PoweredSteamCondenserBlockEntity.java')
        def batteryRedd = source('src/main/java/com/reinhardt/hbm/blockentity/BatteryReddBlockEntity.java')
        def powerGauge = source('src/main/java/com/reinhardt/hbm/blockentity/PowerGaugeBlockEntity.java')
        def cableGeometry = source('src/main/java/com/reinhardt/hbm/client/model/CableModelGeometry.java')
        def powerGaugeModel = source('src/main/java/com/reinhardt/hbm/client/model/PowerGaugeBakedModel.java')
        def lookOverlay = source('src/main/java/com/reinhardt/hbm/client/HbmLookOverlay.java')
        def powerNetwork = source('src/main/java/com/reinhardt/hbm/power/PowerNetworkManager.java')
        def thermalConversions = source('src/main/java/com/reinhardt/hbm/fluid/HbmThermalConversions.java')
        def problems = []

        [largeTurbine, industrialTurbine, poweredCondenser].eachWithIndex { machine, index ->
            def name = ['Large turbine', 'Industrial turbine', 'Powered steam condenser'][index]
            if (machine.contains('MAX_TRANSFER_PER_PORT') || machine.contains('Math.min(MAX_TRANSFER_PER_PORT')) {
                problems << "${name} must not impose a per-port fluid transfer cap; 1.7.10 provides the full tank amount to each connection pass."
            }
        }
        if (gasTurbine.contains('MAX_TRANSFER_PER_PORT') || gasTurbine.contains('Math.min(MAX_TRANSFER_PER_PORT')) {
            problems << 'Combined-cycle gas turbine must not impose a per-port fluid transfer cap; 1.7.10 exposes each tank at its full current capacity.'
        }
        if (!poweredCondenser.contains('long requiredPower = (long) convert * POWER_PER_MB;')
                || !poweredCondenser.contains('if (convert <= 0 || this.power * 100L < requiredPower * 95L)')
                || poweredCondenser.contains('maxByPower')) {
            problems << 'Powered steam condenser must retain the latest 1.7.10 all-or-nothing conversion gate with its five-percent power tolerance.'
        }

        [
                'BatteryPackItem.chargeFromMachine',
                '(long) (',
                '* 0.95D'
        ].each { required ->
            if (!largeTurbine.contains(required)) {
                problems << "Large turbine is missing audited 1.7.10 buffer-loss contract '${required}'."
            }
        }

        [
                'if (level.isClientSide) {',
                'condenser.tryConvert();',
                'condenser.sendOutput(level);'
        ].each { required ->
            if (!steamCondenser.contains(required)) {
                problems << "Steam condenser is missing audited 1.7.10 server-authority contract '${required}'."
            }
        }

        [
                'private static final double FLYWHEEL_MAX_ENERGY = 50_000_000.0D;',
                'private long maxPower;',
                'private long flywheelEnergy;',
                'this.flywheelEnergy += (long) (ops * step.heatEnergy() * step.turbineEfficiency() * efficiency);',
                'this.spin = this.flywheelEnergy / FLYWHEEL_MAX_ENERGY;',
                'this.lastPowerTarget = Math.min((long) (Math.max(this.spin, 0.05D) * this.maxPower), this.flywheelEnergy);',
                'this.flywheelEnergy -= this.lastPowerTarget;',
                'this.powerBuffer = this.lastPowerTarget;'
        ].each { required ->
            if (!industrialTurbine.contains(required)) {
                problems << "Industrial turbine is missing audited 1.7.10 flywheel contract '${required}'."
            }
        }
        if (industrialTurbine.contains('ACCELERATION') || industrialTurbine.contains('targetSpin')) {
            problems << 'Industrial turbine must not use the removed approximation ramp; it must use the 1.7.10 flywheel-energy model.'
        }

        [
                'case "steam" -> cooling(input, "spentsteam", 100, 1, 200, 1.0D)',
                'case "hotsteam" -> cooling(input, "steam", 1, 10, 2, 1.0D)',
                'case "superhotsteam" -> cooling(input, "hotsteam", 1, 10, 18, 1.0D)',
                'case "ultrahotsteam" -> cooling(input, "superhotsteam", 1, 10, 120, 1.0D)'
        ].each { required ->
            if (!thermalConversions.contains(required)) {
                problems << "Steam conversion chain is missing '${required}'."
            }
        }
        [
                'this.outputTank.fill(step.output(), ops * step.amountProduced(), false);',
                'long convertedHeat = (long) ops * step.heatEnergy();',
                'this.powerBuffer = (long) (convertedHeat * step.turbineEfficiency() * EFFICIENCY);'
        ].each { required ->
            if (!leviathan.contains(required)) {
                problems << "Leviathan turbine is missing audited high-throughput steam contract '${required}'."
            }
        }

        [
                'if (this.fuelTank.amount() * 10 > this.fuelTank.capacity()) {',
                'this.fuelTank.amount() * 0.0001D',
                'this.counter = 225;',
                'if (fuelConsumed > fuelBeforeBurn) {',
                'if (this.lubricantTank.amount() <= 0) {',
                'if (slot == ID_SLOT && applyIdentifier()) {',
                'private boolean setFuelType(HbmFluidDefinition next)',
                'return setFuelType(FluidIdentifierItem.primary(identifier));'
        ].each { required ->
            if (!gasTurbine.contains(required)) {
                problems << "Gas turbine is missing audited 1.7.10 runtime contract '${required}'."
            }
        }

        [
                'public static final long MAX_POWER = 10_000_000L;',
                'public static final int TANK_CAPACITY = 1_000_000;',
                'public static final int POWER_PER_MB = 10;',
                'this.power = Math.max(0L, this.power - requiredPower);'
        ].each { required ->
            if (!poweredCondenser.contains(required)) {
                problems << "Powered condenser is missing audited 1.7.10 contract '${required}'."
            }
        }
        def poweredCondenserClient = poweredCondenser.substring(poweredCondenser.indexOf('private void tickClient'), poweredCondenser.indexOf('private void tryConvert'))
        if (poweredCondenserClient.contains('this.waterTimer--;')) {
            problems << 'Powered condenser client animation must use the server-synchronised water timer and must not decrement it locally.'
        }

        [
                'private int redLow = MODE_INPUT;',
                'private int redHigh = MODE_OUTPUT;',
                'private PowerEndpoint.ConnectionPriority priority = PowerEndpoint.ConnectionPriority.LOW;',
                'this.level.getSignal(neighbor, direction.getOpposite()) > 0'
        ].each { required ->
            if (!batteryRedd.contains(required)) {
                problems << "FEnSU is missing audited 1.7.10 redstone or priority contract '${required}'."
            }
        }

        if (!cableGeometry.contains('sprite.getU((minU + (maxU - minU) * vertex.u) / 16.0F)')
                || !cableGeometry.contains('sprite.getV((minV + (maxV - minV) * vertex.v) / 16.0F)')) {
            problems << 'Power-gauge quad UVs must convert the legacy 0..16 pixel coordinates to TextureAtlasSprite 0..1 coordinates.'
        }
        [
                'return List.of(face(side, base), face(side, gauge));',
                'quads.add(face(direction, base));',
                'quads.add(face(direction, gauge));'
        ].each { required ->
            if (!powerGaugeModel.contains(required)) {
                problems << "Power gauge lost the 1.7.10 base-plus-transparent-overlay render contract '${required}'."
            }
        }
        int gaugeWindowBoundary = powerGauge.indexOf('if (level.getGameTime() % 20L == 0L)')
        int gaugeWindowAccumulate = powerGauge.indexOf('gauge.secondAccumulator += gauge.deltaTick;')
        if (gaugeWindowBoundary < 0 || gaugeWindowAccumulate < gaugeWindowBoundary) {
            problems << 'Power gauge must publish/reset the completed one-second window before adding the current tick, matching TileEntityCableGauge.'
        }
        [
                'return this.transferredPower.getOrDefault(clickedPos, 0L);',
                'Map<Integer, Long> transferredByComponent = new HashMap<>();',
                'for (BlockPos node : component.nodes)'
        ].each { required ->
            if (!powerNetwork.contains(required)) {
                problems << "Power gauge lost its complete-network transfer snapshot contract '${required}'."
            }
        }
        int gaugeLookupStart = powerNetwork.indexOf('long transferredPowerAt(BlockPos clickedPos)')
        int gaugeLookupEnd = powerNetwork.indexOf('private void pruneInvalidEndpoints', gaugeLookupStart)
        if (gaugeLookupStart < 0 || gaugeLookupEnd < 0
                || powerNetwork.substring(gaugeLookupStart, gaugeLookupEnd).contains('ArrayDeque')) {
            problems << 'Power-gauge reads must remain O(1); a per-tick graph traversal must not be restored.'
        }
        if (!lookOverlay.contains('String.format("%,d HE/t", gauge.deltaTick())')
                || !lookOverlay.contains('String.format("%,d HE/s", gauge.deltaLastSecond())')) {
            problems << 'Power gauge must expose both HE/t and HE/s through the look overlay.'
        }
        def sha256 = { File input ->
            java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes)
                    .collect { String.format('%02X', it & 0xff) }.join()
        }
        def gaugeTexture = file('src/main/resources/assets/reinhardtshbm/textures/block/cable_gauge.png')
        def baseTexture = file('src/main/resources/assets/reinhardtshbm/textures/block/deco_red_copper.png')
        if (sha256(gaugeTexture) != '3320A339A84C8F9A0C700F2EB7697F471763BE72638268EFAB08486CAD482D81') {
            problems << 'Power-gauge overlay texture no longer matches the audited 1.7.10 asset.'
        }
        if (sha256(baseTexture) != '3D6A87C99A36F18772ACF9EE8E5C5207D3589584948AC03D8167FBD1AF47FED5') {
            problems << 'Power-gauge red-copper base texture no longer matches the audited 1.7.10 asset.'
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Power parity validation failed:\n - " + problems.join('\n - '))
        }
    }
}

tasks.register('validateLegacyItemPorts') {
    group = 'verification'
    description = 'Fails when standalone 1.7.10 items or the five flattened crop blocks regress.'

    def unresolvedManifest = file('src/main/resources/legacy/reinhardtshbm/items.txt')
    def itemRegistry = file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java')
    def blockRegistry = file('src/main/java/com/reinhardt/hbm/registry/HbmBlocks.java')
    def legacyRegistry = file('src/main/java/com/reinhardt/hbm/registry/LegacyHbmContent.java')
    def cropSources = [
            file('src/main/java/com/reinhardt/hbm/block/HbmPlantBlock.java'),
            file('src/main/java/com/reinhardt/hbm/block/HempPlantBlock.java'),
            file('src/main/java/com/reinhardt/hbm/block/MustardWillowPlantBlock.java')
    ]
    def removedCropItem = file('src/main/java/com/reinhardt/hbm/item/LegacyCropBlockItem.java')
    def removedFlowerBlock = file('src/main/java/com/reinhardt/hbm/block/MustardWillowFlowerBlock.java')
    def removedTallBlock = file('src/main/java/com/reinhardt/hbm/block/MustardWillowTallBlock.java')
    def creativeTabs = file('src/main/java/com/reinhardt/hbm/registry/HbmCreativeTabs.java')
    def cropBlockstateRoot = file("src/main/resources/assets/${project.mod_id}/blockstates")
    def cropModelRoot = file("src/main/resources/assets/${project.mod_id}/models/item")
    def zhCnFile = file("src/main/resources/assets/${project.mod_id}/lang/zh_cn.json")
    def enUsFile = file("src/main/resources/assets/${project.mod_id}/lang/en_us.json")
    inputs.files unresolvedManifest, itemRegistry, blockRegistry, legacyRegistry, cropSources, creativeTabs, zhCnFile, enUsFile
    inputs.dir cropBlockstateRoot
    inputs.dir cropModelRoot
    outputs.upToDateWhen { false }

    doLast {
        def unresolved = unresolvedManifest.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { !it.isEmpty() && !it.startsWith('#') }
        def itemRegistrySource = itemRegistry.getText('UTF-8')
        def blockRegistrySource = blockRegistry.getText('UTF-8')
        def legacyRegistrySource = legacyRegistry.getText('UTF-8')
        def creativeSource = creativeTabs.getText('UTF-8')
        def parser = new groovy.json.JsonSlurper()
        def zhCn = parser.parse(zhCnFile)
        def enUs = parser.parse(enUsFile)
        def problems = []
        if (!unresolved.isEmpty()) {
            problems << "Unported standalone 1.7.10 item ids: ${unresolved.join(', ')}"
        }
        if (itemRegistrySource.contains('LegacyCatalogItem') || itemRegistrySource.contains('registerRemainingLegacyCatalogItems')) {
            problems << 'Generic LegacyCatalogItem fallback must not be reintroduced.'
        }
        def crops = [
                plant_foxglove: 'PLANT_FOXGLOVE',
                plant_tobacco: 'PLANT_TOBACCO',
                plant_nightshade: 'PLANT_NIGHTSHADE',
                plant_hemp: 'PLANT_HEMP',
                plant_mustard_willow: 'PLANT_MUSTARD_WILLOW'
        ]
        crops.each { id, field ->
            if (!blockRegistrySource.contains("${field} = registerBlockWithoutItem(\"${id}\"")) {
                problems << "Missing independently registered crop block ${project.mod_id}:${id}."
            }
            if (!itemRegistrySource.contains("\"${id}\", () -> HbmBlocks.${field}.get()")) {
                problems << "Missing BlockItem binding for independently registered crop ${project.mod_id}:${id}."
            }
            if (!file("${cropModelRoot}/${id}.json").isFile()) {
                problems << "Missing flat crop item model ${id}.json."
            }
            if (!file("${cropBlockstateRoot}/${id}.json").isFile()) {
                problems << "Missing independently registered crop blockstate ${id}.json."
            }
            ["item.${project.mod_id}.${id}", "block.${project.mod_id}.${id}"].each { translationKey ->
                def key = translationKey.toString()
                if (!zhCn.containsKey(key) || !enUs.containsKey(key)) {
                    problems << "Missing zh_cn or en_us translation for ${translationKey}."
                }
            }
        }
        if (removedCropItem.exists() || removedFlowerBlock.exists() || removedTallBlock.exists()) {
            problems << 'Legacy shared crop item/block implementations must remain deleted.'
        }
        if (blockRegistrySource.contains('PLANT_FLOWER') || blockRegistrySource.contains('PLANT_TALL')) {
            problems << 'Shared plant_flower/plant_tall block registrations must not be reintroduced.'
        }
        if (!legacyRegistrySource.contains('"plant_flower"') || !legacyRegistrySource.contains('"plant_tall"')) {
            problems << 'Removed shared crop IDs must stay retired instead of returning as placeholder blocks.'
        }
        def hempSource = cropSources[1].getText('UTF-8')
        def willowSource = cropSources[2].getText('UTF-8')
        ['IntegerProperty.create("age", 0, 1)', 'BlockStateProperties.DOUBLE_BLOCK_HALF'].each { required ->
            if (!hempSource.contains(required)) {
                problems << "Flattened hemp lost state contract '${required}'."
            }
        }
        ['IntegerProperty.create("age", 0, 4)', 'BlockStateProperties.DOUBLE_BLOCK_HALF',
         'HbmPlantBlock.hasAdjacentWater', 'HbmPlantBlock.isDeadOrOily'].each { required ->
            if (!willowSource.contains(required)) {
                problems << "Flattened mustard willow lost growth contract '${required}'."
            }
        }
        if (!creativeSource.contains('for (var crop : HbmItems.CROP_ITEMS)')) {
            problems << 'Flat crop items are missing from the creative inventory.'
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Legacy item-port validation failed:\n - " + problems.join('\n - '))
        }
    }
}

tasks.register('validateFlattenedDrillbits') {
    group = 'verification'
    description = 'Guards the ten independently registered drillbits and their complete 1.7.10 assembly recipe chain.'

    def itemRegistry = file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java')
    def drillbitItem = file('src/main/java/com/reinhardt/hbm/item/DrillbitItem.java')
    def creativeTabs = file('src/main/java/com/reinhardt/hbm/registry/HbmCreativeTabs.java')
    def recipeRoot = file("src/main/resources/data/${project.mod_id}/recipe/assembly_machine")
    def modelRoot = file("src/main/resources/assets/${project.mod_id}/models/item")
    def zhCnFile = file("src/main/resources/assets/${project.mod_id}/lang/zh_cn.json")
    def enUsFile = file("src/main/resources/assets/${project.mod_id}/lang/en_us.json")
    inputs.files(itemRegistry, drillbitItem, creativeTabs, zhCnFile, enUsFile)
    inputs.dir(recipeRoot)
    inputs.dir(modelRoot)
    outputs.upToDateWhen { false }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def registrySource = itemRegistry.getText('UTF-8')
        def itemSource = drillbitItem.getText('UTF-8')
        def creativeSource = creativeTabs.getText('UTF-8')
        def zhCn = parser.parse(zhCnFile)
        def enUs = parser.parse(enUsFile)
        def problems = []
        def expected = [
                steel: [type: 'STEEL', inputs: [['tag', 'c:ingots/steel', 12], ['tag', 'c:ingots/tungsten', 4]]],
                steel_diamond: [type: 'STEEL_DIAMOND', inputs: [['item', "${project.mod_id}:drillbit_steel", 1], ['tag', 'c:dusts/diamond', 16]]],
                hss: [type: 'HSS', inputs: [['tag', 'c:ingots/dura_steel', 12], ['tag', 'c:ingots/plastic', 12], ['tag', 'c:ingots/titanium', 8]]],
                hss_diamond: [type: 'HSS_DIAMOND', inputs: [['item', "${project.mod_id}:drillbit_hss", 1], ['tag', 'c:dusts/diamond', 24]]],
                desh: [type: 'DESH', inputs: [['tag', 'c:ingots/desh', 16], ['tag', 'c:ingots/rubber', 12], ['tag', 'c:ingots/niobium', 4]]],
                desh_diamond: [type: 'DESH_DIAMOND', inputs: [['item', "${project.mod_id}:drillbit_desh", 1], ['tag', 'c:dusts/diamond', 32]]],
                tcalloy: [type: 'TCALLOY', inputs: [['tag', 'c:ingots/resistant_alloy', 20], ['tag', 'c:ingots/desh', 12], ['tag', 'c:ingots/rubber', 8]]],
                tcalloy_diamond: [type: 'TCALLOY_DIAMOND', inputs: [['item', "${project.mod_id}:drillbit_tcalloy", 1], ['tag', 'c:dusts/diamond', 48]]],
                ferro: [type: 'FERRO', inputs: [['tag', 'c:ingots/ferrouranium', 24], ['tag', 'c:ingots/resistant_alloy', 12], ['tag', 'c:ingots/bismuth', 4]]],
                ferro_diamond: [type: 'FERRO_DIAMOND', inputs: [['item', "${project.mod_id}:drillbit_ferro", 1], ['tag', 'c:dusts/diamond', 56]]]
        ]

        expected.each { variant, contract ->
            def id = "drillbit_${variant}"
            if (!registrySource.contains("drillbit(\"${id}\", DrillbitItem.DrillType.${contract.type})")) {
                problems << "Missing independent item registration ${project.mod_id}:${id}."
            }
            if (!file("${modelRoot}/${id}.json").isFile()) {
                problems << "Missing independent item model ${id}.json."
            }
            def translationKey = "item.${project.mod_id}.${id}".toString()
            if (!zhCn.containsKey(translationKey) || !enUs.containsKey(translationKey)) {
                problems << "Missing zh_cn or en_us translation for ${translationKey}."
            }

            def recipeFile = file("${recipeRoot}/${id}.json")
            if (!recipeFile.isFile()) {
                problems << "Missing assembly recipe ${id}.json."
                return
            }
            def recipe = parser.parse(recipeFile)
            if (recipe.type != "${project.mod_id}:assembly_machine" || recipe.duration != 100 || recipe.power != 100) {
                problems << "${id}.json must retain the audited assembly-machine 100 tick / 100 HE/t contract."
            }
            if (recipe.result?.id != "${project.mod_id}:${id}" || recipe.result?.containsKey('components')) {
                problems << "${id}.json must output the independent ${project.mod_id}:${id} item without legacy components."
            }
            def actualInputs = (recipe.ingredients ?: []).collect { counted ->
                def ingredient = counted.ingredient ?: [:]
                def key = ingredient.containsKey('item') ? 'item' : ingredient.containsKey('tag') ? 'tag' : 'unsupported'
                [key, ingredient[key], counted.count]
            }
            if (actualInputs != contract.inputs) {
                problems << "${id}.json inputs differ from the audited 1.7.10 recipe: expected ${contract.inputs}, found ${actualInputs}."
            }
        }

        if (registrySource.contains('DeferredItem<Item> DRILLBIT =')
                || itemSource.contains('DataComponents')
                || itemSource.contains('CustomModelData')
                || itemSource.contains('addCreativeVariants')
                || creativeSource.contains('instanceof DrillbitItem')
                || file("${modelRoot}/drillbit.json").exists()) {
            problems << 'Legacy component-backed drillbit registration/model path must not be reintroduced.'
        }

        def recipeFiles = fileTree(recipeRoot) { include 'drillbit_*.json' }.files
        if (recipeFiles.size() != expected.size()) {
            problems << "Expected exactly ${expected.size()} flattened drillbit recipes, found ${recipeFiles.size()}."
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Flattened drillbit validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle("Flattened drillbit validation passed (${expected.size()} independent items and recipes).")
    }
}

