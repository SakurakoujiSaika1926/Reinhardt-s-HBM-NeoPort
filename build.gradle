        }
        [
                'ore_cinnabar': ['reinhardtshbm:ore_cinnabar', 'reinhardtshbm:cinnabar'],
                'ore_deepslate_cinnabar': ['reinhardtshbm:ore_deepslate_cinnabar', 'reinhardtshbm:cinnabar']
