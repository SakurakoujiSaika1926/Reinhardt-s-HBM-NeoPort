    }
}

tasks.register('validateModernOreGeology') {
    group = 'verification'
    description = 'Guards the canonical stone/deepslate/nether ore families and rejects every retired depth-rock id.'
    inputs.files(
            fileTree('src/main/java/com/reinhardt/hbm') { include '**/*.java' },
            fileTree('src/main/resources/assets/reinhardtshbm') { include '**/*' },
            fileTree('src/main/resources/data') { include '**/*' }
    )
    outputs.upToDateWhen { false }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def problems = []
        def readJson = { String path ->
            File source = file(path)
            if (!source.isFile()) {
                problems << "Missing modern-geology resource ${path}"
                return null
            }
            parser.parseText(source.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
        }
        def valueSet = { Object json ->
            json instanceof Map && json.values instanceof Collection
                    ? json.values.collect { String.valueOf(it) }.toSet()
                    : [] as Set
        }
        def itemNames
        itemNames = { Object node ->
            def names = []
            if (node instanceof Map) {
                node.each { key, value ->
                    if (String.valueOf(key) == 'name' && value instanceof String) names << value
                    names.addAll(itemNames(value))
                }
            } else if (node instanceof Collection) {
                node.each { names.addAll(itemNames(it)) }
            }
            names
        }

        def overworldFamilies = [
                borax: [drop: 'powder_borax', min: null, max: null],
                zirconium: [drop: 'nugget_zirconium', min: 2, max: 3]
        ]
        overworldFamilies.each { material, dropContract ->
            def stoneId = "reinhardtshbm:ore_${material}"
            def deepslateId = "reinhardtshbm:ore_deepslate_${material}"
            def configured = readJson("src/main/resources/data/reinhardtshbm/worldgen/configured_feature/ore_${material}.json")
            def targets = configured?.config?.targets instanceof Collection
                    ? configured.config.targets.collectEntries { target ->
                        [(String.valueOf(target?.target?.tag)): String.valueOf(target?.state?.Name)]
                    }
                    : [:]
            if (configured != null && (configured.type != 'minecraft:ore'
                    || (configured.config?.size as Integer) != 4
                    || targets != [
                    'minecraft:stone_ore_replaceables': stoneId,
                    'minecraft:deepslate_ore_replaceables': deepslateId
            ])) {
                problems << "${material} worldgen must map stone and deepslate replaceables to their matching canonical blocks."
            }

            def placed = readJson("src/main/resources/data/reinhardtshbm/worldgen/placed_feature/ore_${material}.json")
            def placements = placed?.placement instanceof Collection ? placed.placement : []
            def countPlacement = placements.find { it?.type == 'minecraft:count' }
            def heightPlacement = placements.find { it?.type == 'minecraft:height_range' }
            if (placed != null && (placed.feature != stoneId
                    || (countPlacement?.count as Integer) != 1
                    || heightPlacement?.height?.type != 'minecraft:uniform'
                    || (heightPlacement?.height?.min_inclusive?.above_bottom as Integer) != 8
                    || (heightPlacement?.height?.max_inclusive?.absolute as Integer) != 23
                    || !placements.any { it?.type == 'minecraft:in_square' }
                    || !placements.any { it?.type == 'minecraft:biome' })) {
                problems << "${material} placement must match the audited modern cinnabar distribution."
            }

            def modifier = readJson("src/main/resources/data/reinhardtshbm/neoforge/biome_modifier/add_ore_${material}.json")
            if (modifier != null && (modifier.type != 'neoforge:add_features'
                    || modifier.biomes != '#minecraft:is_overworld'
                    || modifier.features != stoneId
                    || modifier.step != 'underground_ores')) {
                problems << "${material} biome modifier must inject its canonical placed feature into overworld underground ores."
            }

            ['block', 'item'].each { kind ->
                def tag = readJson("src/main/resources/data/c/tags/${kind}/ores/${material}.json")
                if (valueSet(tag) != [stoneId, deepslateId] as Set) {
                    problems << "c:ores/${material} ${kind} tag must contain exactly ${stoneId} and ${deepslateId}."
                }
            }

            ["ore_${material}", "ore_deepslate_${material}"].each { blockName ->
                def blockId = "reinhardtshbm:${blockName}"
                [
                        "src/main/resources/assets/reinhardtshbm/blockstates/${blockName}.json",
                        "src/main/resources/assets/reinhardtshbm/models/block/${blockName}.json",
                        "src/main/resources/assets/reinhardtshbm/models/item/${blockName}.json",
                        "src/main/resources/assets/reinhardtshbm/textures/block/${blockName}.png"
                ].findAll { !file(it).isFile() }.each { problems << "Missing ${blockName} client resource ${it}" }

                def loot = readJson("src/main/resources/data/reinhardtshbm/loot_table/blocks/${blockName}.json")
                def names = itemNames(loot)
                def expectedNames = [blockId.toString(), "reinhardtshbm:${dropContract.get('drop')}".toString()]
                def lootText = loot == null ? '' : groovy.json.JsonOutput.toJson(loot)
                if (!names.collect { String.valueOf(it) }.containsAll(expectedNames)
                        || !lootText.contains('minecraft:silk_touch')
                        || !lootText.contains('minecraft:fortune')) {
                    problems << "${blockName} loot must preserve Silk Touch and Fortune while dropping ${dropContract.get('drop')}."
                }
                if (dropContract.get('min') != null
                        && (!lootText.contains("\"min\":${dropContract.get('min')}")
                        || !lootText.contains("\"max\":${dropContract.get('max')}"))) {
                    problems << "${blockName} loot must retain the audited ${dropContract.get('min')}-${dropContract.get('max')} drop range."
                }
            }
        }

        def neodymiumId = 'reinhardtshbm:ore_nether_neodymium'
        ['block', 'item'].each { kind ->
            def tag = readJson("src/main/resources/data/c/tags/${kind}/ores/neodymium.json")
            if (valueSet(tag) != [neodymiumId] as Set) {
                problems << "c:ores/neodymium ${kind} tag must contain exactly ${neodymiumId}."
            }
        }
        def neodymiumConfigured = readJson('src/main/resources/data/reinhardtshbm/worldgen/configured_feature/nether_neodymium.json')
        def neodymiumPlaced = readJson('src/main/resources/data/reinhardtshbm/worldgen/placed_feature/nether_neodymium.json')
        def neodymiumModifier = readJson('src/main/resources/data/reinhardtshbm/neoforge/biome_modifier/add_nether_neodymium.json')
        if (neodymiumConfigured != null && neodymiumConfigured.type != 'reinhardtshbm:nether_neodymium') {
            problems << 'Nether neodymium configured feature must use the canonical feature type.'
        }
        if (neodymiumPlaced != null && neodymiumPlaced.feature != 'reinhardtshbm:nether_neodymium') {
            problems << 'Nether neodymium placed feature must use the canonical configured feature.'
        }
        if (neodymiumModifier != null && (neodymiumModifier.features != 'reinhardtshbm:nether_neodymium'
                || neodymiumModifier.biomes != '#minecraft:is_nether'
                || neodymiumModifier.step != 'underground_ores')) {
            problems << 'Nether neodymium must be injected at the underground-ores step.'
        }
        ['blockstates', 'models/block', 'models/item', 'textures/block'].each { folder ->
            String extension = folder == 'textures/block' ? 'png' : 'json'
            String path = "src/main/resources/assets/reinhardtshbm/${folder}/ore_nether_neodymium.${extension}"
            if (!file(path).isFile()) problems << "Missing Nether neodymium client resource ${path}"
        }
        def neodymiumLoot = readJson('src/main/resources/data/reinhardtshbm/loot_table/blocks/ore_nether_neodymium.json')
        def neodymiumLootText = neodymiumLoot == null ? '' : groovy.json.JsonOutput.toJson(neodymiumLoot)
        if (!itemNames(neodymiumLoot).containsAll([neodymiumId, 'reinhardtshbm:fragment_neodymium'])
                || !neodymiumLootText.contains('minecraft:silk_touch')
                || !neodymiumLootText.contains('minecraft:fortune')
                || !neodymiumLootText.contains('"min":2')
                || !neodymiumLootText.contains('"max":3')) {
            problems << 'Nether neodymium loot must preserve Silk Touch, Fortune and the audited 2-3 fragment range.'
        }

        ['iron': 24, 'titanium': 32, 'tungsten': 32].each { material, chance ->
            String id = "bedrock_deepslate_cluster_${material}"
            def configured = readJson("src/main/resources/data/reinhardtshbm/worldgen/configured_feature/${id}.json")
            def placed = readJson("src/main/resources/data/reinhardtshbm/worldgen/placed_feature/${id}.json")
            def modifier = readJson("src/main/resources/data/reinhardtshbm/neoforge/biome_modifier/add_${id}.json")
            if (configured != null && configured.type != "reinhardtshbm:${id}") problems << "${id} configured feature type is wrong."
            if (placed != null && placed.feature != "reinhardtshbm:${id}") problems << "${id} placed feature reference is wrong."
            if (modifier != null && modifier.features != "reinhardtshbm:${id}") problems << "${id} biome modifier reference is wrong."
        }

        def blockSource = file('src/main/java/com/reinhardt/hbm/registry/HbmBlocks.java').getText('UTF-8')
        [
                'ORE_BORAX = ore("ore_borax"',
                'ORE_DEEPSLATE_BORAX = ore("ore_deepslate_borax"',
                'ORE_ZIRCONIUM = ore("ore_zirconium"',
                'ORE_DEEPSLATE_ZIRCONIUM = ore("ore_deepslate_zirconium"',
                'ORE_NETHER_NEODYMIUM = ore("ore_nether_neodymium"'
        ].findAll { !blockSource.contains(it) }.each { problems << "Missing canonical block registration contract ${it}" }

        def neodymiumSource = file('src/main/java/com/reinhardt/hbm/worldgen/NetherNeodymiumFeature.java').getText('UTF-8')
        [
                'private static final int SIZE = 7;',
                'private static final double FILL = 0.6D;',
                'private static final int CHANCE = 16;',
                'generateCondition(level, chunkX, 0, 3, chunkZ, random)',
                'generateCondition(level, chunkX, 125, 3, chunkZ, random)',
                'HbmBlocks.ORE_NETHER_NEODYMIUM',
                'Blocks.NETHERRACK.defaultBlockState()'
        ].findAll { !neodymiumSource.contains(it) }.each { problems << "Nether neodymium parity source is missing ${it}" }

        def retiredBlockIds = [
                'stone_depth', 'stone_depth_nether',
                'depth_brick', 'depth_dnt', 'depth_tiles', 'depth_nether_brick', 'depth_nether_tiles',
                'cluster_depth_iron', 'cluster_depth_titanium', 'cluster_depth_tungsten',
                'ore_depth_borax', 'ore_depth_cinnabar', 'ore_depth_zirconium',
                'ore_depth_nether_neodymium', 'ore_depth_nether_nitan'
        ]
        def retiredFeatureIds = [
                'depth_cluster_iron', 'depth_cluster_titanium', 'depth_cluster_tungsten',
                'depth_ore_borax', 'depth_ore_cinnabar', 'depth_ore_zirconium',
                'nether_depth_neodymium'
        ]
        def forbiddenResourceStems = (retiredBlockIds + retiredFeatureIds + retiredFeatureIds.collect { 'add_' + it }).toSet()
        fileTree('src/main/resources') { exclude 'legacy/**' }.files.each { resource ->
            String stem = resource.name.contains('.') ? resource.name.substring(0, resource.name.lastIndexOf('.')) : resource.name
            if (forbiddenResourceStems.contains(stem)) {
                problems << "Retired depth-system resource still exists: ${resource}"
            }
        }
        fileTree('src/main/java/com/reinhardt/hbm') { include '**/*.java' }.files
                .findAll { it.name != 'LegacyHbmContent.java' }
                .each { source ->
                    String text = source.getText('UTF-8')
                    (retiredBlockIds + retiredFeatureIds + [
                            'DepthRockBlock', 'DepthOreBlock', 'DepthClusterDepositFeature',
                            'NetherDepthNeodymiumFeature', 'canBreakDepthRock', 'depthRockBreaker'
                    ]).findAll { text.contains(it) }.each { token ->
                        problems << "Retired depth-system token ${token} remains in ${source}"
                    }
                }
        String retiredSource = file('src/main/java/com/reinhardt/hbm/registry/LegacyHbmContent.java').getText('UTF-8')
        retiredBlockIds.findAll { !retiredSource.contains('"' + it + '"') }.each {
            problems << "Retired legacy block id is not explicitly suppressed: ${it}"
        }

        ['ore_borax', 'ore_deepslate_borax', 'ore_zirconium', 'ore_deepslate_zirconium', 'ore_nether_neodymium'].each { texture ->
            File textureFile = file("src/main/resources/assets/reinhardtshbm/textures/block/${texture}.png")
            if (textureFile.isFile()) {
                def image = javax.imageio.ImageIO.read(textureFile)
                if (image == null || image.width != 16 || image.height != 16) {
                    problems << "${texture} texture must be a readable 16x16 PNG."
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Modern ore geology validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle('Modern ore geology validation passed (unique stone/deepslate/nether blocks, generation, drops, tags, resources, and complete depth-system retirement)')
    }
}

tasks.register('validateTurretRecipeChain') {
    group = 'verification'
    description = 'Checks the complete survival acquisition path for craftable HBM turrets and their 528 blueprints.'
    inputs.dir file("src/main/resources/data/${project.mod_id}/recipe/assembly_machine")
    inputs.file file("src/main/resources/data/${project.mod_id}/recipe/turret_sentry.json")
    inputs.file file('src/main/java/com/reinhardt/hbm/machine/AnnihilatorRecipes.java')
    inputs.file file('src/main/java/com/reinhardt/hbm/item/BlueprintItem.java')
    inputs.file file('src/main/java/com/reinhardt/hbm/item/FoundryMoldItem.java')
    inputs.file file('src/main/java/com/reinhardt/hbm/recipe/anvil/HbmAnvilRecipes.java')
    outputs.upToDateWhen { false }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def problems = []
        def expectedAssemblyTurrets = [
                turret_arty    : '528.arty',
                turret_chekhov : '528.bmg',
                turret_friendly: '528.bmg',
                turret_fritz   : '528.bmg',
                turret_himars  : '528.arty',
                turret_howard  : '528.bmg',
                turret_jeremy  : '528.bmg',
                turret_maxwell : '528.bmg',
                turret_richard : '528.bmg',
                turret_tauon   : '528.bmg'
        ]

        expectedAssemblyTurrets.each { id, pool ->
            File recipeFile = file("src/main/resources/data/${project.mod_id}/recipe/assembly_machine/${id}.json")
            if (!recipeFile.isFile()) {
                problems << "missing assembly recipe for ${project.mod_id}:${id}"
                return
            }
            def recipe = parser.parseText(recipeFile.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
            if (recipe.type != "${project.mod_id}:assembly_machine") {
                problems << "${project.relativePath(recipeFile)} has type ${recipe.type}"
            }
            if (recipe.result?.id != "${project.mod_id}:${id}") {
                problems << "${project.relativePath(recipeFile)} outputs ${recipe.result?.id}"
            }
            def pools = recipe.blueprint_pools instanceof List ? recipe.blueprint_pools : [recipe.blueprint_pools]
            if (pools != [pool]) {
                problems << "${project.relativePath(recipeFile)} requires ${pools}, expected [${pool}]"
            }
            if (!(recipe.ingredients instanceof List) || recipe.ingredients.isEmpty()) {
                problems << "${project.relativePath(recipeFile)} has no item ingredients"
            }
        }

        File sentryFile = file("src/main/resources/data/${project.mod_id}/recipe/turret_sentry.json")
        def sentry = parser.parseText(sentryFile.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
        if (sentry.type != 'minecraft:crafting_shaped' || sentry.result?.id != "${project.mod_id}:turret_sentry") {
            problems << "${project.relativePath(sentryFile)} must remain the survival crafting recipe for ${project.mod_id}:turret_sentry"
        }

        String annihilatorSource = file('src/main/java/com/reinhardt/hbm/machine/AnnihilatorRecipes.java').getText('UTF-8')
        int payoutStart = annihilatorSource.indexOf('public static Payout highestPayout')
        int payoutEnd = annihilatorSource.indexOf('public static void incrementAll', payoutStart)
        if (payoutStart < 0 || payoutEnd < 0) {
            problems << 'Unable to locate AnnihilatorRecipes.highestPayout for 528 blueprint validation'
        } else {
            String payoutBody = annihilatorSource.substring(payoutStart, payoutEnd)
            if (!payoutBody.contains('HbmConfig.ENABLE_528_MODE.get()')) {
                problems << 'Annihilator blueprint payouts are not gated by enable528Mode'
            }
            if (payoutBody.contains('HbmConfig.ENABLE_EXPENSIVE_MODE.get()')) {
                problems << 'Annihilator blueprint payouts incorrectly depend on enableExpensiveMode'
            }
        }
        if (!annihilatorSource.contains('variant("ammo_standard", "bmg50_fmj", 256, "528.bmg")')) {
            problems << 'Missing the survival 528.bmg annihilator milestone'
        }
        if (!annihilatorSource.contains('variant("ammo_arty", "ammo_arty", 128, "528.arty")')) {
            problems << 'Missing the survival 528.arty annihilator milestone'
        }

        String moldSource = file('src/main/java/com/reinhardt/hbm/item/FoundryMoldItem.java').getText('UTF-8')
        if (!moldSource.contains('shape(26, 0, "mechanism", FoundryShape.MECHANISM, 1)')) {
            problems << 'Foundry mold id 26 is no longer the mechanism mold required by turret recipes'
        }
        String anvilSource = file('src/main/java/com/reinhardt/hbm/recipe/anvil/HbmAnvilRecipes.java').getText('UTF-8')
        int moldRecipeStart = anvilSource.indexOf('private static void registerFoundryMoldConstructionRecipes')
        int moldRecipeEnd = anvilSource.indexOf('private static void addStampFamily', moldRecipeStart)
        if (moldRecipeStart < 0 || moldRecipeEnd < 0) {
            problems << 'Missing the mechanism-mold construction recipe registration'
        } else {
            String moldRecipeBody = anvilSource.substring(moldRecipeStart, moldRecipeEnd)
            if (!moldRecipeBody.contains('ingredient("mold_base", 1)')
                    || !moldRecipeBody.contains('ingotIngredient("steel", 4)')
                    || !moldRecipeBody.contains('FoundryMoldItem.stackFor(26)')) {
                problems << 'Mechanism mold must use the legacy tier-two blank-mold plus four-steel-ingot construction path'
            }
        }

        String blueprintSource = file('src/main/java/com/reinhardt/hbm/item/BlueprintItem.java').getText('UTF-8')
        int visibilityStart = blueprintSource.indexOf('public static boolean isRecipeVisibleForPool')
        int visibilityEnd = blueprintSource.indexOf('public static ItemStack stackFor', visibilityStart)
        if (visibilityStart < 0 || visibilityEnd < 0) {
            problems << 'Unable to locate BlueprintItem.isRecipeVisibleForPool'
        } else {
            String visibilityBody = blueprintSource.substring(visibilityStart, visibilityEnd)
            if (!visibilityBody.contains('activeRecipePools(recipePools)')
                    || !blueprintSource.contains('HbmConfig.ENABLE_528_MODE.get() ? recipePools : List.of()')) {
                problems << '528 turret recipes no longer expose their no-blueprint fallback when 528 mode is disabled'
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Turret recipe-chain validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle("Turret recipe-chain validation passed (${expectedAssemblyTurrets.size()} assembly turrets, 1 crafting turret, 2 survival blueprint milestones)")
    }
}

tasks.register('validateCadmiumProcessingParity') {
    group = 'verification'
    description = 'Checks the complete cadmium acquisition, rubber fallback, and mode-sensitive PVC chain against HBM 1.7.10.'

    def cadmiumFiles = files(
            "src/main/resources/data/${project.mod_id}/recipe/crystallizer/mustard_willow_cadmium.json",
            "src/main/resources/data/${project.mod_id}/recipe/crystallizer/cadmium_rubber.json",
            "src/main/resources/data/${project.mod_id}/recipe/chemical_plant/pvc.json",
            "src/main/resources/data/${project.mod_id}/recipe/smelting_powder_cadmium_to_ingot_cadmium.json"
    )
    inputs.files(cadmiumFiles)
    outputs.upToDateWhen { false }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def problems = []
        def readJson = { String path ->
            def source = file(path)
            if (!source.isFile()) {
                problems << "Missing cadmium-chain resource ${path}"
                return null
            }
            parser.parseText(source.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
        }

        def mustard = readJson("src/main/resources/data/${project.mod_id}/recipe/crystallizer/mustard_willow_cadmium.json")
        if (mustard != null && (mustard.type != "${project.mod_id}:crystallizer"
                || mustard.ingredient?.item != "${project.mod_id}:plant_item_mustardwillow"
                || (mustard.input_count as Integer) != 10
                || mustard.acid?.fluid != 'radiosolvent'
                || (mustard.acid?.amount as Integer) != 250
                || (mustard.duration as Integer) != 100
                || mustard.result?.id != "${project.mod_id}:powder_cadmium")) {
            problems << 'Cadmium acquisition must remain 10 mustard willow + 250 mB radiosolvent / 100 ticks -> 1 cadmium dust.'
        }

        def rubber = readJson("src/main/resources/data/${project.mod_id}/recipe/crystallizer/cadmium_rubber.json")
        if (rubber != null && (rubber.type != "${project.mod_id}:crystallizer"
                || rubber.ingredient?.tag != 'c:dusts/cadmium'
                || (rubber.input_count as Integer) != 1
                || rubber.acid?.fluid != 'fishoil'
                || (rubber.acid?.amount as Integer) != 4000
                || (rubber.duration as Integer) != 100
                || rubber.result?.id != "${project.mod_id}:ingot_rubber"
                || (rubber.result?.count as Integer) != 16)) {
            problems << 'Cadmium rubber fallback must remain 1 cadmium dust + 4,000 mB fish oil / 100 ticks -> 16 rubber ingots.'
        }

        def pvc = readJson("src/main/resources/data/${project.mod_id}/recipe/chemical_plant/pvc.json")
        if (pvc != null) {
            def fluids = pvc.input_fluids instanceof List ? pvc.input_fluids : []
            if (pvc.type != "${project.mod_id}:chemical_plant"
                    || pvc.group != 'chem.pvc'
                    || (pvc.duration as Integer) != 100
                    || (pvc.power as Integer) != 1000
                    || pvc.input_items?.size() != 1
                    || pvc.input_items[0]?.ingredient?.tag != 'c:dusts/cadmium'
                    || (pvc.input_items[0]?.count as Integer) != 1
                    || fluids.size() != 2
                    || fluids[0]?.fluid != 'unsaturateds'
                    || (fluids[0]?.amount as Integer) != 250
                    || (fluids[0]?.pressure as Integer) != 2
                    || fluids[0]?.pressure_528_only != true
                    || fluids[1]?.fluid != 'chlorine'
                    || (fluids[1]?.amount as Integer) != 250
                    || (fluids[1]?.pressure as Integer) != 2
                    || fluids[1]?.pressure_528_only != true
                    || pvc.output_items?.size() != 1
                    || pvc.output_items[0]?.id != "${project.mod_id}:ingot_pvc"
                    || (pvc.output_items[0]?.count as Integer) != 2) {
                problems << 'PVC must remain cadmium + 250 mB unsaturateds + 250 mB chlorine -> 2 PVC, with 2 PU required only in 528 mode.'
            }
        }

        def smelting = readJson("src/main/resources/data/${project.mod_id}/recipe/smelting_powder_cadmium_to_ingot_cadmium.json")
        if (smelting != null && (smelting.type != 'minecraft:smelting'
                || smelting.ingredient?.tag != 'c:dusts/cadmium'
                || smelting.result?.id != "${project.mod_id}:ingot_cadmium"
                || (smelting.cookingtime as Integer) != 200
                || Math.abs((smelting.experience as Number).doubleValue() - 1.0D) > 0.000001D)) {
            problems << 'Cadmium smelting must remain cadmium dust -> cadmium ingot, 200 ticks and 1 XP.'
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Cadmium processing parity validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle('Cadmium processing parity validation passed (mustard willow, rubber fallback, PVC pressure modes and smelting).')
    }
}

tasks.register('prepareRecipeAudit') {
    group = 'verification'
    description = 'Prepares an isolated one-shot dedicated server for runtime recipe decoding.'
    outputs.upToDateWhen { false }

    doLast {
        File auditDirectory = file('run-recipe-audit')
        auditDirectory.mkdirs()
        // The registry audit is not a compatibility test. Reusing its world
        // would surface retired ids from earlier development runs and mask
        // whether the current datapack can create a clean world.
        delete new File(auditDirectory, 'world')
        new File(auditDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
        // A player's integrated server may already own the default port while
        // this isolated verification server boots. Port 0 asks the OS for an
        // ephemeral listener and keeps recipe validation independent of play.
        new File(auditDirectory, 'server.properties').setText('server-port=0\nonline-mode=false\n', 'UTF-8')
        [
                new File(auditDirectory, 'recipe-audit.tsv'),
                new File(auditDirectory, 'logs/latest.log')
        ].each { stale ->
            if (stale.exists() && !stale.delete()) {
                throw new GradleException("Unable to clear stale recipe audit artifact ${stale}")
            }
        }
    }
}

