                'scraps_schrabidium', 'scraps_schraranium', 'scraps_silicon', 'scraps_slag',
                'scraps_sodium', 'scraps_solinium', 'scraps_starmetal', 'scraps_steel',
                'scraps_stone', 'scraps_strontium', 'scraps_tantalium', 'scraps_tcalloy', 'scraps_technetium',
                'scraps_th232', 'scraps_titanium', 'scraps_tungsten', 'scraps_u233',
                'scraps_u235', 'scraps_u238', 'scraps_uranium', 'scraps_weaponsteel',
