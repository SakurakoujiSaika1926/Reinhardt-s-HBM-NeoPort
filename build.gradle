                'mp_warhead_10_he','mp_warhead_10_incendiary','mp_warhead_10_buster',
                'mp_warhead_10_nuclear','mp_warhead_10_nuclear_large','mp_warhead_10_taint',
                'mp_warhead_10_cloud','mp_warhead_15_he','mp_warhead_15_incendiary',
                'mp_warhead_15_nuclear','mp_warhead_15_n2','mp_warhead_15_balefire',
                'mp_warhead_15_boxcar','mp_stability_10_flat','mp_stability_10_cruise',
                'mp_stability_10_space','mp_stability_15_flat','mp_stability_15_thin',
                'mp_thruster_15_balefire_large_rad','mp_c_1','mp_c_2','mp_c_3','mp_c_4','mp_c_5',
                'missile_soyuz','missile_soyuz_lander','sat_base','sat_head_mapper','sat_head_scanner',
                'sat_head_radar','sat_head_laser','sat_head_resonator','sat_foeq','sat_miner',
                'sat_lunar_miner','sat_mapper','sat_scanner','sat_radar','sat_laser','sat_resonator',
