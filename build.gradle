        requiredOutputs.each { output ->
            if (!produced.contains(mod + ':' + output)) {
                problems << 'No recipe produces required legacy output ' + mod + ':' + output
            }
        }

        // Check the two mutually-exclusive controller routes independently.
        // A global producer set is not enough here: it can hide a recipe that
        // exists only in the opposite 528 configuration.
        def producedNon528 = [] as Set
        def produced528 = [] as Set
        allRecipeFiles.each { source ->
            def recipe = parseJson(source)
            if (recipe instanceof Map) {
                def outputs = recipeOutputIds(recipe)
                if (recipeActiveFor528Mode(recipe, false)) {
                    producedNon528.addAll(outputs)
                }
                if (recipeActiveFor528Mode(recipe, true)) {
                    produced528.addAll(outputs)
                }
            }
        }
        def modeControllerOutputs = [
                'default non-528': producedNon528,
                '528': produced528
        ]
        modeControllerOutputs.each { modeName, modeOutputs ->
            ['circuit_chip', 'circuit_chip_bismoid', 'circuit_chip_quantum', 'circuit_atomic_clock',
             'circuit_controller', 'circuit_controller_advanced', 'circuit_controller_quantum'].each { output ->
                if (!modeOutputs.contains(mod + ':' + output)) {
                    problems << modeName + ' mode has no active producer for ' + mod + ':' + output
                }
            }
        }

        // JsonSlurper returns LazyMap instances and root crafting recipes use
        // direct ingredient maps while machine recipes wrap them in an
        // `ingredient` field. Normalize both forms before checking edges.
        def normalizedIngredients = { recipe ->
            def entries = []
            if (recipe.ingredient instanceof Map) {
                entries << recipe.ingredient
            }
            [recipe.ingredients, recipe.inputs, recipe.input_items, recipe.toppings, recipe.pcb, recipe.solder].each { list ->
                if (list instanceof List) {
                    list.each { entry ->
                        if (entry instanceof Map && entry.containsKey('ingredient')) {
                            entries << entry.ingredient
                        } else {
                            entries << entry
                        }
                    }
                }
            }
            // Vanilla shaped recipes keep their ingredient definitions under
            // `key` instead of an ingredients list.
            if (recipe.key instanceof Map) {
                recipe.key.values().each { entry -> entries << entry }
            }
            entries
        }
        def ingredientHasItem = { recipe, String id ->
            String wanted = mod + ':' + id
            normalizedIngredients(recipe).any { ingredient ->
                ingredient instanceof Map && (ingredient.item == wanted
                        || (ingredient.items instanceof List && ingredient.items.contains(wanted)))
            }
        }
        def ingredientHasTag = { recipe, String tag ->
            normalizedIngredients(recipe).any { ingredient ->
                ingredient instanceof Map && ingredient.tag == tag
            }
        }
        def ingredientHasRawItem = { recipe, String id ->
            normalizedIngredients(recipe).any { ingredient ->
                ingredient instanceof Map && (ingredient.item == id
                        || (ingredient.items instanceof List && ingredient.items.contains(id)))
            }
        }
        def ingredientItemIds = { recipe ->
            normalizedIngredients(recipe).findAll { ingredient -> ingredient instanceof Map }.collectMany { ingredient ->
                def ids = []
                if (ingredient.item instanceof String) {
                    ids << ingredient.item
                }
                if (ingredient.items instanceof List) {
                    ids.addAll(ingredient.items.findAll { it instanceof String })
                }
                ids
            } as Set
        }

        // Every normal missile must be assembled from a warhead (or the
        // anti-ballistic body), propulsion and—except for that body—the
        // corresponding fuel tank. This checks that the legacy multi-stage
        // Arc Welder tier has not been reduced to a final-item shortcut.
        [
                'arc_welder/missile_anti_ballistic.json', 'arc_welder/missile_generic.json',
                'arc_welder/missile_incendiary.json', 'arc_welder/missile_cluster.json',
                'arc_welder/missile_buster.json', 'arc_welder/missile_decoy.json',
                'arc_welder/missile_strong.json', 'arc_welder/missile_incendiary_strong.json',
                'arc_welder/missile_cluster_strong.json', 'arc_welder/missile_buster_strong.json',
                'arc_welder/missile_emp_strong.json', 'arc_welder/missile_burst.json',
                'arc_welder/missile_inferno.json', 'arc_welder/missile_rain.json',
                'arc_welder/missile_drill.json', 'arc_welder/missile_nuclear.json',
                'arc_welder/missile_nuclear_cluster.json', 'arc_welder/missile_volcano.json'
        ].each { path ->
            def recipe = expectedResults[path]
            if (recipe) {
                def inputs = ingredientItemIds(recipe)
                if (path == 'arc_welder/missile_decoy.json') {
                    // The legacy decoy is deliberately a steel dummy body,
                    // not a warhead-bearing missile.
                    if (!ingredientHasTag(recipe, 'c:ingots/steel')) {
                        problems << path + ' is missing its legacy steel-decoy body prerequisite'
                    }
                } else if (!inputs.any { id -> id == mod + ':missile_assembly'
                        || id.startsWith(mod + ':warhead_') || id == mod + ':emp_bomb' }) {
                    problems << path + ' has no recursive warhead/missile_assembly/EMP payload prerequisite'
                }
                if (!inputs.any { id -> id.startsWith(mod + ':thruster_') }) {
                    problems << path + ' has no recursive thruster prerequisite'
                }
                if (path != 'arc_welder/missile_anti_ballistic.json'
                        && !inputs.any { id -> id.startsWith(mod + ':fuel_tank_') }) {
                    problems << path + ' has no recursive fuel-tank prerequisite'
                }
            }
        }
        [
                'arc_welder/sat_mapper.json': 'sat_head_mapper',
                'arc_welder/sat_scanner.json': 'sat_head_scanner',
                'arc_welder/sat_radar.json': 'sat_head_radar',
                'arc_welder/sat_laser.json': 'sat_head_laser',
                'arc_welder/sat_resonator.json': 'sat_head_resonator'
        ].each { path, head ->
            def recipe = expectedResults[path]
            if (recipe && (!ingredientHasItem(recipe, 'sat_base') || !ingredientHasItem(recipe, head))) {
                problems << path + ' must combine sat_base with ' + mod + ':' + head
            }
        }
        def magicShredding = expectedResults['shredder/enchanted_book_to_powder_magic.json']
        if (magicShredding && !ingredientHasRawItem(magicShredding, 'minecraft:enchanted_book')) {
            problems << 'shredder/enchanted_book_to_powder_magic.json must preserve the legacy enchanted-book source'
        }
        ['small','medium','large'].each { size ->
            ['warhead_incendiary','warhead_cluster','warhead_buster'].each { kind ->
                def recipe = expectedResults['assembly_machine/' + kind + '_' + size + '.json']
                if (recipe && !ingredientHasItem(recipe, 'warhead_generic_' + size)) {
                    problems << kind + '_' + size + ' is not recursively based on warhead_generic_' + size
                }
            }
        }
        expectedResults.each { path, recipe ->
            if (path.startsWith('assembly_machine/mp_')) {
                def output = recipe.result.id.substring((mod + ':').length())
                if (output.startsWith('mp_thruster_') || output.startsWith('mp_fuselage_') || output.startsWith('mp_warhead_')) {
                    def hasSegment = ingredientHasItem(recipe, 'seg_10') || ingredientHasItem(recipe, 'seg_15') || ingredientHasItem(recipe, 'seg_20')
                    if (!hasSegment) {
                        problems << path + ' has no seg_10/seg_15/seg_20 prerequisite'
                    }
                }
            }
        }

        // The non-linear legacy support tree is easy to accidentally replace
        // with a final-item shortcut. Assert the important recursive edges
        // explicitly, including both alternate singularity-spark layouts.
        def dependencyChecks = [
                'powder_power.json'                         : [items: [], tags: ['c:dusts/diamond', 'c:dusts/magnetized_tungsten']],
                'powder_spark_mix.json'                     : [items: ['powder_power'], tags: ['c:dusts/desh', 'c:dusts/euphemium']],
                'singularity.json'                          : [items: ['cell_anti_schrabidium', 'block_schrabidium'], tags: ['c:nuggets/euphemium']],
                'singularity_counter_resonant.json'          : [items: ['singularity'], tags: ['c:plates/combine_steel', 'c:ingots/magnetized_tungsten']],
                'singularity_super_heated.json'              : [items: ['singularity', 'powder_power'], tags: ['c:plates/saturnite']],
                'crystal_xen.json'                          : [items: ['powder_power'], tags: ['c:ingots/euphemium']],
                'black_hole.json'                            : [items: ['singularity', 'crystal_xen'], tags: []],
                'singularity_spark.json'                    : [items: ['singularity_counter_resonant', 'singularity_super_heated', 'black_hole'], tags: ['c:plates/dineutronium']],
                'singularity_spark_alt.json'                : [items: ['singularity_counter_resonant', 'singularity_super_heated', 'black_hole'], tags: ['c:plates/dineutronium']],
                'photo_panel.json'                          : [items: ['circuit_pcb'], tags: ['c:glass_panes', 'c:plates/polymer', 'c:dusts/quartz']],
                'radar_linker.json'                         : [items: ['crt_display', 'circuit_basic'], tags: ['c:plates/steel']],
                'emp_bomb.json'                             : [items: ['magnetron', 'circuit_advanced'], tags: ['c:plates/lead']],
                'assembly_machine/magnetron.json'           : [items: ['wire_tungsten'], tags: ['c:plates/copper']],
                'soldering_station/circuit_quantum.json'    : [items: ['circuit_chip_quantum', 'circuit_chip_bismoid', 'circuit_atomic_clock', 'circuit_pcb', 'wire_lead'], tags: ['c:ingots/hard_plastic']],
                'circuit_chip_quantum_from_red_copper_wire.json': [items: ['pellet_charged', 'wire_dense_bscco', 'wire_red_copper'], tags: ['c:ingots/hard_plastic']],
                'circuit_chip_quantum_from_gold_wire.json' : [items: ['pellet_charged', 'wire_dense_bscco', 'wire_gold'], tags: ['c:ingots/hard_plastic']],
                'circuit_atomic_clock.json'                : [items: ['circuit_chip'], tags: ['c:plates/polymer', 'c:dusts/strontium']],
                'soldering_station/circuit_controller.json': [items: ['circuit_controller_chassis', 'upgrade_speed_1', 'circuit_chip', 'circuit_capacitor', 'circuit_capacitor_tantalium', 'wire_lead'], tags: []],
                'soldering_station/circuit_controller_advanced.json': [items: ['circuit_chip_bismoid', 'circuit_capacitor_tantalium', 'circuit_atomic_clock', 'circuit_controller_chassis', 'upgrade_speed_3', 'wire_lead'], tags: []],
                'soldering_station/circuit_controller_quantum.json': [items: ['circuit_chip_quantum', 'circuit_chip_bismoid', 'circuit_atomic_clock', 'circuit_controller_advanced', 'upgrade_overdrive_1', 'wire_lead'], tags: []]
        ]
        dependencyChecks.each { path, expected ->
            def recipe = expectedResults[path]
            if (recipe) {
                expected.items.each { id ->
                    if (!ingredientHasItem(recipe, id)) {
                        problems << path + ' is missing recursive item prerequisite ' + mod + ':' + id
                    }
                }
                expected.tags.each { tag ->
                    if (!ingredientHasTag(recipe, tag)) {
                        problems << path + ' is missing recursive tag prerequisite #' + tag
                    }
                }
            }
        }

        // HBM 1.12.2 defaults to non-528 mode.  The soldering-station
        // controller chain is therefore the active default path; 528 mode
        // uses the existing Precision Assembler alternatives instead.  Keep
        // this guard close to the recursive checks so a future change cannot
        // silently leave the default rocket/satellite tree without a
        // controller producer.
        def hasNot528Condition = { recipe ->
            recipe['neoforge:conditions'] instanceof List && recipe['neoforge:conditions'].any { condition ->
                condition instanceof Map
                        && condition.type == 'neoforge:not'
                        && condition.value instanceof Map
                        && condition.value.type == mod + ':enable_528_mode'
            }
        }
        [
                'soldering_station/circuit_controller.json',
                'soldering_station/circuit_controller_advanced.json',
                'soldering_station/circuit_controller_quantum.json'
        ].each { path ->
            def recipe = expectedResults[path]
            if (recipe && !hasNot528Condition(recipe)) {
                problems << path + ' must be enabled only when 528 mode is disabled'
            }
        }

        def catalogIds = [] as Set
        [file('src/main/resources/legacy/' + mod + '/item_catalog.txt'),
         file('src/main/resources/legacy/' + mod + '/block_catalog.txt')].each { catalog ->
            if (catalog.isFile()) {
                catalog.eachLine('UTF-8') { line ->
                    def id = line.trim().split(/[\s#]+/, 2)[0]
                    if (id && !id.startsWith('#')) {
                        catalogIds << id
                    }
                }
            }
        }
        // Circuits and a few machine/core objects are declared as static
        // DeferredItems/Blocks rather than in the generated legacy catalogs.
        // Include their literal registry ids in the same allow-list.
        [file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java'),
         file('src/main/java/com/reinhardt/hbm/registry/HbmBlocks.java'),
         file('src/main/java/com/reinhardt/hbm/registry/LegacyHbmContent.java')].each { source ->
            if (source.isFile()) {
                source.eachLine('UTF-8') { line ->
                    def matcher = line =~ /["']([a-z][a-z0-9_]{1,})["']/
                    matcher.each { match -> catalogIds << match[1] }
                }
            }
        }
        produced.each { id ->
            if (id.startsWith(mod + ':')) {
                catalogIds << id.substring((mod + ':').length())
            }
        }
        def isIndependentMaterialId = { String id ->
            id.startsWith('plate_cast_') || id.startsWith('shell_') || id.startsWith('wire_')
        }
        def collectDirectIds
        collectDirectIds = { value, Set found ->
            if (value instanceof Map) {
                value.each { key, child ->
                    if (key == 'item' && child instanceof String && child.startsWith(mod + ':')) {
                        found << child.substring((mod + ':').length())
                    } else if (key == 'items' && child instanceof List) {
                        child.findAll { it instanceof String && it.startsWith(mod + ':') }.each {
                            found << it.substring((mod + ':').length())
                        }
                    }
                    collectDirectIds(child, found)
                }
            } else if (value instanceof List) {
                value.each { collectDirectIds(it, found) }
            }
        }
        expectedResults.each { path, recipe ->
            def directIds = [] as Set
            collectDirectIds(recipe, directIds)
            directIds.each { id ->
                if (!catalogIds.contains(id) && !isIndependentMaterialId(id)) {
                    problems << path + ' references unlisted legacy id ' + mod + ':' + id
                }
            }
        }

        // Custom missiles deliberately have no final JSON recipe: the
        // Missile Assembly machine combines compatible chip, warhead,
        // fuselage, optional fins and thruster parts at runtime. Assert that
        // this final construction path remains present alongside the JSON
        // component tree above.
        def customAssemblySource = file('src/main/java/com/reinhardt/hbm/blockentity/LegacyMachineBlockEntity.java')
        if (customAssemblySource.isFile()) {
            def customAssembly = customAssemblySource.getText('UTF-8')
            [
                    'public boolean canConstructMissile()',
                    'missileChipState() == 1',
                    'missileWarheadState() == 1',
                    'missileFuselageState() == 1',
                    'missileThrusterState() == 1',
                    'CustomMissileItem.build('
            ].each { requiredSource ->
                if (!customAssembly.contains(requiredSource)) {
                    problems << 'Custom missile assembly is missing runtime construction guard: ' + requiredSource
                }
            }
        } else {
            problems << 'Missing custom missile assembly implementation ' + project.relativePath(customAssemblySource)
        }

        // cell_anti_schrabidium is not a crafting output in the old mod: it
        // is made by filling cell_empty with ASCHRAB.  Keep that capability
        // conversion explicit so the schrabidium-missile and singularity
        // branches stay obtainable without a creative-only shortcut.
        def itemsSource = file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java')
        def fluidCellSource = file('src/main/java/com/reinhardt/hbm/item/HbmFluidContainerItem.java')
        def capabilitySource = file('src/main/java/com/reinhardt/hbm/registry/HbmCapabilities.java')
        if (!itemsSource.isFile() || !itemsSource.getText('UTF-8').contains('case "cell_anti_schrabidium" -> legacyFluidCellItem(id, "aschrab")')) {
            problems << 'Missing legacy ASCHRAB cell registration for the recursive missile/singularity tree'
        }
        if (!fluidCellSource.isFile() || !fluidCellSource.getText('UTF-8').contains('case "aschrab" -> "cell_anti_schrabidium"')) {
            problems << 'Missing cell_empty -> cell_anti_schrabidium ASCHRAB fill conversion'
        }
        if (!capabilitySource.isFile() || !capabilitySource.getText('UTF-8').contains('HbmItems.LEGACY_FLUID_CELL_ITEMS')) {
            problems << 'Missing fluid capability registration for legacy filled cells'
        }

        if (!problems.isEmpty()) {
            throw new GradleException('Rocket/missile recipe validation failed:\\n - ' + problems.join('\\n - '))
        }
        logger.lifecycle('Rocket/missile recipe validation passed: ' + expectedFiles.size() + ' migrated files, ' + requiredOutputs.size() + ' required outputs.')
    }
}

