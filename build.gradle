                "${project.mod_id}:upgrade_overdrive_1",
                "${project.mod_id}:upgrade_overdrive_2",
                "${project.mod_id}:upgrade_overdrive_3",
                "${project.mod_id}:schrabidium_hammer",
                "${project.mod_id}:machine_weapon_table",
                "${project.mod_id}:field_disturber",
                "${project.mod_id}:rbmk_terminal",
                "${project.mod_id}:radar_screen",
                "${project.mod_id}:book_guide",
                "${project.mod_id}:pneumatic_tube",
                "${project.mod_id}:red_connector_super",
                "${project.mod_id}:trapdoor_steel",
                "${project.mod_id}:pipe_lead",
                "${project.mod_id}:crane_inserter",
                "${project.mod_id}:crane_extractor",
                "${project.mod_id}:crane_grabber",
                "${project.mod_id}:crane_boxer",
                "${project.mod_id}:crane_unboxer",
                "${project.mod_id}:crane_router",
                "${project.mod_id}:crane_splitter",
                "${project.mod_id}:crane_partitioner",
                "${project.mod_id}:cm_block",
                "${project.mod_id}:cm_sheet",
                "${project.mod_id}:cm_tank",
                "${project.mod_id}:cm_port",
                "${project.mod_id}:cm_engine",
                "${project.mod_id}:cm_circuit",
                "${project.mod_id}:cm_flux",
                "${project.mod_id}:cm_heat",
                "${project.mod_id}:pink_slab",
                "${project.mod_id}:radio_torch_controller",
                "${project.mod_id}:radio_torch_counter",
                "${project.mod_id}:radio_torch_logic",
                "${project.mod_id}:radio_torch_reader",
                "${project.mod_id}:vinyl_tile",
                "${project.mod_id}:mass_storage_iron",
                "${project.mod_id}:mass_storage_desh",
                "${project.mod_id}:mass_storage",
                "${project.mod_id}:mass_storage_wood"
        ] as Set
        def producedOutputs = [] as Set
        def exactRecipes = [:].withDefault { [] }
        def normalizeJson
        normalizeJson = { value ->
            if (value instanceof Map) {
                def normalized = new TreeMap<String, Object>()
                value.each { key, nested -> normalized[String.valueOf(key)] = normalizeJson(nested) }
                return normalized
            }
            if (value instanceof List) {
                return value.collect { normalizeJson(it) }
            }
            return value
        }

        def inspectDirectIds
        inspectDirectIds = { value, String path ->
            if (value instanceof Map) {
                if (value.item instanceof String) {
                    if (retiredDirectIds.contains(value.item)) {
                        problems << "${path} references retired item id ${value.item}"
                    }
                    if (value.item == 'minecraft:wool') {
                        problems << "${path} uses nonexistent item minecraft:wool; use the minecraft:wool tag"
                    }
                }
                if (value.id instanceof String && retiredDirectIds.contains(value.id)) {
                    problems << "${path} references retired output id ${value.id}"
                }
                if (value.tag instanceof String && retiredMaterialTags.contains(value.tag)) {
                    problems << "${path} references retired material tag ${value.tag}"
                }
                value.each { key, nested -> inspectDirectIds(nested, "${path}.${key}") }
            } else if (value instanceof List) {
                value.eachWithIndex { nested, index -> inspectDirectIds(nested, "${path}[${index}]") }
            }
        }
        def collectOutput = { value ->
            if (value instanceof Map) {
                if (value.id instanceof String) {
                    producedOutputs << value.id
                }
                if (value.result instanceof Map && value.result.id instanceof String) {
                    producedOutputs << value.result.id
                }
            }
        }

        recipeRoot.eachFileRecurse(groovy.io.FileType.FILES) { recipeFile ->
            if (!recipeFile.name.endsWith('.json')) {
                return
            }
            def relative = project.relativePath(recipeFile)
            def recipe
            try {
                recipe = parser.parseText(recipeFile.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
            } catch (Exception ex) {
                problems << "${relative} is not valid JSON: ${ex.message}"
                return
            }
            if (!(recipe instanceof Map)) {
                problems << "${relative} must contain a JSON object"
                return
            }
            listFields.getOrDefault(recipe.type, []).each { field ->
                if (recipe.containsKey(field) && !(recipe[field] instanceof List)) {
                    problems << "${relative} field '${field}' must be a JSON array for ${recipe.type}"
                }
            }
            if (recipe.containsKey('neoforge:conditions') && !(recipe['neoforge:conditions'] instanceof List)) {
                problems << "${relative} field 'neoforge:conditions' must be a JSON array"
            }
            if (recipe.type == 'minecraft:crafting_shaped') {
                if (!(recipe.pattern instanceof List)) {
                    problems << "${relative} shaped pattern must be a JSON array"
                } else if (recipe.key instanceof Map) {
                    def used = recipe.pattern.join('').toList().findAll { it != ' ' } as Set
                    def defined = recipe.key.keySet().collect { String.valueOf(it) } as Set
                    (used - defined).each { problems << "${relative} pattern uses undefined key '${it}'" }
                    (defined - used).each { problems << "${relative} defines unused key '${it}'" }
                }
            }
            if (recipe.type == 'minecraft:crafting_shapeless' && !(recipe.ingredients instanceof List)) {
                problems << "${relative} shapeless ingredients must be a JSON array"
            }
            if (recipe.type in ['minecraft:crafting_shaped', 'minecraft:crafting_shapeless']
                    && recipe.category instanceof String
                    && !validCraftingCategories.contains(recipe.category)) {
                problems << "${relative} uses invalid crafting category '${recipe.category}'"
            }
            inspectDirectIds(recipe, relative)
            collectOutput(recipe.result)
            collectOutput(recipe.output)
            if (recipe.output_items instanceof List) {
                recipe.output_items.each(collectOutput)
            }
            if (recipe.outputs instanceof List) {
                recipe.outputs.each(collectOutput)
            }
            def canonical = groovy.json.JsonOutput.toJson(normalizeJson(recipe))
            exactRecipes[canonical] << relative
        }

        exactRecipes.values().findAll { it.size() > 1 }.each { duplicates ->
            problems << "Exact duplicate recipe JSON: ${duplicates.join(', ')}"
        }
        (requiredOutputs - producedOutputs).each { output ->
            problems << "Required manufacturing chain has no recipe output for ${output}"
        }
        if (!problems.isEmpty()) {
            throw new GradleException("HBM recipe JSON validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle("HBM recipe JSON validation passed (${recipeRoot.listFiles().size()} top-level entries, ${producedOutputs.size()} produced ids).")
    }
}

tasks.register('validateBlueprintParity') {
    group = 'verification'
    description = 'Guards normal-mode recipe access, 528 blueprint gating/acquisition, and every currently ported blueprint pool.'

    def recipeRoot = file("src/main/resources/data/${project.mod_id}/recipe")
    def blueprintFolderSourceFile = file('src/main/java/com/reinhardt/hbm/item/BlueprintFolderItem.java')
    def blueprintSourceFile = file('src/main/java/com/reinhardt/hbm/item/BlueprintItem.java')
    def itemRegistrySourceFile = file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java')
    def annihilatorSourceFile = file('src/main/java/com/reinhardt/hbm/machine/AnnihilatorRecipes.java')
    def structureLootSourceFile = file('src/main/java/com/reinhardt/hbm/blockentity/HbmStructureLoot.java')
    def pedestalSourceFile = file('src/main/java/com/reinhardt/hbm/blockentity/LegacyPedestalRecipes.java')
    def assemblyJeiSourceFile = file('src/main/java/com/reinhardt/hbm/integration/jei/AssemblyMachineRecipeCategory.java')
    def chemicalJeiSourceFile = file('src/main/java/com/reinhardt/hbm/integration/jei/ChemicalPlantRecipeCategory.java')
    def precisionJeiSourceFile = file('src/main/java/com/reinhardt/hbm/integration/jei/PrecisionAssemblerRecipeCategory.java')
    def plasmaJeiSourceFile = file('src/main/java/com/reinhardt/hbm/integration/jei/PlasmaForgeRecipeCategory.java')
    def blueprintModelFile = file("src/main/resources/assets/${project.mod_id}/models/item/blueprints.json")
    def folderModelFile = file("src/main/resources/assets/${project.mod_id}/models/item/blueprint_folder.json")
    inputs.dir recipeRoot
    inputs.files blueprintFolderSourceFile, blueprintSourceFile, itemRegistrySourceFile,
            annihilatorSourceFile, structureLootSourceFile, pedestalSourceFile,
            assemblyJeiSourceFile, chemicalJeiSourceFile, precisionJeiSourceFile, plasmaJeiSourceFile,
            blueprintModelFile, folderModelFile
    outputs.upToDateWhen { false }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def problems = []
        def expectedAssignments = [
                'chemical_plant/coal_lubricant.json'                    : 'alt..lube',
                'chemical_plant/heavy_oil_lubricant.json'               : 'alt..lube',
                'chemical_plant/biomass_solid_fuel.json'                : 'alt..biosolidfuel',
                'chemical_plant/biomass_heating_oil_solid_fuel.json'    : 'alt..biosolidfuel',
                'chemical_plant/heating_oil_electrode.json'             : 'alt..electrodes',
                'chemical_plant/lubricant_electrode.json'                : 'alt..electrodes',
                'chemical_plant/stone.json'                              : 'discover..stone',
                'chemical_plant/obsidian.json'                           : 'discover..stone',
                'chemical_plant/aggregate.json'                          : 'discover..stone',
                'assembly_machine/machine_well.json'                     : '528.steel',
                'assembly_machine/machine_well_expensive.json'           : '528.steel',
                'assembly_machine/machine_pumpjack.json'                 : '528.steel',
                'assembly_machine/machine_pumpjack_expensive.json'       : '528.steel',
                'assembly_machine/rbmk_blank.json'                       : '528.ferrouranium',
                'assembly_machine/rbmk_blank_expensive.json'             : '528.ferrouranium',
                'assembly_machine/rbmk_autoloader.json'                  : '528.ferrouranium',
                'assembly_machine/rbmk_autoloader_expensive.json'        : '528.ferrouranium'
        ]
        def expectedPoolReferenceCounts = [
                '528.arty'          : 2,
                '528.bmg'           : 8,
                '528.chip'          : 1,
                '528.chip_bismoid'  : 1,
                '528.chip_quantum'  : 13,
                '528.chlorophyte'   : 38,
                '528.controller'    : 17,
                '528.ferrouranium'  : 4,
                '528.gascent'       : 1,
                '528.hardplastic'   : 6,
                '528.plastic'       : 6,
                '528.rubber'        : 2,
                '528.soyuz'         : 3,
                '528.steel'         : 4,
                '528.strontium'     : 1,
                '528.tcalloy'       : 8,
                'alt..biosolidfuel' : 2,
                'alt..birkeland'    : 1,
                'alt..circuit'      : 3,
                'alt..electrodes'   : 2,
                'alt..lube'         : 2,
                'alt..xenonoxy'     : 1,
                'alt.plates'        : 13,
                'discover..rpa'     : 4,
                'discover..stone'   : 3,
                'discover.radgen'   : 2
        ]

        expectedAssignments.each { relative, expectedPool ->
            File recipeFile = new File(recipeRoot, relative)
            if (!recipeFile.isFile()) {
                problems << "Missing legacy blueprint recipe ${relative}"
                return
            }
            try {
                def recipe = parser.parseText(recipeFile.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
                if (recipe.blueprint_pools != [expectedPool]) {
                    problems << "${relative} must use exactly blueprint pool ${expectedPool}, found ${recipe.blueprint_pools}"
                }
            } catch (Exception ex) {
                problems << "${relative} is not valid JSON: ${ex.message}"
            }
        }

        def actualPoolReferenceCounts = [:].withDefault { 0 }
        fileTree(recipeRoot) {
            include '**/*.json'
        }.files.each { recipeFile ->
            try {
                def recipe = parser.parseText(recipeFile.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
                if (recipe instanceof Map && recipe.blueprint_pools instanceof List) {
                    recipe.blueprint_pools.each { pool ->
                        if (!(pool instanceof String) || pool.isBlank()) {
                            problems << "${project.relativePath(recipeFile)} has an invalid blueprint pool ${pool}"
                        } else {
                            if (pool.startsWith('secret.')) {
                                problems << "${project.relativePath(recipeFile)} references retired secret blueprint pool ${pool}"
                            }
                            actualPoolReferenceCounts[pool] = actualPoolReferenceCounts[pool] + 1
                        }
                    }
                }
            } catch (Exception ignored) {
                // validateRecipeJsonSchemas reports malformed JSON with the exact path.
            }
        }
        if (actualPoolReferenceCounts != expectedPoolReferenceCounts) {
            def missing = expectedPoolReferenceCounts.findAll { pool, count -> actualPoolReferenceCounts[pool] != count }
            def unexpected = actualPoolReferenceCounts.findAll { pool, count -> expectedPoolReferenceCounts[pool] != count }
            problems << "Blueprint pool reference counts differ from the reviewed 1.7.10 port (expected differences ${missing}, actual differences ${unexpected})"
        }

        String blueprintSource = blueprintSourceFile.getText('UTF-8')
        def creativeBlock = blueprintSource =~ /(?s)private static final List<String> CREATIVE_POOLS = List\.of\((.*?)\n\s*\);/
        if (!creativeBlock.find()) {
            problems << 'BlueprintItem must expose an explicit CREATIVE_POOLS list'
        } else {
            def creativePools = (creativeBlock.group(1) =~ /"([^"]+)"/).collect { match -> match[1] }
            def expectedCreativePools = actualPoolReferenceCounts.keySet().sort()
            if (creativePools.size() != creativePools.toSet().size()) {
                problems << "Blueprint creative variants contain duplicates: ${creativePools}"
            }
            if (creativePools.toSet() != expectedCreativePools.toSet()) {
                problems << "Blueprint creative variants do not match all active recipe pools (expected ${expectedCreativePools}, found ${creativePools})"
            }
        }

        int visibilityStart = blueprintSource.indexOf('public static boolean isRecipeVisibleForPool')
        int visibilityEnd = blueprintSource.indexOf('public static List<String> activeRecipePools', visibilityStart)
        int activePoolsEnd = blueprintSource.indexOf('public static ItemStack stackFor', visibilityEnd)
        if (visibilityStart < 0 || visibilityEnd < 0 || activePoolsEnd < 0) {
            problems << 'Unable to locate the centralized blueprint-mode visibility methods'
        } else {
            String visibilityBody = blueprintSource.substring(visibilityStart, visibilityEnd)
            String activePoolsBody = blueprintSource.substring(visibilityEnd, activePoolsEnd)
            if (!visibilityBody.contains('List<String> activePools = activeRecipePools(recipePools);')
                    || !visibilityBody.contains('installedPool.filter(activePools::contains).isPresent()')) {
                problems << 'Recipe visibility must use the centralized active blueprint-pool list'
            }
            if (!activePoolsBody.contains('HbmConfig.ENABLE_528_MODE.get() ? recipePools : List.of()')) {
                problems << 'Normal mode must expose all recipes while 528 mode activates every blueprint pool'
            }
        }

        [assemblyJeiSourceFile, chemicalJeiSourceFile, precisionJeiSourceFile, plasmaJeiSourceFile].each { jeiSourceFile ->
            if (!jeiSourceFile.getText('UTF-8').contains('BlueprintItem.activeRecipePools(recipe.blueprintPools())')) {
                problems << "${project.relativePath(jeiSourceFile)} does not follow the centralized blueprint-mode rule"
            }
        }

        String folderSource = blueprintFolderSourceFile.getText('UTF-8')
        if (!folderSource.contains('folder.shrink(1);')
                || !folderSource.contains('if (folder.isEmpty())')
                || !folderSource.contains('return InteractionResultHolder.sidedSuccess(blueprint, false);')) {
            problems << 'Blueprint booklet must consume itself and directly replace the empty hand with the rolled blueprint'
        }
        if (!folderSource.contains('pool.startsWith(prefix)')
                || !folderSource.contains('.distinct()')
                || !folderSource.contains('.sorted(Comparator.naturalOrder())')) {
            problems << 'Blueprint booklet must select one distinct pool for its exact legacy booklet prefix'
        }

        String annihilatorSource = annihilatorSourceFile.getText('UTF-8')
        def expected528Milestones = [
                'tag(STEEL, 256, "528.steel")',
                'item("billet_silicon", 256, "528.chip")',
                'item("nugget_bismuth", 128, "528.chip_bismoid")',
                'item("pellet_charged", 1024, "528.chip_quantum")',
                'item("billet_uranium", 256, "528.gascent")',
                'tag(PLASTIC, 512, "528.plastic")',
                'tag(RUBBER, 512, "528.rubber")',
                'tag(FERROURANIUM, 1024, "528.ferrouranium")',
                'tag(STRONTIUM, 256, "528.strontium")',
                'tag(HARDPLASTIC, 1024, "528.hardplastic")',
                'tag(RESISTANT_ALLOY, 1024, "528.tcalloy")',
                'item("powder_chlorophyte", 1024, "528.chlorophyte")',
                'item("drive_flash_flightsim", 64, "528.soyuz")',
                'variant("ammo_standard", "bmg50_fmj", 256, "528.bmg")',
                'variant("ammo_arty", "ammo_arty", 128, "528.arty")',
                'item("circuit_controller", 128, "528.controller")'
        ]
        expected528Milestones.each { milestone ->
            if (!annihilatorSource.contains(milestone)) {
                problems << "Missing 528 annihilator blueprint milestone ${milestone}"
            }
        }
        int payoutStart = annihilatorSource.indexOf('public static Payout highestPayout')
        int payoutEnd = annihilatorSource.indexOf('public static void incrementAll', payoutStart)
        if (payoutStart < 0 || payoutEnd < 0
                || !annihilatorSource.substring(payoutStart, payoutEnd).contains('!HbmConfig.ENABLE_528_MODE.get()')) {
            problems << 'Annihilator blueprint payouts must remain exclusive to 528 mode'
        }

        String structureLootSource = structureLootSourceFile.getText('UTF-8')
        String pedestalSource = pedestalSourceFile.getText('UTF-8')
        String blueprintModel = blueprintModelFile.getText('UTF-8')
        String folderModel = folderModelFile.getText('UTF-8')
        if (blueprintSource.contains('POOL_PREFIX_SECRET')
                || blueprintSource.contains('blueprints.cannot_copy')
                || folderSource.contains('SECRET_MODEL_DATA')
                || folderSource.contains('Variant.SECRET')
                || structureLootSource.contains('e("reinhardtshbm:blueprint_folder", 1, 1, 1, "secret")')
                || pedestalSource.contains('BlueprintFolderItem')
                || blueprintModel.contains('blueprints_secret')
                || folderModel.contains('blueprint_folder_secret')) {
            problems << 'Retired secret blueprints still have a runtime source or model reference'
        }
        [
                file("src/main/resources/assets/${project.mod_id}/models/item/blueprints_secret.json"),
                file("src/main/resources/assets/${project.mod_id}/models/item/blueprint_folder_secret.json"),
                file("src/main/resources/assets/${project.mod_id}/textures/item/blueprints_secret.png"),
                file("src/main/resources/assets/${project.mod_id}/textures/item/blueprint_folder_secret.png")
        ].findAll { it.exists() }.each { staleAsset ->
            problems << "Retired secret blueprint asset still exists: ${project.relativePath(staleAsset)}"
        }

        int paperCheck = blueprintSource.indexOf('if (!player.getInventory().contains(new ItemStack(Items.PAPER)))')
        int paperConsumption = blueprintSource.indexOf('if (!consumePaper(player))')
        int creativeBranch = blueprintSource.indexOf('if (player.getAbilities().instabuild)')
        if (paperCheck < 0 || paperConsumption < paperCheck || creativeBranch < paperConsumption
                || !blueprintSource.contains('stack.grow(1);')
                || !blueprintSource.contains('player.drop(copy, false);')) {
            problems << 'Blueprint copying must consume paper in every game mode, stack survival copies, and drop creative copies'
        }

        String registrySource = itemRegistrySourceFile.getText('UTF-8')
        def blueprintRegistration = registrySource =~ /(?s)BLUEPRINTS\s*=\s*toolItem\((.*?)public static final DeferredItem<Item> BLUEPRINT_FOLDER/
        if (!blueprintRegistration.find()) {
            problems << 'Unable to locate the flattened blueprints item registration'
        } else if (blueprintRegistration.group(1).contains('stacksTo(1)')) {
            problems << 'The legacy blueprints item must retain the default stack size of 64'
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Blueprint parity validation failed:\n - " + problems.join('\n - '))
        }
        int references = actualPoolReferenceCounts.values().sum() as int
        logger.lifecycle("Blueprint mode validation passed (${actualPoolReferenceCounts.size()} pools, ${references} recipe references, ${expected528Milestones.size()} 528 milestones, no retired secret blueprints).")
    }
}

def recipeBaselineFile = file('gradle/verification/recipe-baseline.sha256')

def canonicalRecipeBaseline = {
    def parser = new groovy.json.JsonSlurper()
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    def recipeRoot = file("src/main/resources/data/${project.mod_id}/recipe")
    fileTree(recipeRoot) {
        include '**/*.json'
    }.files.sort { left, right -> left.path <=> right.path }.collect { recipeFile ->
        def parsed = parser.parseText(recipeFile.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
        def canonical = groovy.json.JsonOutput.toJson(parsed)
        def hash = digest.digest(canonical.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                .collect { String.format('%02x', it & 0xff) }
                .join('')
        def relative = recipeRoot.toPath().relativize(recipeFile.toPath()).toString().replace('\\', '/')
        "${hash}\t${relative}"
    }
}

tasks.register('updateRecipeBaseline') {
    group = 'verification'
    description = 'Explicitly accepts the current complete recipe set as the reviewed release baseline.'
    inputs.dir file("src/main/resources/data/${project.mod_id}/recipe")
    outputs.file recipeBaselineFile

    doLast {
        recipeBaselineFile.parentFile.mkdirs()
        recipeBaselineFile.setText(canonicalRecipeBaseline().join('\n') + '\n', 'UTF-8')
        logger.lifecycle("Updated strict recipe baseline with ${canonicalRecipeBaseline().size()} recipes")
    }
}

tasks.register('validateRecipeBaseline') {
    group = 'verification'
    description = 'Rejects accidental recipe deletion or unreviewed ingredient/output changes.'
    mustRunAfter tasks.named('updateRecipeBaseline')
    inputs.dir file("src/main/resources/data/${project.mod_id}/recipe")
    inputs.file recipeBaselineFile
    outputs.upToDateWhen { false }

    doLast {
        if (!recipeBaselineFile.isFile()) {
            throw new GradleException("Missing strict recipe baseline ${recipeBaselineFile}; run updateRecipeBaseline after review")
        }
        def expected = recipeBaselineFile.readLines('UTF-8').findAll { !it.isBlank() }
        def actual = canonicalRecipeBaseline()
        if (expected != actual) {
            def expectedMap = expected.collectEntries { line ->
                def parts = line.split('\\t', 2)
                [(parts[1]): parts[0]]
            }
            def actualMap = actual.collectEntries { line ->
                def parts = line.split('\\t', 2)
                [(parts[1]): parts[0]]
            }
            def details = []
            (expectedMap.keySet() - actualMap.keySet()).sort().each { details << "deleted: ${it}" }
            (actualMap.keySet() - expectedMap.keySet()).sort().each { details << "added: ${it}" }
            (expectedMap.keySet().intersect(actualMap.keySet())).sort().each { path ->
                if (expectedMap[path] != actualMap[path]) {
                    details << "changed: ${path}"
                }
            }
            throw new GradleException(
                    "Strict recipe baseline changed without review:\n - " + details.take(100).join('\n - ') +
                            (details.size() > 100 ? "\n - ... and ${details.size() - 100} more" : '') +
                            "\nRun updateRecipeBaseline only after verifying the intentional changes."
            )
        }
        logger.lifecycle("Strict recipe baseline passed (${actual.size()} recipes)")
    }
}

