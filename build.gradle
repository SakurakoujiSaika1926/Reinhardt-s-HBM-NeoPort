        def expectedResults = [:]
        expectedFiles.each { path, output ->
            File source = new File(recipeRoot, path.replace('/', File.separator))
            if (!source.isFile()) {
                problems << 'Missing migrated rocket/missile recipe ' + project.relativePath(source)
                return
            }
            def recipe = parseJson(source)
            if (!(recipe instanceof Map)) {
                return
            }
            expectedResults[path] = recipe
            if (!recipeOutputIds(recipe).contains(mod + ':' + output)) {
                problems << project.relativePath(source) + ' does not output ' + mod + ':' + output
            }
            if (path.startsWith('assembly_machine/')) {
                if (recipe.type != mod + ':assembly_machine') {
                    problems << project.relativePath(source) + ' has type ' + recipe.type + ', expected ' + mod + ':assembly_machine'
                }
                if (!(recipe.ingredients instanceof List) || recipe.ingredients.isEmpty() || recipe.ingredients.size() > 12) {
                    problems << project.relativePath(source) + ' must contain 1..12 assembly input slots'
                }
            } else if (path.startsWith('plasma_forge/')) {
                if (recipe.type != mod + ':plasma_forge') {
                    problems << project.relativePath(source) + ' has type ' + recipe.type + ', expected ' + mod + ':plasma_forge'
                }
                if (!(recipe.input_items instanceof List) || recipe.input_items.size() > 12) {
                    problems << project.relativePath(source) + ' exceeds the Plasma Forge 12-input limit'
                }
                if (recipe.input_fluids instanceof List && recipe.input_fluids.size() > 1) {
                    problems << project.relativePath(source) + ' exceeds the Plasma Forge one-fluid limit'
                }
            } else if (path.startsWith('arc_welder/')) {
                if (recipe.type != mod + ':arc_welder') {
                    problems << project.relativePath(source) + ' has type ' + recipe.type + ', expected ' + mod + ':arc_welder'
                }
                if (!(recipe.inputs instanceof List) || recipe.inputs.isEmpty()) {
                    problems << project.relativePath(source) + ' must contain Arc Welder inputs'
                }
            } else if (path.startsWith('chemical_plant/')) {
                if (recipe.type != mod + ':chemical_plant') {
                    problems << project.relativePath(source) + ' has type ' + recipe.type + ', expected ' + mod + ':chemical_plant'
                }
                if (!(recipe.input_items instanceof List) || recipe.input_items.isEmpty()) {
                    problems << project.relativePath(source) + ' must contain Chemical Plant item inputs'
                }
            } else if (path.startsWith('shredder/')) {
                if (recipe.type != mod + ':shredder') {
                    problems << project.relativePath(source) + ' has type ' + recipe.type + ', expected ' + mod + ':shredder'
                }
                if (!(recipe.ingredient instanceof Map)) {
                    problems << project.relativePath(source) + ' must contain a Shredder ingredient'
                }
            }
        }

        def allRecipeFiles = recipeRoot.isDirectory()
                ? fileTree(recipeRoot).matching { include '**/*.json' }.files
                : [] as Set
        def produced = [] as Set
        allRecipeFiles.each { source ->
            def recipe = parseJson(source)
            if (recipe instanceof Map) {
                produced.addAll(recipeOutputIds(recipe))
            }
        }
        def requiredOutputs = [
                'seg_10','seg_15','seg_20','rocket_fuel',
