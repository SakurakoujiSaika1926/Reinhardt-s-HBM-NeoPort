tasks.register('validateNuclearBlastParity') {
    group = 'verification'
    description = 'Guards MK5 damage parity, true-damage semantics, bounded async work, and save-scoped blast task lifecycle.'
    def managerSource = file('src/main/java/com/reinhardt/hbm/explosion/NukeExplosionManager.java')
    def legacyNukeSource = file('src/main/java/com/reinhardt/hbm/blockentity/LegacyNukeBlockEntity.java')
    def trueDamageEventsSource = file('src/main/java/com/reinhardt/hbm/event/NuclearTrueDamageEvents.java')
    def radiationEventsSource = file('src/main/java/com/reinhardt/hbm/radiation/RadiationEvents.java')
    def trueDamageTags = [
            'bypasses_armor',
            'bypasses_cooldown',
            'bypasses_effects',
            'bypasses_enchantments',
            'bypasses_resistance',
            'bypasses_shield',
            'bypasses_wolf_armor'
    ]
    inputs.file managerSource
    inputs.file legacyNukeSource
    inputs.file trueDamageEventsSource
    inputs.file radiationEventsSource
    inputs.files trueDamageTags.collect { file("src/main/resources/data/minecraft/tags/damage_type/${it}.json") }

    doLast {
        String source = managerSource.getText('UTF-8')
        String nukeSource = legacyNukeSource.getText('UTF-8')
        String trueDamageSource = trueDamageEventsSource.getText('UTF-8')
        String radiationSource = radiationEventsSource.getText('UTF-8')
        def parser = new groovy.json.JsonSlurper()
        def problems = []
        if (!source.contains('private static final float MK5_MAX_DAMAGE = 5_000.0F;')) {
            problems << 'high-version MK5 maximum damage must remain 5,000 (20x the legacy value)'
        }
        if (!source.contains('double range = this.length * 2.0D;')) {
            problems << 'legacy MK5 entity damage radius must remain twice the configured blast length'
        }
        if (!source.contains('MK5_MAX_DAMAGE * (range - distance) / range')) {
            problems << 'legacy MK5 linear distance falloff is missing'
        }
        if (!source.contains('task.applyInitialDamage(level);')
                || !source.contains('private void applyInitialDamage(ServerLevel level)')) {
            problems << 'the first MK5 entity damage sweep must complete at detonation time, before terrain queueing'
        }
        if (!source.contains('damageSweepRequested')) {
            problems << 'bounded follow-up damage sweeps are missing'
        }
        if (source.contains('pendingDamagePulses')) {
            problems << 'per-tick MK5 damage snapshots must not accumulate in an unbounded backlog'
        }
        if (!source.contains('private static final Map<ServerLevel, Queue<NukeTask>> TASKS = new IdentityHashMap<>();')
                || !source.contains('public static void onLevelUnload(LevelEvent.Unload event)')
                || !source.contains('tasks.forEach(NukeTask::cancel);')) {
            problems << 'MK5 tasks must be scoped to a concrete level and cancelled when that level unloads'
        }
        if (!source.contains('this.directionBatches.offer(batch, 100L, TimeUnit.MILLISECONDS)')
                || !source.contains('while (!this.cancelled)')) {
            problems << 'the bounded MK5 ray producer must be cancellable instead of blocking forever on an abandoned queue'
        }
        if (!source.contains('private final Map<Long, BitSet> destroyedBlockMasks = new HashMap<>();')
                || !source.contains('recordDestroyedBlock(sectionKey, pos);')
                || !source.contains('initializeFluidBoundaryScan(level);')
                || !source.contains('wasDestroyedByBlast(x, y, z) || touchesDestroyedBlastBlock(x, y, z)')) {
            problems << 'MK5 terrain destruction must retain an exact removed-block boundary scan so liquid sources missed between rays cannot remain suspended'
        }
        if (!source.contains('state.getBlock() instanceof LiquidBlock')
                || !source.contains('intersectsExplosionSphere(fluidPos)')) {
            problems << 'MK5 post-blast fluid cleanup must remain limited to direct liquid blocks inside the exact blast sphere'
        }
        if (!source.contains('private final Queue<Long> pendingWaterloggedProbeSections = new ArrayDeque<>();')
                || !source.contains('section.maybeHas(NukeTask::isWaterlogged)')
                || !source.contains('intersectsExplosionSphere(waterloggedPos)')
                || !source.contains('&& !isWaterlogged(state)')) {
            problems << 'MK5 cleanup must remove complete waterlogged blocks throughout the exact loaded blast sphere'
        }
        if (!source.contains('SOLINIUM_RADIATION')
                || !source.contains('15_000.0D + (250_000.0D - 15_000.0D) * interpolation')) {
            problems << 'Solinium must retain its legacy radiation-only 15,000..250,000 RAD entity effect'
        }
        if (!nukeSource.contains('hasStagedYield(def) ? 5 : def.slotCount()')) {
            problems << 'Ivy Mike and Tsar must accept the legacy five-slot primary assembly'
        }
        if (!nukeSource.contains('def == LegacyNukeDefinition.TSAR && !filled')
                || !nukeSource.contains('LegacyNukeDefinition.MAN.radius()')) {
            problems << 'a partial Tsar must use the legacy Fat Man radius'
        }
        if (!nukeSource.contains('scheduleFleijaNuke')
                || !nukeSource.contains('scheduleSoliniumNuke')
                || !nukeSource.contains('scheduleMk5NoRadiation')) {
            problems << 'special stationary nukes must use their dedicated legacy entity-effect branches'
        }
        trueDamageTags.each { tagName ->
            File tagFile = file("src/main/resources/data/minecraft/tags/damage_type/${tagName}.json")
            if (!tagFile.isFile()) {
                problems << "nuclear true damage tag is missing: minecraft:${tagName}"
                return
            }
            def tagDefinition
            try {
                tagDefinition = parser.parseText(tagFile.getText('UTF-8'))
            } catch (Exception ex) {
                problems << "${project.relativePath(tagFile)} is not valid JSON: ${ex.message}"
                return
            }
            if (!(tagDefinition.values instanceof Collection)
                    || !tagDefinition.values.contains('reinhardtshbm:nuclear_blast')) {
                problems << "minecraft:${tagName} must contain reinhardtshbm:nuclear_blast"
            }
        }
        File invulnerabilityTagFile = file('src/main/resources/data/minecraft/tags/damage_type/bypasses_invulnerability.json')
        if (invulnerabilityTagFile.isFile()) {
            try {
                def invulnerabilityTag = parser.parseText(invulnerabilityTagFile.getText('UTF-8'))
                if (invulnerabilityTag.values instanceof Collection
                        && invulnerabilityTag.values.contains('reinhardtshbm:nuclear_blast')) {
                    problems << 'nuclear blast must not bypass creative/spectator invulnerability or the normal death-prevention pipeline'
                }
            } catch (Exception ex) {
                problems << "${project.relativePath(invulnerabilityTagFile)} is not valid JSON: ${ex.message}"
            }
        }
        if (!trueDamageSource.contains('event.setCanceled(false);')
                || !trueDamageSource.contains('event.setAmount(event.getOriginalAmount());')
                || !trueDamageSource.contains('DamageContainer.Reduction.values()')
                || !trueDamageSource.contains('DAMAGE_AFTER_HBM_PROTECTION.remove(event.getContainer())')) {
            problems << 'nuclear blast damage must survive incoming-event cancellation, all generic reduction stages, and final pre-damage modifiers'
        }
        if (!trueDamageSource.contains('event.setBlocked(false);')
                || !trueDamageSource.contains('player.isCreative() || player.isSpectator()')) {
            problems << 'nuclear true damage must bypass shields while retaining creative/spectator immunity'
        }
        if (!trueDamageSource.contains('RadiationEvents.applyHbmDamageProtection(player, event);')
                || !trueDamageSource.contains('RadiationEvents.applyHbmArmorProtection(player, event.getSource(), finalDamage);')
                || !radiationSource.contains('public static void applyHbmDamageProtection')
                || !radiationSource.contains('public static float applyHbmArmorProtection')
                || !radiationSource.contains('BuiltInRegistries.ITEM.getKey(stack.getItem()).getNamespace().equals(ReinhardtsHBM.MOD_ID)')
                || !radiationSource.contains('!event.getSource().is(HbmDamageTypes.NUCLEAR_BLAST)')) {
            problems << 'HBM armor, player shields, armor inserts, armor mods, and FSB protection must be replayed exactly once after generic or third-party reductions are discarded'
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Nuclear blast parity validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle('Nuclear blast validation passed (5,000 max true damage, legacy range/falloff, save-scoped cancellable async work, staged yields, special branches)')
    }
}

tasks.register('validateVendingMachineParity') {
    group = 'verification'
    description = 'Fails when the two 1.7.10 vending-machine variants lose interaction, rewards, acquisition, drops, or sound parity.'

    def vendingBlock = file('src/main/java/com/reinhardt/hbm/block/VendingMachineBlock.java')
    def vendingEntity = file('src/main/java/com/reinhardt/hbm/blockentity/VendingMachineBlockEntity.java')
    def dummyBlock = file('src/main/java/com/reinhardt/hbm/block/MachineDummyBlock.java')
    def bobmazonOffers = file('src/main/java/com/reinhardt/hbm/handler/LegacyBobmazonOffers.java')
    def variantItem = file('src/main/java/com/reinhardt/hbm/item/LegacyVariantBlockItem.java')
    def soundEvents = file('src/main/java/com/reinhardt/hbm/registry/HbmSoundEvents.java')
    def soundsJson = file('src/main/resources/assets/reinhardtshbm/sounds.json')
    def dispenseSound = file('src/main/resources/assets/reinhardtshbm/sounds/block/pile_bolt_open.ogg')
    def zhCnFile = file('src/main/resources/assets/reinhardtshbm/lang/zh_cn.json')
    inputs.files(vendingBlock, vendingEntity, dummyBlock, bobmazonOffers, variantItem,
            soundEvents, soundsJson, dispenseSound, zhCnFile)
    outputs.upToDateWhen { false }

    doLast {
        def blockSource = vendingBlock.getText('UTF-8')
        def entitySource = vendingEntity.getText('UTF-8')
        def dummySource = dummyBlock.getText('UTF-8')
        def bobmazonSource = bobmazonOffers.getText('UTF-8')
        def soundSource = soundEvents.getText('UTF-8')
        def parser = new groovy.json.JsonSlurper()
        def soundDefinitions = parser.parse(soundsJson)
        def zhCn = parser.parse(zhCnFile)
        def problems = []

        [
                'static ItemInteractionResult useOnPart(',
                'static boolean isCoinToken(ItemStack stack)',
                'stack.shrink(1);',
                'vending.dispense(level.random);',
                'HbmSoundEvents.VENDING_MACHINE_DISPENSE.get()',
                'public ItemStack getCloneItemStack(',
                'public List<ItemStack> getDrops(',
                'LegacyVariantBlockItem.stackFor(vending, state.getValue(VARIANT))'
        ].each { required ->
            if (!blockSource.contains(required)) {
                problems << "Vending-machine interaction/drop parity lost '${required}'."
            }
        }
        if (blockSource.contains('SoundEvents.DISPENSER_DISPENSE')) {
            problems << 'The vanilla dispenser sound replaced the audited 1.7.10 vending-machine bolt sound.'
        }
        if (blockSource.contains('!player.getAbilities().instabuild')) {
            problems << 'Creative use must still consume the vending token, matching the audited 1.7.10 behavior.'
        }

        [
                'VendingMachineBlock.isCoinToken(stack)',
                'VendingMachineBlock.useOnPart(stack, level, pos, corePos, player);'
        ].each { required ->
            if (!dummySource.contains(required)) {
                problems << "The upper vending-machine half no longer forwards token use '${required}'."
            }
        }

        [
                'vendingMachineOffer(0)',
                'vendingMachineOffer(1)',
                'LegacyVariantBlockItem.stackFor(vending, variant)',
                'Requirement.CHEMICS, 64, 0'
        ].each { required ->
            if (!bobmazonSource.contains(required)) {
                problems << "Bobmazon vending-machine acquisition parity lost '${required}'."
            }
        }

        [
                'new Reward(() -> stack("bottle_nuka"), 10)',
                'new Reward(() -> stack("bottle_cherry"), 5)',
                'new Reward(() -> stack("bottle_quantum"), 1)',
                'new Reward(() -> stack("can_bepis"), 10)',
                'new Reward(() -> stack("can_luna"), 10)',
                'new Reward(() -> stack("can_mug"), 10)',
                'new Reward(() -> stack("can_breen"), 1)',
                'new Reward(() -> new ItemStack(HbmItems.DEFINITELYFOOD.get()), 10)',
                'LegacyConserveItem.Variant.BEEF), 5)',
                'LegacyConserveItem.Variant.TUBE), 5)',
                'new Reward(() -> new ItemStack(HbmItems.TWINKIE.get()), 10)',
                'new Reward(() -> new ItemStack(HbmItems.CHOCOLATE.get()), 10)'
        ].each { required ->
            if (!entitySource.contains(required)) {
                problems << "Audited 1.7.10 vending reward/weight is missing '${required}'."
            }
        }

        if (!soundSource.contains('VENDING_MACHINE_DISPENSE = sound("block.vending_machine_dispense")')) {
            problems << 'The semantic vending-machine dispense sound registration is missing.'
        }
        def dispenseDefinition = soundDefinitions['block.vending_machine_dispense']
        if (!(dispenseDefinition?.sounds instanceof Collection)
                || dispenseDefinition.sounds.size() != 1
                || dispenseDefinition.sounds[0]?.name != 'reinhardtshbm:block/pile_bolt_open') {
            problems << 'The vending-machine sound event must resolve only to the audited old bolt-open asset.'
        }
        def sha256 = { File input ->
            java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes)
                    .collect { String.format('%02X', it & 0xff) }.join()
        }
        if (!dispenseSound.isFile()
                || sha256(dispenseSound) != '9F84A0E92F6DD21645381581CEA4433BB9DC6176D07C4F87F1A4AC5B3BC39812') {
            problems << 'The vending-machine dispense audio no longer matches the audited 1.7.10 boltOpen.ogg.'
        }
        if (zhCn['item.reinhardtshbm.coin_token'] != '售货机代币') {
            problems << 'The coin token must retain the unambiguous Chinese name “售货机代币”.'
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Vending-machine parity validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle('Vending-machine parity validation passed (both halves, exact reward pools, Bobmazon acquisition, variant drops, old sound)')
    }
}

