tasks.register('validateGasTickPerformance') {
    group = 'verification'
    description = 'Guards legacy gas scheduling parity and the optional Sable non-physical gas fast path.'

    inputs.files(
            file('src/main/java/com/reinhardt/hbm/block/HbmGasBlock.java'),
            file('src/main/java/com/reinhardt/hbm/block/OutgassingRadiatingBlock.java'),
            file('src/main/java/com/reinhardt/hbm/mixin/sable/SableCommonEventsMixin.java'),
            file('src/main/resources/reinhardtshbm.mixins.json')
    )
    outputs.upToDateWhen { false }

    doLast {
        def gasBlock = file('src/main/java/com/reinhardt/hbm/block/HbmGasBlock.java').getText('UTF-8')
        def outgassing = file('src/main/java/com/reinhardt/hbm/block/OutgassingRadiatingBlock.java').getText('UTF-8')
        def sableMixin = file('src/main/java/com/reinhardt/hbm/mixin/sable/SableCommonEventsMixin.java').getText('UTF-8')
        def mixinConfig = file('src/main/resources/reinhardtshbm.mixins.json').getText('UTF-8')
        def problems = []

        if (gasBlock.contains('updateShape(')) {
            problems << 'HBM gas blocks must not schedule extra ticks from every neighbour shape update.'
        }
        if (!outgassing.contains('protected void randomTick(')
                || outgassing.contains('protected void tick(')
                || outgassing.contains('level.scheduleTick(pos, this, 1)')) {
            problems << 'Outgassing radiating blocks must emit gas from random ticks without a separate one-tick scheduled loop.'
        }
        [
                '@Mixin(targets = "dev.ryanhcode.sable.SableCommonEvents", remap = false)',
                '@Inject(method = "handleBlockChange", at = @At("HEAD"), cancellable = true, remap = false, require = 0)',
                'oldState.getBlock() instanceof HbmGasBlock',
                'newState.getBlock() instanceof HbmGasBlock',
                'boolean oldNonPhysical = oldState.isAir() || oldGas;',
                'boolean newNonPhysical = newState.isAir() || newGas;',
                'callbackInfo.cancel();'
        ].each { fragment ->
            if (!sableMixin.contains(fragment)) {
                problems << "Sable gas fast path is missing '${fragment}'."
            }
        }
        if (!mixinConfig.contains('sable.SableCommonEventsMixin')) {
            problems << 'The optional Sable gas fast-path mixin is not packaged.'
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Gas tick performance validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle('Gas tick validation passed: neighbour rescheduling removed, outgassing randomized, Sable skips only air/gas transitions.')
    }
}

tasks.register('validateRendererCullingBounds') {
    group = 'verification'
    description = 'Audits every registered BER for exact finite geometry, section policy, and immutable snapshots.'

    inputs.file(file('src/main/java/com/reinhardt/hbm/client/render/HbmClientRenderers.java'))
    inputs.files(fileTree('src/main/java/com/reinhardt/hbm/client/render') {
        include '**/*.java'
    })
    inputs.files(fileTree('src/main/java/com/reinhardt/hbm/blockentity') { include '**/*.java' })
    inputs.files(fileTree('src/main/java/com/reinhardt/hbm/block') { include '**/*.java' })
    inputs.files(fileTree('src/main/java/com/reinhardt/hbm/worldgen/structure') { include '**/*.java' })
    inputs.files(
            file('src/main/java/com/reinhardt/hbm/client/render/GroundwaterPumpItemRenderer.java'),
            file('src/main/java/com/reinhardt/hbm/client/render/ObjMachineItemRenderer.java'),
            file('src/main/java/com/reinhardt/hbm/client/render/TurretItemRenderer.java'),
            file('src/main/resources/assets/reinhardtshbm/models/obj/blocks/toaster.obj'),
            file('src/main/resources/assets/reinhardtshbm/models/obj/machines/rtg.obj')
    )
    outputs.upToDateWhen { false }

    doLast {
        def problems = []
        def readSource = { String path ->
            def sourceFile = file(path)
            sourceFile.isFile() ? sourceFile.getText('UTF-8') : null
        }
        def objGroupBounds = { String path, String requiredGroup ->
            def objFile = file(path)
            if (!objFile.isFile()) return null
            String currentGroup = null
            int count = 0
            def min = [null, null, null]
            def max = [null, null, null]
            objFile.eachLine('UTF-8') { String raw ->
                String line = raw.trim()
                if (line.startsWith('o ')) {
                    currentGroup = line.substring(2).trim()
                } else if (currentGroup == requiredGroup && line.startsWith('v ')) {
                    def parts = line.split(/\s+/)
                    if (parts.length >= 4) {
                        for (int axis = 0; axis < 3; axis++) {
                            BigDecimal value = new BigDecimal(parts[axis + 1])
                            min[axis] = min[axis] == null || value < min[axis] ? value : min[axis]
                            max[axis] = max[axis] == null || value > max[axis] ? value : max[axis]
                        }
                        count++
                    }
                }
            }
            def normalize = { BigDecimal value -> value.stripTrailingZeros().toPlainString() }
            return [count: count, min: min.collect(normalize), max: max.collect(normalize)]
        }
        def bracedBodyAt = { String source, int open ->
            if (source == null || open < 0 || open >= source.length() || source.charAt(open) != '{') return null
            int depth = 0
            for (int index = open; index < source.length(); index++) {
                char current = source.charAt(index)
                if (current == '{') depth++
                if (current == '}' && --depth == 0) return source.substring(open, index + 1)
            }
            return null
        }
        def methodBody = { String source, String signature ->
            if (source == null) return null
            int signatureStart = source.indexOf(signature)
            if (signatureStart < 0) return null
            int open = source.indexOf('{', signatureStart)
            return bracedBodyAt(source, open)
        }
        def requiredMethodBody = { String source, String signature, String contract ->
            def body = methodBody(source, signature)
            if (body == null) {
                problems << "${contract} is missing required method '${signature}'."
                return ''
            }
            return body
        }
        def declaredMethodBodies = { String source ->
            def methods = [:].withDefault { [] }
            if (source == null) return methods
            def declarationPattern = java.util.regex.Pattern.compile(
                    '(?m)^[ \\t]*(?:@[A-Za-z0-9_$.]+(?:\\([^\\r\\n]*\\))?[ \\t]+)*'
                            + '(?:(?:public|protected|private|static|final|synchronized|native|abstract|default|strictfp)[ \\t]+)*'
                            + '(?:<[^\\r\\n>{};]+>[ \\t]+)?'
                            + '[A-Za-z_$][A-Za-z0-9_$.]*(?:[ \\t]*<[^\\r\\n>{};=]+>)?'
                            + '(?:[ \\t]*\\[\\s*\\])?[ \\t]+([A-Za-z_$][A-Za-z0-9_$]*)[ \\t]*\\(')
            def declarations = declarationPattern.matcher(source)
            while (declarations.find()) {
                int open = source.indexOf('{', declarations.end())
                int semicolon = source.indexOf(';', declarations.end())
                if (open < 0 || (semicolon >= 0 && semicolon < open)) continue
                def body = bracedBodyAt(source, open)
                if (body != null) methods[declarations.group(1)] << body
            }
            return methods
        }
        def reachableMethodBody = { String source, String rootSignature, String contract ->
            String root = requiredMethodBody(source, rootSignature, contract)
            if (root.isEmpty()) return root
            Map<String, List<String>> methods = declaredMethodBodies(source)
            Set<String> expanded = new LinkedHashSet<>()
            expanded.add('render')
            def pending = new ArrayDeque<String>()
            def combined = new StringBuilder(root)
            def enqueueCalls = { String body ->
                def calls = body =~ /\b([A-Za-z_$][A-Za-z0-9_$]*)\s*\(/
                while (calls.find()) {
                    String name = calls.group(1)
                    if (name in ['if', 'for', 'while', 'switch', 'catch', 'synchronized', 'return',
                                 'new', 'super', 'this', 'throw', 'assert']) continue
                    int prefixStart = Math.max(0, calls.start(1) - 8)
                    String prefix = body.substring(prefixStart, calls.start(1))
                    if (prefix =~ /new\s*$/) continue
                    if (methods.containsKey(name) && expanded.add(name)) pending.addLast(name)
                }
            }
            enqueueCalls(root)
            while (!pending.isEmpty()) {
                String name = pending.removeFirst()
                methods[name].each { String body ->
                    combined.append('\n').append(body)
                    enqueueCalls(body)
                }
            }
            return combined.toString()
        }

        def registrySource = readSource('src/main/java/com/reinhardt/hbm/client/render/HbmClientRenderers.java')
        def registered = new LinkedHashSet<String>()
        int registrationCallCount = 0
        def registrationCalls = registrySource =~ /registerBlockEntityRenderer\s*\(/
        while (registrationCalls.find()) registrationCallCount++
        int parsedRegistrationCount = 0
        def registrations = registrySource =~ /([A-Za-z0-9_]+BlockEntityRenderer)::new/
        while (registrations.find()) {
            parsedRegistrationCount++
            registered.add(registrations.group(1))
        }
        if (registered.isEmpty()) {
            problems << 'HbmClientRenderers yielded no registered BER classes.'
        }
        if (parsedRegistrationCount != registrationCallCount) {
            problems << "HbmClientRenderers has ${registrationCallCount} BER registrations but the audit parsed ${parsedRegistrationCount}; lambda/custom providers need explicit parser coverage."
        }

        // Every omission is deliberate and tied to a measured one-block render contract.
        def unitRendererWhitelist = [
                'DecoDisplayBlockEntityRenderer'    : 'Face-used puter/CRT floats through every actual JOML cardinal pose have minima >=0 and maxima <=1.',
                'FanBlockEntityRenderer'            : 'The six actual float frame poses stay in [0,1]^3; blade radius sqrt(.3125^2+.3125^2)<.5.',
                'FluidBarrelBlockEntityRenderer'    : 'The only rendered fluid surface is [0.09,0.675,0.09]..[0.91,0.925,0.91].',
                'FoundryCastingBlockEntityRenderer' : 'Emitted X/Z=.125..875 and legal molten Y=.125..875, with no local transform.',
                'FoundryFlowBlockEntityRenderer'    : 'Emitted channels use X/Z=0..1 and legal molten Y=.0625..375, with no local transform.',
                'FoundrySlagBlockEntityRenderer'    : 'All emitted float vertices are exactly X/Z=0..1 and Y=0..clamp(amount,0,1).',
                'FoundryTankBlockEntityRenderer'    : 'Procedural shell/liquid vertices are explicitly X/Z=0..1 and Y=0..1.',
                'FunnelBlockEntityRenderer'         : 'Face-used OBJ [-.5,0,-.5]..[.5,1,.5] receives only exact +(.5,0,.5).',
                'GeigerBlockEntityRenderer'         : 'Face-used floats through all four actual JOML poses remain 0..1 (raw [-.40625,0,-.5]..[.5,.6875,.375]).',
                'RadioTorchBlockEntityRenderer'     : 'Raw [-.125,-.5,-.125]..[.125,.125,.125] through all six compound float poses remains 0..1.',
                'RefuelerBlockEntityRenderer'       : 'Body/fluid face-used floats through the sequential legacy yaw table remain 0..1 at every fill.',
                'SoyuzCapsuleBlockEntityRenderer'   : 'World renderer emits only the explicit unit-cube capsule block.',
                'TapeDriveBlockEntityRenderer'      : 'Frame OBJ is [-.5,0,-.5]..[.25,1,.5]; all twelve translated Drive/Light groups remain inside that frame, and the four dedicated legacy yaws produce the published one-block sub-boxes.',
                'TapeRecorderBlockEntityRenderer'   : 'Raw [-.5,0,-.5]..[.375,1,.5] face vertices stay 0..1 through every actual float yaw.',
                'WallChargeBlockEntityRenderer'     : 'Both face-used charge meshes and the clamped five-character timer stay 0..1 in all six poses.'
        ]

        unitRendererWhitelist.each { name, reason ->
            if (!registered.contains(name)) problems << "Unit-renderer whitelist entry ${name} is not registered."
            if (reason == null || reason.trim().isEmpty()) problems << "Unit-renderer whitelist entry ${name} needs a geometry rationale."
        }

        registered.sort().each { rendererName ->
            def path = "src/main/java/com/reinhardt/hbm/client/render/${rendererName}.java"
            def source = readSource(path)
            if (source == null) {
                problems << "Registered BER ${rendererName} has no source file."
                return
            }
            boolean longRange = source =~ /implements\s+LongRangeBlockEntityRenderer/
            boolean unitRenderer = unitRendererWhitelist.containsKey(rendererName)
            if (unitRenderer && longRange) {
                problems << "${rendererName} is proven one-block geometry and must not enter the global BER list."
            } else if (!unitRenderer && !longRange) {
                problems << "${rendererName} is neither LongRange nor present in the explicit one-block whitelist."
            }

            def bounds = methodBody(source, 'getRenderBoundingBox(')
            if (!unitRenderer && bounds == null) {
                problems << "${rendererName} must publish an audited finite render envelope."
            }
            if (bounds != null) {
                def forbiddenBounds = [
                        '.inflate('                 : 'coarse inflate()',
                        'AABB.INFINITE'             : 'an infinite AABB',
                        'Double.POSITIVE_INFINITY'  : 'infinite coordinates',
                        'Double.NEGATIVE_INFINITY'  : 'infinite coordinates',
                        'MachineModelRenderer.model(': 'a runtime model lookup',
                        'Minecraft.getInstance()'   : 'a runtime Minecraft query',
                        '.getModel('                : 'a runtime model-manager query',
                        '.getQuads('                : 'runtime baked-quad traversal'
                ]
                forbiddenBounds.each { fragment, description ->
                    if (bounds.contains(fragment)) problems << "${rendererName} bbox contains ${description}."
                }
                if (bounds =~ /(?<![A-Za-z0-9_.])256(?:\.0+)?[DdFf]?(?![A-Za-z0-9_.])/) {
                    problems << "${rendererName} bbox contains the forbidden 256-block sentinel."
                }
                if (bounds =~ /(?i)\b(roughly|approximately|approx(?:imate)?|estimate(?:d)?)\b|\babout\s+(?:[-+]?\d|one|two|three|four|five|six|seven|eight|nine|ten)\b/) {
                    problems << "${rendererName} bbox documents an estimated rather than proved envelope."
                }
            }
            if (source =~ /boolean\s+shouldRenderOffScreen\s*\(/) {
                problems << "${rendererName} must delegate section membership to LongRangeBlockEntityRenderer."
            }
        }

        def longRangePolicy = readSource('src/main/java/com/reinhardt/hbm/client/render/LongRangeBlockEntityRenderer.java')
        ['Minecraft.getInstance().options.getEffectiveRenderDistance() * 16',
         'SectionPos.blockToSectionCoord', 'inclusiveMaximum(bounds.minX, bounds.maxX)',
         'inclusiveMaximum(bounds.minY, bounds.maxY)', 'inclusiveMaximum(bounds.minZ, bounds.maxZ)',
         'Math.nextDown(max)', 'axisDistance(cameraPosition.x',
         'LargeMachineOcclusionCulling.isPotentiallyVisible(blockEntity, bounds, cameraPosition)'].each { fragment ->
            if (!longRangePolicy.contains(fragment)) {
                problems << "LongRangeBlockEntityRenderer is missing section-aware policy '${fragment}'."
            }
        }

        def occlusionPolicy = readSource('src/main/java/com/reinhardt/hbm/client/render/LargeMachineOcclusionCulling.java')
        ['RenderLevelStageEvent.Stage.AFTER_ENTITIES', 'RenderLevelStageEvent.Stage.AFTER_BLOCK_ENTITIES',
         'accessor.hbm$getVisibleSections()', 'VISIBLE_SECTIONS.contains(SectionPos.asLong',
         'bounds.contains(cameraPosition)', 'inclusiveMaximum(bounds.minX, bounds.maxX)',
         'ENABLE_LARGE_MACHINE_OCCLUSION_CULLING.get()'].each { fragment ->
