        }

        def retiredCinnabarResources = [
                'src/main/resources/data/reinhardtshbm/worldgen/configured_feature/depth_ore_cinnabar.json',
                'src/main/resources/data/reinhardtshbm/worldgen/placed_feature/depth_ore_cinnabar.json',
                'src/main/resources/data/reinhardtshbm/neoforge/biome_modifier/add_depth_ore_cinnabar.json',
                'src/main/resources/data/reinhardtshbm/loot_table/blocks/ore_depth_cinnabar.json',
                'src/main/resources/assets/reinhardtshbm/blockstates/ore_depth_cinnabar.json',
                'src/main/resources/assets/reinhardtshbm/models/item/ore_depth_cinnabar.json',
                'src/main/resources/assets/reinhardtshbm/models/block/ore_depth_cinnabar.json',
                'src/main/resources/assets/reinhardtshbm/textures/block/ore_depth_cinnabar.png',
                'src/main/resources/data/reinhardtshbm/recipe/smelting_crystal_cinnebar.json',
                'src/main/resources/data/reinhardtshbm/worldgen/configured_feature/depth_ore_cinnebar.json',
                'src/main/resources/data/reinhardtshbm/worldgen/placed_feature/depth_ore_cinnebar.json',
                'src/main/resources/data/reinhardtshbm/neoforge/biome_modifier/add_depth_ore_cinnebar.json',
                'src/main/resources/data/reinhardtshbm/loot_table/blocks/ore_cinnebar.json',
                'src/main/resources/data/reinhardtshbm/loot_table/blocks/ore_deepslate_cinnebar.json',
                'src/main/resources/data/reinhardtshbm/loot_table/blocks/ore_depth_cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/blockstates/ore_cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/blockstates/ore_deepslate_cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/blockstates/ore_depth_cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/models/item/cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/models/item/crystal_cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/models/item/ore_cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/models/item/ore_deepslate_cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/models/item/ore_depth_cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/models/block/ore_deepslate_cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/models/block/ore_depth_cinnebar.json',
                'src/main/resources/assets/reinhardtshbm/textures/item/cinnebar.png',
                'src/main/resources/assets/reinhardtshbm/textures/item/crystal_cinnebar.png',
                'src/main/resources/assets/reinhardtshbm/textures/block/ore_deepslate_cinnebar.png',
                'src/main/resources/assets/reinhardtshbm/textures/block/ore_depth_cinnebar.png'
        ]
        retiredCinnabarResources.findAll { file(it).exists() }.each {
            problems << "Retired cinnabar resource still exists: ${it}"
