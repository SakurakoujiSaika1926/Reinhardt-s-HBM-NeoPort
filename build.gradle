        ] as Set
        def retiredMaterialTags = [
                'c:dusts/np237',
                'c:nuggets/po210',
                'c:billets/po210',
                'c:dusts/po210',
                'c:dusts/fluorine'
        ] as Set
        def validCraftingCategories = ['building', 'redstone', 'equipment', 'misc'] as Set
        def requiredOutputs = [
                "${project.mod_id}:circuit_pcb",
                "${project.mod_id}:circuit_chip",
