                        type: 'reinhardtshbm:assembly_machine', group: 'ass.capacitorgold',
                        duration: 100, power: 100,
                        ingredients: [countedTag('c:plates/steel', 8), countedTag('c:wires_dense/gold', 16)],
                        result: result('capacitor_gold')
                ],
                'assembly_machine/capacitor_niobium.json': [
                        type: 'reinhardtshbm:assembly_machine', group: 'ass.capacitorniobium',
                        duration: 100, power: 1_000,
                        ingredients: [countedTag('c:ingots/plastic', 12), countedTag('c:wires_dense/niobium', 24)],
                        result: result('capacitor_niobium')
                ],
                'assembly_machine/capacitor_tantalum.json': [
                        type: 'reinhardtshbm:assembly_machine', group: 'ass.capacitortantalum',
                        duration: 100, power: 10_000,
                        ingredients: [countedTag('c:ingots/hard_plastic', 16), countedTag('c:ingots/tantalium', 24)],
                        result: result('capacitor_tantalum')
                ],
                'assembly_machine/capacitor_bismuth.json': [
                        type: 'reinhardtshbm:assembly_machine', group: 'ass.capacitorbismuth',
                        duration: 100, power: 25_000,
                        ingredients: [
                                countedTag('c:ingots/hard_plastic', 24),
                                countedTag('c:ingots/bismuth', 24),
                                countedItem('reinhardtshbm:circuit_chip_quantum', 1)
                        ],
                        result: result('capacitor_bismuth')
                ],
                'assembly_machine/capacitor_spark.json': [
                        type: 'reinhardtshbm:assembly_machine', group: 'ass.capacitorspark',
                        duration: 100, power: 100_000,
                        ingredients: [
                                countedTag('c:plates/cast_combine_steel', 12),
                                countedItem('reinhardtshbm:powder_spark_mix', 32),
                                countedItem('reinhardtshbm:pellet_charged', 32),
                                countedItem('reinhardtshbm:circuit_chip_quantum', 16)
                        ],
                        input_fluids: [[fluid: 'perfluoromethyl_cold', amount: 8_000]],
                        output_fluids: [[fluid: 'perfluoromethyl', amount: 8_000]],
                        result: result('capacitor_spark')
                ]
        ]

        def problems = []
        expected.each { relative, expectedJson ->
            File recipeFile = new File(recipeRoot, relative)
            if (!recipeFile.isFile()) {
                problems << "missing legacy capacitor recipe ${relative}"
            } else {
                def actual = parser.parse(recipeFile)
                if (actual != expectedJson) {
                    problems << "legacy capacitor recipe differs from 1.7.10: ${relative}"
                }
            }
        }

        String batterySource = file('src/main/java/com/reinhardt/hbm/item/BatteryPackItem.java').getText('UTF-8')
        String itemsSource = file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java').getText('UTF-8')
        [
                capacitor_copper: '1_000L',
                capacitor_gold: '10_000L',
                capacitor_niobium: '100_000L',
                capacitor_tantalum: '500_000L',
                capacitor_bismuth: '2_500_000L',
                capacitor_spark: '10_000_000L'
        ].each { variant, rate ->
            if (!itemsSource.contains("\"battery_pack_${variant}\", \"${variant}\", ${rate}")) {
                problems << "flattened portable ${variant} registration no longer matches 1.7.10 (${rate} HE/t)"
            }
        }
        String capacitorSource = file('src/main/java/com/reinhardt/hbm/item/PortableCapacitorItem.java').getText('UTF-8')
        if (!capacitorSource.contains('Math.multiplyExact(this.transferRate, 20L * 30L)')
                || !capacitorSource.contains('return tag.contains(CHARGE_TAG) ? Mth.clamp(tag.getLong(CHARGE_TAG), 0L, capacity) : 0L')) {
            problems << 'portable capacitor capacity/charge/discharge formula no longer matches 1.7.10'
        }
        if (batterySource.contains('"capacitor_copper"') || batterySource.contains('addCapacitor(')) {
            problems << 'portable capacitors regressed into the battery_pack variant item'
        }
        String creativeTabsSource = file('src/main/java/com/reinhardt/hbm/registry/HbmCreativeTabs.java').getText('UTF-8')
        if (!creativeTabsSource.contains('private static void acceptFullyCharged(')
                || creativeTabsSource.contains('acceptEmptyAndFull(')) {
            problems << 'portable capacitors must expose exactly one fully charged creative-tab stack, not duplicate empty/full stacks'
        }
        ['COPPER', 'GOLD', 'NIOBIUM', 'TANTALUM', 'BISMUTH', 'SPARK'].each { material ->
            String expectedCreativeEntry = "acceptFullyCharged(output, HbmItems.CAPACITOR_${material});"
            if (creativeTabsSource.count(expectedCreativeEntry) != 1) {
                problems << "portable capacitor ${material.toLowerCase()} must appear exactly once in the power-storage creative tab"
            }
        }

        String blockEntitySource = file('src/main/java/com/reinhardt/hbm/blockentity/CapacitorBlockEntity.java').getText('UTF-8')
        if (!blockEntitySource.contains('MAX_POWER = 1_000_000L')
                || !blockEntitySource.contains('INPUT_RATE = MAX_POWER / 100L')
                || !blockEntitySource.contains('OUTPUT_RATE = MAX_POWER / 300L')) {
            problems << 'placed copper capacitor HE capacity or transfer rates no longer match 1.7.10'
        }
        String blocksSource = file('src/main/java/com/reinhardt/hbm/registry/HbmBlocks.java').getText('UTF-8')
        if (!(blocksSource =~ /CAPACITOR_COPPER\s*=\s*registerBlock\("capacitor_copper",\s*\(\)\s*->\s*new\s+CapacitorBlock\(/).find()) {
            problems << 'capacitor_copper is no longer registered as the functional CapacitorBlock'
        }

        if (!problems.isEmpty()) {
            throw new GradleException('Capacitor parity validation failed:\n - ' + problems.join('\n - '))
        }
        logger.lifecycle("Capacitor parity passed (${expected.size()} production recipes plus exact portable/block HE behavior)")
    }
}

tasks.register('validateRecipeSemantics') {
    group = 'verification'
    description = 'Checks every recipe type, resource id, stack count, and optional-mod guard.'
    inputs.dir file("src/main/resources/data/${project.mod_id}/recipe")
    inputs.file file('src/main/java/com/reinhardt/hbm/registry/HbmRecipeTypes.java')
    outputs.upToDateWhen { false }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def problems = []
        def hbmModId = project.mod_id.toString()
        def recipeRoot = file("src/main/resources/data/${project.mod_id}/recipe")
        def recipeTypesSource = file('src/main/java/com/reinhardt/hbm/registry/HbmRecipeTypes.java').getText('UTF-8')
        def serializerPattern = java.util.regex.Pattern.compile('RECIPE_SERIALIZERS\\.register\\(\\s*"([a-z0-9_./-]+)"')
        def registeredCustomTypes = [] as Set
        def serializerMatcher = serializerPattern.matcher(recipeTypesSource)
        while (serializerMatcher.find()) {
            registeredCustomTypes << (hbmModId + ':' + serializerMatcher.group(1))
        }
        def vanillaTypes = [
                'minecraft:crafting_shaped', 'minecraft:crafting_shapeless',
                'minecraft:smelting', 'minecraft:blasting'
        ] as Set
        def resourceIdPattern = java.util.regex.Pattern.compile('^[a-z0-9_.-]+:[a-z0-9_./-]+$')
        def positiveFields = [
                'count', 'input_count', 'duration', 'cookingtime', 'consumption',
                'byproduct_interval', 'momentum', 'flux'
        ] as Set

        fileTree(recipeRoot) {
            include '**/*.json'
        }.files.each { recipeFile ->
            def relative = project.relativePath(recipeFile)
            def recipe = parser.parseText(recipeFile.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
            if (!(recipe.type instanceof String)) {
                problems << "${relative} has no string recipe type"
                return
            }
            if (!vanillaTypes.contains(recipe.type) && !registeredCustomTypes.contains(recipe.type)) {
                problems << "${relative} uses unregistered recipe serializer ${recipe.type}"
            }
            def guardedMods = [] as Set
            if (recipe['neoforge:conditions'] instanceof List) {
                recipe['neoforge:conditions'].each { condition ->
                    if (condition instanceof Map && condition.type == 'neoforge:mod_loaded' && condition.modid instanceof String) {
                        guardedMods << condition.modid
                    }
                }
            }

            def inspect
            inspect = { value, String path, String key ->
                if (value instanceof Map) {
                    value.each { nestedKey, nested -> inspect(nested, "${path}.${nestedKey}", String.valueOf(nestedKey)) }
                } else if (value instanceof List) {
                    value.eachWithIndex { nested, index -> inspect(nested, "${path}[${index}]", key) }
                } else if (value instanceof String && key in ['item', 'id']) {
                    if (!(value ==~ resourceIdPattern)) {
                        problems << "${relative} ${path} is not a valid resource id: ${value}"
                    } else {
                        def namespace = value.substring(0, value.indexOf(':'))
                        if (!(namespace in ['minecraft', hbmModId, 'neoforge']) && !guardedMods.contains(namespace)) {
                            problems << "${relative} references ${value} without neoforge:mod_loaded guard for ${namespace}"
                        }
                    }
                } else if (value instanceof Number && positiveFields.contains(key)) {
                    if (value.doubleValue() <= 0) {
                        problems << "${relative} ${path} must be positive, found ${value}"
                    }
                    if (key in ['count', 'input_count'] && value.doubleValue() > 64) {
                        problems << "${relative} ${path} exceeds one stack (${value}); split it into multiple entries"
                    }
                }
            }
            inspect(recipe, '$', '')
        }

        if (!problems.isEmpty()) {
            throw new GradleException("HBM recipe semantic validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle("HBM recipe semantic validation passed (${registeredCustomTypes.size()} custom serializers)")
    }
}

tasks.register('validateCinnabarProcessingParity') {
