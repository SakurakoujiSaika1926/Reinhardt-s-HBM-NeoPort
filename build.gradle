        }

        def cinnabarTag = readJson('src/main/resources/data/c/tags/item/gems/cinnabar.json')
        def cinnabarValues = cinnabarTag instanceof Map ? cinnabarTag.get('values') : null
        if (!(cinnabarValues instanceof Collection)
                || cinnabarValues.collect { String.valueOf(it) }.toSet() != ['reinhardtshbm:cinnabar'] as Set) {
            problems << 'c:gems/cinnabar must contain only the canonical reinhardtshbm:cinnabar item.'
        }

        def crystalTag = readJson('src/main/resources/data/c/tags/item/crystals/cinnabar.json')
        def crystalValues = crystalTag instanceof Map ? crystalTag.get('values') : null
        if (!(crystalValues instanceof Collection)
                || crystalValues.collect { String.valueOf(it) }.toSet() != ['reinhardtshbm:crystal_cinnabar'] as Set) {
            problems << 'c:crystals/cinnabar must contain only the canonical reinhardtshbm:crystal_cinnabar item.'
        }

        def expectedOreIds = [
                'reinhardtshbm:ore_cinnabar',
                'reinhardtshbm:ore_deepslate_cinnabar'
        ] as Set
        ['item', 'block'].each { tagKind ->
            def oreTag = readJson("src/main/resources/data/c/tags/${tagKind}/ores/cinnabar.json")
            def oreValues = oreTag instanceof Map ? oreTag.get('values') : null
            if (!(oreValues instanceof Collection)
                    || oreValues.collect { String.valueOf(it) }.toSet() != expectedOreIds) {
                problems << "c:ores/cinnabar ${tagKind} tag must contain exactly the canonical stone and deepslate ores."
            }
        }
        def redDyeTag = readJson('src/main/resources/data/c/tags/item/dyes/red.json')
        def redDyeValues = redDyeTag instanceof Map ? redDyeTag.get('values') : null
        if (!(redDyeValues instanceof Collection)
                || !redDyeValues.any { String.valueOf(it) == 'reinhardtshbm:cinnabar' }
                || redDyeValues.any { String.valueOf(it).contains('cinnebar') }) {
            problems << 'Canonical cinnabar must remain a red dye and the misspelled alias must not remain in the tag.'
        }

        def hasCountedCinnabar = { Object recipe ->
            recipe instanceof Map && recipe.ingredients instanceof Collection
                    && recipe.ingredients.any { entry ->
                        entry instanceof Map
                                && entry.ingredient?.tag == 'c:gems/cinnabar'
                                && (entry.count as Integer) == 24
                    }
        }
        def supercomputer = readJson("src/main/resources/data/${project.mod_id}/recipe/supercomputer/beigeprints.json")
        if (!hasCountedCinnabar(supercomputer)) {
            problems << 'The supercomputer beigeprints recipe must consume 24 cinnabar, matching current 1.7.10.'
        }
        def precisionAssembler = readJson("src/main/resources/data/${project.mod_id}/recipe/precision_assembler/beigeprints.json")
        if (!hasCountedCinnabar(precisionAssembler)) {
            problems << 'The precision assembler beigeprints recipe must consume 24 cinnabar, matching current 1.7.10.'
