                sourceFile.readLines('UTF-8').eachWithIndex { line, index ->
                    if (genericLegacyTransform.matcher(line).find()) {
                        problems << "${project.relativePath(sourceFile)}:${index + 1} uses a generic LegacyMachineGeometry transform; machine orientation/footprint mappings must be machine-specific."
                    }
                }
            }
