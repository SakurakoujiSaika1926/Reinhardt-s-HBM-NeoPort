        def findItemNames
        findItemNames = { Object node ->
            def names = []
            if (node instanceof Map) {
                node.each { key, value ->
                    if (String.valueOf(key) == 'name' && value instanceof String) {
                        names << value
                    }
                    names.addAll(findItemNames(value))
                }
            } else if (node instanceof Collection) {
                node.each { names.addAll(findItemNames(it)) }
