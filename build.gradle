tasks.register('validateMixerFluidTankRouting') {
    group = 'verification'
    description = 'Guards event-cached, interchangeable industrial-mixer input tanks without weakening recipe input1/input2 data.'

    inputs.file file('src/main/java/com/reinhardt/hbm/blockentity/MixerBlockEntity.java')
    inputs.dir file("src/main/resources/data/${project.mod_id}/recipe/mixer")
    outputs.upToDateWhen { false }

    doLast {
        def problems = []
        String source = file('src/main/java/com/reinhardt/hbm/blockentity/MixerBlockEntity.java').getText('UTF-8')
        [
                'DIRECT(0, 1),',
                'SWAPPED(1, 0),',
                'this.cachedInputLayout = resolveInputLayout(recipe, -1, null);',
                'InputLayout tank1Layout = resolveInputLayout(recipe, 0, fluid);',
                'InputLayout tank2Layout = resolveInputLayout(recipe, 1, fluid);',
                'cacheInputLayout(recipe, filledLayout);',
                'drainRecipeInput(layout.input1Tank(), input)',
                'drainRecipeInput(layout.input2Tank(), input)',
                'tank.conform(expected.fluid(), expected.pressure());',
                'tank.fill(expected.fluid(), amount, expected.pressure(), simulate)'
        ].each { fragment ->
            if (!source.contains(fragment)) {
                problems << "Mixer input-tank routing lost contract fragment: ${fragment}"
            }
        }
        if (source.contains('fillInputTank(inputTank1, fluid, resource.getAmount(), action.simulate())')) {
            problems << 'Mixer fluid capability reverted to greedily filling input tank 1 before input tank 2.'
        }
        if (source.contains('input -> this.inputTank1.conform(input.fluid(), input.pressure())')
                || source.contains('input -> this.inputTank2.conform(input.fluid(), input.pressure())')) {
            problems << 'Mixer processing reverted to forcing recipe input1/input2 into fixed physical tanks every tick.'
        }
        if (source.contains('this.inputTank1.drain(input.fluid(), input.amount(), false)')
                || source.contains('this.inputTank2.drain(input.fluid(), input.amount(), false)')) {
            problems << 'Mixer completion reverted to fixed physical-tank draining instead of its cached input layout.'
        }

        def parser = new groovy.json.JsonSlurper()
        int recipeCount = 0
        int oneFluidInputCount = 0
        int twoFluidInputCount = 0
        int noFluidInputCount = 0
        int sameFluidInputCount = 0
        def orderedRecipeSignatures = []
        fileTree("src/main/resources/data/${project.mod_id}/recipe/mixer") {
            include '*.json'
        }.files.sort { it.name }.each { recipeFile ->
            def recipe = parser.parse(recipeFile)
            if (recipe.type != "${project.mod_id}:mixer") {
                problems << "${recipeFile.name} is not an industrial-mixer recipe."
                return
            }
            recipeCount++
            boolean hasInput1 = recipe.input1 instanceof Map
            boolean hasInput2 = recipe.input2 instanceof Map
            if (hasInput2 && !hasInput1) {
                problems << "${recipeFile.name} defines input2 without input1; tank ownership would be ambiguous."
            }
            if (hasInput1 && hasInput2) {
                twoFluidInputCount++
                if (recipe.input1.fluid == recipe.input2.fluid) {
                    sameFluidInputCount++
                }
            } else if (hasInput1) {
                oneFluidInputCount++
            } else {
                noFluidInputCount++
            }

            def inputSignature = { input ->
                if (!(input instanceof Map)) {
                    return '-'
                }
                int pressure = input.containsKey('pressure') ? input.pressure as int : 0
                "${input.fluid}:${input.amount}:${pressure}"
            }
            orderedRecipeSignatures <<
                    "${recipe.output.fluid}:${recipe.output.amount}|${recipe.duration}|" +
                            "${inputSignature(recipe.input1)}|${inputSignature(recipe.input2)}"
        }
        if (recipeCount == 0) {
            problems << 'No industrial-mixer recipes were found.'
        }

        // Frozen from the latest 1.7.10 _hbmMixer.json. input1 and input2 occupy
        // distinct fields in this signature, so swapping otherwise-identical
        // ingredients is a validation failure rather than a set-equivalent pass.
        String orderedRecipeContract = orderedRecipeSignatures.sort().join('\n')
        String orderedRecipeHash = java.security.MessageDigest.getInstance('SHA-256')
                .digest(orderedRecipeContract.getBytes('UTF-8'))
                .collect { String.format('%02X', it & 0xff) }
                .join()
        String expectedLegacyOrderedRecipeHash = '5091E8392E6598ADD2F71610C959D173424417468FF75FE2110570E4EB56A37F'
        if (orderedRecipeHash != expectedLegacyOrderedRecipeHash) {
            problems << "Mixer input1/input2 recipe order diverged from latest HBM 1.7.10 " +
                    "(expected ${expectedLegacyOrderedRecipeHash}, found ${orderedRecipeHash})."
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Industrial-mixer fluid routing validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle(
                "Industrial-mixer fluid routing passed (${recipeCount} recipes: " +
                        "${twoFluidInputCount} dual-input, ${oneFluidInputCount} single-input, " +
                        "${noFluidInputCount} fluidless, ${sameFluidInputCount} same-fluid dual-input; " +
                        "latest-1.7.10 input1/input2 order exact; direct/swapped runtime layouts cached)"
        )
    }
}

