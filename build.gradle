                 || !legacyMachine.contains('if (!this.worldPosition.equals(accessorPos) || side == Direction.UP)')
                 || !legacyMachine.contains('return new LegacyFluidHandler(new int[]{0}, new int[0]);')) {
             problems << 'Autosaw fluid automation must expose only the core tank on the five non-UP faces and never drain.'
         }
        [
                'container.reinhardtshbm.machine_microwave',
                'container.reinhardtshbm.machine_hydrotreater',
