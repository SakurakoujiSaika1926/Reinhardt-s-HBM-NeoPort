                'assembly_machine/machine_strand_caster'
        ].collect { hbmModId + ':' + it }.findAll { !recipes.contains(it) }.each { recipe ->
            problems << "Required non-expensive recipe is inactive or missing in 528 mode: ${recipe}"
        }
        [
                'assembly_machine/machine_silex_expensive',
                'assembly_machine/machine_fel_expensive',
                'assembly_machine/machine_strand_caster_expensive'
        ].collect { hbmModId + ':' + it }.findAll { recipes.contains(it) }.each { recipe ->
            problems << "Expensive-mode recipe leaked into 528-only audit: ${recipe}"
        }

        def parser = new groovy.json.JsonSlurper()
        def recipeRoot = file("src/main/resources/data/${project.mod_id}/recipe")
        fileTree(recipeRoot) {
            include '**/*.json'
        }.files.each { recipeFile ->
            def recipePath = recipeRoot.toPath().relativize(recipeFile.toPath()).toString().replace('\\', '/')
            def recipeId = hbmModId + ':' + recipePath.substring(0, recipePath.length() - '.json'.length())
            if (!recipes.contains(recipeId)) {
                return
            }
            def recipe = parser.parseText(recipeFile.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
            def relative = project.relativePath(recipeFile)
            def inspect
            inspect = { value, String path, String key ->
                if (value instanceof Map) {
                    value.each { nestedKey, nested -> inspect(nested, "${path}.${nestedKey}", String.valueOf(nestedKey)) }
                } else if (value instanceof List) {
                    value.eachWithIndex { nested, index -> inspect(nested, "${path}[${index}]", key) }
                } else if (value instanceof String && key in ['item', 'id'] && value.startsWith(hbmModId + ':') && !items.contains(value)) {
                    problems << "${relative} ${path} references unregistered item ${value}"
                } else if (value instanceof String && key == 'fluid') {
                    def fluidId = value.contains(':') ? value : hbmModId + ':' + value
                    if (!(value in ['none', 'water', 'lava']) && fluidId.startsWith(hbmModId + ':') && !fluids.contains(fluidId)) {
                        problems << "${relative} ${path} references unregistered fluid ${fluidId}"
                    }
                } else if (value instanceof String && key == 'tag') {
                    if (!itemTagSizes.containsKey(value)) {
                        problems << "${relative} ${path} references missing item tag ${value}"
                    } else if (itemTagSizes[value] == 0) {
                        problems << "${relative} ${path} references empty item tag ${value}"
                    }
                }
            }
            inspect(recipe, '$', '')
        }

        if (!problems.isEmpty()) {
            throw new GradleException("528 runtime recipe audit failed:\n - " + problems.take(200).join('\n - '))
        }
        logger.lifecycle("528 runtime recipe audit passed (${recipes.size()} active HBM recipes, ${anvilConstructionCount} anvil construction, ${anvilSmithingCount} anvil smithing)")
    }
}

def prepareIsolatedRecipeModeAudit = { String directoryName, boolean enable528, boolean enableExpensive ->
    File sourceConfig = file('run-recipe-audit/config/reinhardtshbm-common.toml')
    if (!sourceConfig.isFile()) {
        throw new GradleException('Default recipe audit did not produce reinhardtshbm-common.toml')
    }
    File auditDirectory = file(directoryName)
    File configDirectory = new File(auditDirectory, 'config')
    configDirectory.mkdirs()
    delete new File(auditDirectory, 'world')
    new File(auditDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    new File(auditDirectory, 'server.properties').setText('server-port=0\nonline-mode=false\n', 'UTF-8')
    def configText = sourceConfig.getText('UTF-8')
    def configured = configText.replaceFirst(
            /(?m)^(\s*enable528Mode\s*=\s*)(?:true|false)\s*$/,
            enable528 ? '$1true' : '$1false'
    ).replaceFirst(
            /(?m)^(\s*enableExpensiveMode\s*=\s*)(?:true|false)\s*$/,
            enableExpensive ? '$1true' : '$1false'
    )
    def expected528 = enable528 ? 'true' : 'false'
    def expectedExpensive = enableExpensive ? 'true' : 'false'
    if (!(configured =~ /(?m)^\s*enable528Mode\s*=\s*${expected528}\s*$/).find()
            || !(configured =~ /(?m)^\s*enableExpensiveMode\s*=\s*${expectedExpensive}\s*$/).find()) {
        throw new GradleException("Unable to prepare ${directoryName} with 528=${enable528}, expensive=${enableExpensive}")
    }
    new File(configDirectory, 'reinhardtshbm-common.toml').setText(configured, 'UTF-8')
    [
            new File(auditDirectory, 'recipe-audit.tsv'),
            new File(auditDirectory, 'logs/latest.log')
    ].each { stale ->
        if (stale.exists() && !stale.delete()) {
            throw new GradleException("Unable to clear stale recipe audit artifact ${stale}")
        }
    }
}

def validateIsolatedRecipeModeAudit = { String directoryName, String label, boolean enable528, boolean enableExpensive ->
    File auditDirectory = file(directoryName)
    File auditLog = new File(auditDirectory, 'logs/latest.log')
    File auditReport = new File(auditDirectory, 'recipe-audit.tsv')
    File configFile = new File(auditDirectory, 'config/reinhardtshbm-common.toml')
    if (!auditLog.isFile() || !auditReport.isFile() || !configFile.isFile()) {
        throw new GradleException("${label} recipe audit did not produce its log, report and config")
    }
    def problems = auditLog.readLines('UTF-8').findAll { line ->
        (line.contains('Parsing error loading recipe') && line.contains(project.mod_id + ':'))
                || (line.contains('Error parsing recipe') && line.contains(project.mod_id + ':'))
                || (line.contains('Skipping recipe') && line.contains(project.mod_id + ':') && line.contains('error parsing conditions'))
                || (line.contains('TagLoader') && line.contains("Couldn't load tag"))
    }
    def logText = auditLog.getText('UTF-8')
    if (!logText.contains('HBM_RECIPE_AUDIT_COMPLETE')) {
        problems << "Missing HBM_RECIPE_AUDIT_COMPLETE marker in ${label} audit"
    }
    if (!auditReport.readLines('UTF-8').any { it.startsWith('RECIPE\t') }) {
        problems << "${label} audit report contains no decoded recipes"
    }
    def configText = configFile.getText('UTF-8')
    def expected528 = enable528 ? 'true' : 'false'
    def expectedExpensive = enableExpensive ? 'true' : 'false'
    if (!(configText =~ /(?m)^\s*enable528Mode\s*=\s*${expected528}\s*$/).find()) {
        problems << "${label} audit config does not have enable528Mode=${expected528}"
    }
    if (!(configText =~ /(?m)^\s*enableExpensiveMode\s*=\s*${expectedExpensive}\s*$/).find()) {
        problems << "${label} audit config does not have enableExpensiveMode=${expectedExpensive}"
    }
    if (!problems.isEmpty()) {
        throw new GradleException("${label} runtime recipe audit failed:\n - " + problems.take(200).join('\n - '))
    }
    logger.lifecycle("${label} runtime recipe audit passed (${auditReport.readLines('UTF-8').count { it.startsWith('RECIPE\t') }} active recipes)")
}

