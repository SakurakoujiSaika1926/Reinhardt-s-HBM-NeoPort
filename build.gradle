                        inputs: [['tag', 'c:dusts/steel'], ['tag', 'c:nuggets/technetium']],
                        output: 'scraps_tcalloy', amount: 72
                ],
                scraps_steel_from_iron_coal: [
                        inputs: [['tag', 'c:dusts/iron'], ['tag', 'c:dusts/coal']],
                        output: 'scraps_steel', amount: 72
                ],
                scraps_steel_bulk_from_iron_coal: [
                        inputs: ([['tag', 'c:dusts/iron']] * 4) + ([['tag', 'c:dusts/coal']] * 4),
                        output: 'scraps_steel', amount: 288
                ]
        ]
        expectedCrafting.each { name, contract ->
            def recipeFile = file("${recipeRoot}/${name}.json")
            if (!recipeFile.isFile()) {
                problems << "Missing scraps crafting recipe ${name}.json."
                return
            }
            def recipe = parser.parse(recipeFile)
            def actualInputs = (recipe.ingredients ?: []).collect { ingredient ->
                ingredient.containsKey('item') ? ['item', ingredient.item] : ['tag', ingredient.tag]
            }
            def customData = recipe.result?.components?.get('minecraft:custom_data')
            if (recipe.type != 'minecraft:crafting_shapeless'
                    || actualInputs != contract.inputs
                    || recipe.result?.id != "${project.mod_id}:${contract.output}"
                    || customData?.amount != contract.amount
                    || customData?.liquid != false
                    || recipe.result?.components?.get('minecraft:custom_model_data') != 0) {
                problems << "${name}.json differs from the exact 1.7.10 scraps contract."
            }
        }

        def crystallizerFile = file("${recipeRoot}/crystallizer/malachite_to_copper_scraps.json")
        if (!crystallizerFile.isFile()) {
            problems << 'Missing malachite-to-copper-scraps crystallizer recipe.'
        } else {
            def recipe = parser.parse(crystallizerFile)
            def customData = recipe.result?.components?.get('minecraft:custom_data')
            if (recipe.type != "${project.mod_id}:crystallizer"
                    || recipe.ingredient?.tag != 'c:ingots/malachite'
                    || recipe.acid?.fluid != 'sulfuric_acid'
                    || recipe.acid?.amount != 250
                    || recipe.duration != 300
                    || recipe.result?.id != "${project.mod_id}:scraps_copper"
                    || customData?.amount != 72
                    || customData?.liquid != false) {
                problems << 'Malachite crystallizer scraps recipe differs from 1.7.10.'
            }
        }

        def splitJson = file("${recipeRoot}/scraps_split.json")
        if (!splitJson.isFile() || parser.parse(splitJson).type != "${project.mod_id}:scraps_split") {
            problems << 'Missing scraps split special recipe JSON.'
        }
        ['contents.amount() / 2', 'result.setCount(2)', 'ScrapsItem.create(', 'false'].each { fragment ->
            if (!splitSource.contains(fragment)) {
                problems << "Scraps split recipe lost exact behavior fragment '${fragment}'."
            }
        }
        if (!typeSource.contains('SCRAPS_SPLIT_SERIALIZER')
                || !typeSource.contains('RECIPE_SERIALIZERS.register("scraps_split", ScrapsSplitRecipe.Serializer::new)')) {
            problems << 'Scraps split serializer is not registered.'
        }
        if (!lookupSource.contains('stack.getItem() instanceof ScrapsItem')
                || !lookupSource.contains('ScrapsItem.contents(stack)')) {
            problems << 'Flattened scraps are no longer accepted by the central foundry material lookup.'
        }
        // Latest 1.7.10 keeps the original foundry-scraps recipe above and,
        // only under LBSM simpleCrafting, adds a second red-copper powder
        // recipe. It is not a replacement for the scraps path.
        def lbsmRedCopperFile = file("${recipeRoot}/powder_red_copper.json")
        if (!lbsmRedCopperFile.isFile()) {
            problems << 'Missing latest-1.7.10 LBSM red-copper powder recipe.'
        } else {
            def recipe = parser.parse(lbsmRedCopperFile)
            def conditions = recipe['neoforge:conditions'] as List
            def ingredients = (recipe.ingredients as List).collect { it.tag }
            if (conditions?.size() != 1
                    || conditions[0].type != "${project.mod_id}:less_bullshit_mode"
                    || conditions[0].feature != 'simple_crafting'
                    || recipe.type != 'minecraft:crafting_shapeless'
                    || ingredients != ['c:dusts/redstone', 'c:dusts/copper']
                    || recipe.result?.id != "${project.mod_id}:powder_red_copper"
                    || recipe.result?.count != 2) {
                problems << 'LBSM red-copper powder recipe diverged from latest 1.7.10 PowderRecipes.'
            }
        }
        ['powder_tcalloy_from_steel_and_technetium.json'].each { retired ->
            if (file("${recipeRoot}/${retired}").exists()) {
                problems << "Retired powder substitution ${retired} conflicts with the original scraps recipe."
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Flattened scraps validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle("Flattened scraps validation passed (${expectedItems.size()} independent items and 7 exact recipe paths).")
    }
}

tasks.register('validateFlattenedDataDrives') {
    group = 'verification'
    description = 'Guards the 11 independently registered latest-legacy data drives and their complete pre-supercomputer recipe chain.'

    def itemRegistry = file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java')
    def recipeRoot = file("src/main/resources/data/${project.mod_id}/recipe")
    def modelRoot = file("src/main/resources/assets/${project.mod_id}/models/item")
    def textureRoot = file("src/main/resources/assets/${project.mod_id}/textures/item")
    def enUs = file("src/main/resources/assets/${project.mod_id}/lang/en_us.json")
    def zhCn = file("src/main/resources/assets/${project.mod_id}/lang/zh_cn.json")
    inputs.files(itemRegistry, enUs, zhCn)
    inputs.dir(recipeRoot)
    inputs.dir(modelRoot)
    inputs.dir(textureRoot)
    outputs.upToDateWhen { false }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def registrySource = itemRegistry.getText('UTF-8')
        def problems = []
        def expectedItems = [
                'drive_flash_empty', 'drive_disk_empty', 'drive_flash_broken', 'drive_disk_broken',
                'drive_flash_flightsim', 'drive_flash_particlesim',
                'drive_disk_flightdata', 'drive_disk_flightdata_processed',
                'drive_disk_orbitdata', 'drive_disk_orbitdata_processed', 'drive_klaus'
        ]

        expectedItems.each { id ->
            def constant = id.toUpperCase(java.util.Locale.ROOT)
            if (!registrySource.contains("public static final DeferredItem<Item> ${constant} = material(MACHINE_COMPONENTS, \"${id}\");")) {
                problems << "Missing independent data-drive registration ${id}."
            }
            def modelFile = file("${modelRoot}/${id}.json")
            def textureFile = file("${textureRoot}/${id}.png")
            if (!modelFile.isFile()) {
                problems << "Missing data-drive model ${id}.json."
            } else {
                def model = parser.parse(modelFile)
                if (model.parent != 'minecraft:item/generated'
                        || model.textures?.layer0 != "${project.mod_id}:item/${id}") {
                    problems << "Data-drive model ${id}.json does not point at its dedicated texture."
                }
            }
            if (!textureFile.isFile() || textureFile.length() <= 0L) {
                problems << "Missing data-drive texture ${id}.png."
            }
        }
        def actualModels = fileTree(modelRoot) { include 'drive_*.json' }.files
                .collect { it.name.substring(0, it.name.length() - '.json'.length()) }.sort()
        def actualTextures = fileTree(textureRoot) { include 'drive_*.png' }.files
                .collect { it.name.substring(0, it.name.length() - '.png'.length()) }.sort()
        if (actualModels != expectedItems.sort()) {
            problems << 'Flattened data-drive model set differs from the exact 11-value latest legacy enum.'
        }
        if (actualTextures != expectedItems.sort()) {
            problems << 'Flattened data-drive texture set differs from the exact 11-value latest legacy enum.'
        }
        if (registrySource.contains('DeferredItem<Item> DRIVE =')) {
            problems << 'A metadata-backed base drive item must not be reintroduced.'
        }

        def expectedNames = [
                drive_flash_empty: ['Flash Drive (Empty)', '闪存盘（空）'],
                drive_disk_empty: ['Disk Drive (Empty)', '数据磁盘（空）'],
                drive_flash_broken: ['Flash Drive (Broken)', '闪存盘（损坏）'],
                drive_disk_broken: ['Disk Drive (Broken)', '数据磁盘（损坏）'],
                drive_flash_flightsim: ['Flash Drive (Flight Simulation Data)', '闪存盘（飞行模拟数据）'],
                drive_flash_particlesim: ['Flash Drive (Particle Simulation Data)', '闪存盘（粒子模拟数据）'],
                drive_disk_flightdata: ['Disk Drive (Flight Data)', '数据磁盘（飞行数据）'],
                drive_disk_flightdata_processed: ['Disk Drive (Processed Flight Data)', '数据磁盘（已处理飞行数据）'],
                drive_disk_orbitdata: ['Disk Drive (Orbital Data)', '数据磁盘（轨道数据）'],
                drive_disk_orbitdata_processed: ['Disk Drive (Processed Orbital Data)', '数据磁盘（已处理轨道数据）'],
                drive_klaus: ['Klaus', '克劳斯']
        ]
        def en = parser.parse(enUs)
        def zh = parser.parse(zhCn)
        expectedNames.each { id, names ->
            def key = "item.${project.mod_id}.${id}"
            if (en[key] != names[0] || zh[key] != names[1]) {
                problems << "Data-drive localization differs for ${id}."
            }
        }

        def assemblyContracts = [
                drive_flash_empty: [
                        group: 'ass.flashdrive', duration: 100, power: 250,
                        inputs: [['tag', 'c:ingots/plastic', 2], ['item', "${project.mod_id}:circuit_chip", 1], ['tag', 'c:plates/gold', 1]]
                ],
                drive_disk_empty: [
                        group: 'ass.diskdrive', duration: 200, power: 250,
                        inputs: [['tag', 'c:ingots/plastic', 8], ['item', "${project.mod_id}:circuit_basic", 1], ['tag', 'c:wires_dense/neodymium', 1]]
                ]
        ]
        assemblyContracts.each { id, contract ->
            def recipeFile = file("${recipeRoot}/assembly_machine/${id}.json")
            if (!recipeFile.isFile()) {
                problems << "Missing data-drive assembly recipe ${id}.json."
                return
            }
            def recipe = parser.parse(recipeFile)
            def inputs = (recipe.ingredients ?: []).collect { counted ->
                def ingredient = counted.ingredient
                ingredient.containsKey('item')
                        ? ['item', ingredient.item, counted.count]
                        : ['tag', ingredient.tag, counted.count]
            }
            if (recipe.type != "${project.mod_id}:assembly_machine"
                    || recipe.group != contract.group
                    || recipe.duration != contract.duration
                    || recipe.power != contract.power
                    || inputs != contract.inputs
                    || recipe.result?.id != "${project.mod_id}:${id}") {
                problems << "${id}.json differs from the latest 1.7.10 assembly contract."
            }
        }

        [drive_flash_broken: 2, drive_disk_broken: 4].each { id, count ->
            def recipeFile = file("${recipeRoot}/shredder/${id}_to_powder_polymer.json")
            if (!recipeFile.isFile()) {
                problems << "Missing broken-drive shredder recipe for ${id}."
                return
            }
            def recipe = parser.parse(recipeFile)
            if (recipe.type != "${project.mod_id}:shredder"
                    || recipe.ingredient?.item != "${project.mod_id}:${id}"
                    || recipe.result?.id != "${project.mod_id}:powder_polymer"
                    || recipe.result?.count != count) {
                problems << "Broken-drive shredder recipe differs for ${id}."
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Flattened data-drive validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle('Flattened data-drive validation passed (11 independent items, 2 assembly recipes, 2 shredder recipes).')
    }
}

