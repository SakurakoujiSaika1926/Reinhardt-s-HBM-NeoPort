        def requireOwnedFragments = { String path, String source, List<String> fragments, String contract ->
            if (source == null) {
                problems << "Missing orientation ownership source ${path}."
                return
            }
            fragments.each { fragment ->
                if (!source.contains(fragment)) {
                    problems << "${contract} is missing owned source contract '${fragment}'."
                }
            }
        }
        def forbidOwnedFragments = { String path, String source, List<String> fragments, String contract ->
            if (source == null) return
