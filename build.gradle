        def parser = new groovy.json.JsonSlurper()
        def radarModels = [
                'machine_radar_base.json'       : ['models/obj/machines/radar.obj', 'Base', true, 'Dish', false],
                'machine_radar_dish.json'       : ['models/obj/machines/radar.obj', 'Base', false, 'Dish', true],
                'machine_radar_large_base.json' : ['models/obj/machines/radar_large.obj', 'Radar', true, 'Dish', false],
                'machine_radar_large_dish.json' : ['models/obj/machines/radar_large.obj', 'Radar', false, 'Dish', true]
        ]
        radarModels.each { name, expected ->
            File modelFile = file("src/main/resources/assets/reinhardtshbm/models/block/${name}")
            if (!modelFile.isFile()) {
                problems << "missing radar model split: ${name}"
                return
            }
            def model = parser.parse(modelFile)
            if (model.model != "reinhardtshbm:${expected[0]}"
                    || model.visibility[expected[1]] != expected[2]
                    || model.visibility[expected[3]] != expected[4]) {
                problems << "${name} no longer selects the audited old OBJ groups exactly."
            }
        }

        def expectedGlobalModifiers = [
                'reinhardtshbm:legacy_loot_mineshaft',
                'reinhardtshbm:legacy_loot_dungeon',
                'reinhardtshbm:legacy_loot_desert_pyramid',
                'reinhardtshbm:legacy_loot_jungle_temple',
                'reinhardtshbm:legacy_loot_spawn_bonus_chest',
                'reinhardtshbm:legacy_loot_village_armorer',
                'reinhardtshbm:legacy_loot_village_toolsmith',
                'reinhardtshbm:legacy_loot_village_weaponsmith'
        ]
        File globalModifierFile = file('src/main/resources/data/neoforge/loot_modifiers/global_loot_modifiers.json')
        if (!globalModifierFile.isFile()) {
            problems << 'missing NeoForge global loot-modifier registry'
        } else {
            def globalModifiers = parser.parse(globalModifierFile)
            if (globalModifiers.replace != false || globalModifiers.entries != expectedGlobalModifiers) {
                problems << 'global legacy chest loot-modifier list changed or is replacing other mods.'
            }
        }

        def expectedLoot = [
                legacy_mineshaft: [empty: 80, items: [bathwater: 1, serum: 5, no9: 5, key_red_cracked: 5]],
                legacy_dungeon: [empty: 120, items: [heart_piece: 1, key_red_cracked: 5, scrumpy: 1]],
                legacy_desert_pyramid: [empty: 73, items: [heart_piece: 1, scrumpy: 1]],
                legacy_jungle_temple: [empty: 73, items: [heart_piece: 1]],
                legacy_spawn_bonus_chest: [empty: 64, items: [no9: 7]],
                legacy_village_blacksmith: [empty: 94, items: [armor_polish: 3, bathwater: 1]]
        ]
        expectedLoot.each { name, expected ->
            File lootFile = file("src/main/resources/data/reinhardtshbm/loot_table/chests/injections/${name}.json")
            if (!lootFile.isFile()) {
                problems << "missing legacy chest injection table: ${name}"
                return
            }
            def loot = parser.parse(lootFile)
            def entries = loot.pools[0].entries as List
            def empty = entries.find { it.type == 'minecraft:empty' }
            def actualItems = entries.findAll { it.type == 'minecraft:item' }.collectEntries {
                [(it.name.toString().replace('reinhardtshbm:', '')): (it.weight as int)]
            }
            if ((empty?.weight as Integer) != expected.empty || actualItems != expected.items) {
                problems << "${name} weights diverged from the audited 1.7.10 ChestGenHooks additions."
            }
        }

        // The obsolete train system is intentionally absent. rail_narrow and
        // its itemless straight template remain because legacy structures use them.
        def removedJava = [
                'src/main/java/com/reinhardt/hbm/item/LegacyMinecartItem.java',
                'src/main/java/com/reinhardt/hbm/item/LegacyTrainItem.java',
                'src/main/java/com/reinhardt/hbm/entity/LegacyMinecartEntity.java',
                'src/main/java/com/reinhardt/hbm/entity/LegacyTrainEntity.java',
                'src/main/java/com/reinhardt/hbm/client/render/LegacyMinecartEntityRenderer.java',
                'src/main/java/com/reinhardt/hbm/client/render/LegacyTrainEntityRenderer.java'
        ]
        removedJava.each { path ->
            if (file(path).exists()) problems << "retired train gameplay source returned: ${path}"
        }
        String blocks = source('src/main/java/com/reinhardt/hbm/registry/HbmBlocks.java')
        String items = source('src/main/java/com/reinhardt/hbm/registry/HbmItems.java')
        String entities = source('src/main/java/com/reinhardt/hbm/registry/HbmEntityTypes.java')
        ['rail_wood', 'rail_highspeed', 'rail_booster', 'rail_large_', 'rail_narrow_curve'].each { id ->
            if (blocks.contains('"' + id)) problems << "retired train rail registration returned: ${id}"
        }
        ['RegistryObject<Item> CART', 'RegistryObject<Item> TRAIN'].each { declaration ->
            if (items.contains(declaration)) problems << "retired train item registration returned: ${declaration}"
        }
        ['LEGACY_MINECART', 'LEGACY_TRAIN'].each { declaration ->
            if (entities.contains(declaration)) problems << "retired train entity registration returned: ${declaration}"
        }
        if (!blocks.contains('railBlock("rail_narrow"')
                || !blocks.contains('registerBlockWithoutItem("rail_narrow_straight"')) {
            problems << 'structure-required narrow rail registrations were removed with train gameplay.'
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Latest mode/radar/loot/train parity validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle('Latest mode/radar/loot/train parity passed (LBSM, cataclysm, both radar animations, exact chest weights, train removal with structure rail retention)')
    }
}

tasks.register('validateStellarFluxParity') {
    group = 'verification'
    description = 'Guards the complete latest-1.7.10 Stellar Flux production, transport, storage and consumption chain.'

    inputs.files(
            'src/main/java/com/reinhardt/hbm/fluid/HbmFluidDefinitions.java',
            'src/main/java/com/reinhardt/hbm/blockentity/IcfCoreBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/client/screen/IcfCoreScreen.java',
            'src/main/resources/data/reinhardtshbm/recipe/fusion/stellar.json',
            'src/main/resources/data/reinhardtshbm/recipe/assembly_machine/fluid_pack_stellar_flux.json',
            'src/main/resources/data/reinhardtshbm/recipe/assembly_machine/fluid_unpack_stellar_flux.json',
            'src/main/resources/assets/reinhardtshbm/lang/en_us.json',
            'src/main/resources/assets/reinhardtshbm/lang/zh_cn.json'
    )
    inputs.files fileTree('src/main/resources/data/reinhardtshbm/recipe/plasma_forge') {
        include '*.json'
    }
    outputs.upToDateWhen { false }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def problems = []
        def parseJson = { String path ->
            File target = file(path)
            if (!target.isFile()) {
                problems << "missing Stellar Flux resource: ${path}"
                return null
            }
            try {
                return parser.parseText(target.getText('UTF-8').replaceFirst('^\uFEFF', ''))
            } catch (Exception exception) {
                problems << "invalid Stellar Flux JSON ${path}: ${exception.message}"
                return null
            }
        }
        def requireSourceFragments = { String path, List<String> fragments ->
            File sourceFile = file(path)
            if (!sourceFile.isFile()) {
                problems << "missing Stellar Flux source: ${path}"
                return
            }
            String sourceText = sourceFile.getText('UTF-8')
            fragments.each { fragment ->
                if (!sourceText.contains(fragment)) {
                    problems << "${path} lost Stellar Flux contract: ${fragment}"
                }
            }
        }

        requireSourceFragments('src/main/java/com/reinhardt/hbm/fluid/HbmFluidDefinitions.java', [
                'definition(140, 142, "STELLAR_FLUX", "stellar_flux", 0xE300FF',
                '"GASEOUS|ANTI"'
        ])
        requireSourceFragments('src/main/java/com/reinhardt/hbm/blockentity/IcfCoreBlockEntity.java', [
                'public static final int FLUX_CAPACITY = 24_000;',
                'new HbmFluidTank(fluid("stellar_flux"), FLUX_CAPACITY)',
                'Math.ceil(this.heat * 10.0D / MAX_HEAT)',
                'sendTank(level, stellarFlux, target, port.exposedFace())',
                'case 2 -> stellarFlux.getFluidInTank(0)',
                'drained = stellarFlux.drain(requested, resource.getAmount(), action.simulate())'
        ])
        requireSourceFragments('src/main/java/com/reinhardt/hbm/client/screen/IcfCoreScreen.java', [
                'menu.tankFluid(2)',
                'menu.tankScaled(2, 70)'
        ])

        def fusion = parseJson('src/main/resources/data/reinhardtshbm/recipe/fusion/stellar.json')
        if (fusion != null) {
            def expected = [
                    group: 'fus.stellar', ignition_temp: 10_000_000, output_temp: 50_000_000,
                    neutron_flux: 10_000.0G, power: 25_000, duration: 100
            ]
            expected.each { key, value ->
                if (fusion[key] != value) {
                    problems << "fusion/stellar.json ${key} must be ${value}, found ${fusion[key]}"
                }
            }
            def inputs = fusion.input_fluids as List
            if (inputs?.size() != 1 || inputs[0].fluid != 'stellar_flux' || (inputs[0].amount as Integer) != 5) {
                problems << 'fusion/stellar.json must consume exactly 5 mB/t of stellar_flux at full speed.'
            }
            if (fusion.output_item?.id != 'reinhardtshbm:powder_gold' || (fusion.output_item?.count ?: 1) != 1) {
                problems << 'fusion/stellar.json must retain the latest-1.7.10 gold-powder output.'
            }
        }

        [
                'hde.json'           : 4_000,
                'dfc_core.json'      : 12_000,
                'dfc_emitter.json'   : 4_000,
                'dfc_receiver.json'  : 4_000,
                'dfc_injector.json'  : 4_000,
                'dfc_stabilizer.json': 4_000
        ].each { name, amount ->
            def recipe = parseJson("src/main/resources/data/reinhardtshbm/recipe/plasma_forge/${name}")
            if (recipe != null) {
                def stellarInput = (recipe.input_fluids as List)?.find { it.fluid == 'stellar_flux' }
                if (stellarInput == null || (stellarInput.amount as Integer) != amount) {
                    problems << "plasma_forge/${name} must consume ${amount} mB of stellar_flux."
                }
            }
        }

        def packed = parseJson('src/main/resources/data/reinhardtshbm/recipe/assembly_machine/fluid_pack_stellar_flux.json')
        if (packed != null) {
            def input = (packed.input_fluids as List)?.find { it.fluid == 'stellar_flux' }
            if (input == null || (input.amount as Integer) != 32_000
                    || packed.result?.id != 'reinhardtshbm:fluid_pack_full'
                    || packed.result?.components?.'minecraft:custom_data'?.fluid != 'stellar_flux') {
                problems << 'Stellar Flux packaging must consume 32,000 mB and preserve the stellar_flux component.'
            }
        }
        def unpacked = parseJson('src/main/resources/data/reinhardtshbm/recipe/assembly_machine/fluid_unpack_stellar_flux.json')
        if (unpacked != null) {
            def output = (unpacked.output_fluids as List)?.find { it.fluid == 'stellar_flux' }
            if (output == null || (output.amount as Integer) != 32_000
                    || unpacked.result?.id != 'reinhardtshbm:fluid_pack_empty') {
                problems << 'Stellar Flux unpackaging must return 32,000 mB and one empty fluid pack.'
            }
        }

        def english = parseJson('src/main/resources/assets/reinhardtshbm/lang/en_us.json')
        def chinese = parseJson('src/main/resources/assets/reinhardtshbm/lang/zh_cn.json')
        if (english != null && english['hbmfluid.stellar_flux'] != 'Stellar Flux') {
            problems << 'en_us.json lost the Stellar Flux fluid name.'
        }
        if (chinese != null && chinese['hbmfluid.stellar_flux'] != '星流浆') {
            problems << 'zh_cn.json lost the 星流浆 fluid name.'
        }

        if (!problems.isEmpty()) {
            throw new GradleException('Stellar Flux parity validation failed:\n - ' + problems.join('\n - '))
        }
        logger.lifecycle('Stellar Flux parity passed (ICF production/output, 32 B packaging, 5 mB/t fusion, six plasma-forge consumers, GUI and localization)')
    }
}

tasks.register('deployClientMod') {
    group = 'distribution'
    description = 'Atomically deploys the built mod jar into the configured local NeoForge mods folder.'
    dependsOn tasks.named('jar')
    dependsOn tasks.named('validateLangFiles')
    dependsOn tasks.named('validateJarIntegrity')
    dependsOn tasks.named('validateThermalParity')
    dependsOn tasks.named('validatePowerParity')
    dependsOn tasks.named('validateFlattenedFoundryMolds')
    dependsOn tasks.named('validateRocketMissileRecipes')
    dependsOn tasks.named('validateRecipeJsonSchemas')
    dependsOn tasks.named('validateBlueprintParity')
    dependsOn tasks.named('validateRecipeSemantics')
    dependsOn tasks.named('validateCinnabarProcessingParity')
    dependsOn tasks.named('validateModernOreGeology')
    dependsOn tasks.named('validateRecipeBaseline')
    dependsOn tasks.named('validateCraneRecipeParity')
    dependsOn tasks.named('validateCapacitorParity')
    dependsOn tasks.named('validateNuclearBlastParity')
    dependsOn tasks.named('validateRuntimeRecipes')
    dependsOn tasks.named('validateRuntimeRecipes528')
    dependsOn tasks.named('validateMachineRecipeModeMatrix')
    dependsOn tasks.named('validateItemAcquisition')
    dependsOn tasks.named('validateItemAcquisition528')
    dependsOn tasks.named('validateMachineRecipeCoverage')
    dependsOn tasks.named('validateLatestUpstreamMachineRecipes')
    dependsOn tasks.named('validateLatestUpstreamContent')
    dependsOn tasks.named('validateLatestUpstreamBehaviorParity')
    dependsOn tasks.named('validateLegacyGlobalGameplayParity')
    dependsOn tasks.named('validateLegacyPlacementAndObjBatching')
    dependsOn tasks.named('validateLatestMachineCapabilityPorts')
    dependsOn tasks.named('validateGasTickPerformance')
    dependsOn tasks.named('validateVendingMachineParity')
    dependsOn tasks.named('validateMixerFluidTankRouting')
    dependsOn tasks.named('validateLatestModeRadarLootAndTrainParity')
    dependsOn tasks.named('validateBlockDestroyParticles')
    dependsOn tasks.named('validateStellarFluxParity')

    doLast {
        File sourceJar = tasks.named('jar').get().archiveFile.get().asFile
        File targetDirectory = localClientModsDir
        def minecraftProcesses = ProcessHandle.allProcesses()
                .findAll { process ->
                    process.pid() != ProcessHandle.current().pid()
                            && process.info().commandLine()
                            .map { commandLine ->
                                commandLine.contains('net.minecraft.client.main.Main')
                                        || commandLine.contains('net.minecraft.server.Main')
                                        || commandLine.contains('cpw.mods.bootstraplauncher.BootstrapLauncher')
                            }
                            .orElse(false)
                }
                .collect { process ->
                    def started = process.info().startInstant().map { it.toString() }.orElse('unknown start time')
                    "${process.pid()} (${started})"
                }
        if (!minecraftProcesses.isEmpty()) {
            throw new GradleException(
                    "Refusing to deploy ${sourceJar.name} while Minecraft/NeoForge is running. " +
                            "Close the game before deploying; running clients keep ZIP/class indexes open " +
                            "and can crash with missing classes or broken textures after the jar is replaced. " +
                            "Detected process ids: ${minecraftProcesses.join(', ')}"
            )
        }
        if (!targetDirectory.exists() && !targetDirectory.mkdirs()) {
            throw new GradleException("Unable to create client mods directory ${targetDirectory}")
        }

        File targetJar = new File(targetDirectory, sourceJar.name)
        File temporaryJar = new File(targetDirectory, "${sourceJar.name}.tmp-${UUID.randomUUID()}")
        try {
            // Never stream directly into the live jar: a running client may still
            // read classes/resources from that path and observe a half-written ZIP.
            java.nio.file.Files.copy(
                    sourceJar.toPath(),
                    temporaryJar.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            new java.util.zip.ZipFile(temporaryJar).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (!entry.directory) {
                        zip.getInputStream(entry).withCloseable { input ->
                            byte[] buffer = new byte[16 * 1024]
                            while (input.read(buffer) != -1) {
                                // Consume every entry so CRC and size checks run.
                            }
                        }
                    }
                }
            }

            try {
                java.nio.file.Files.move(
                        temporaryJar.toPath(),
                        targetJar.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE
                )
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(
                        temporaryJar.toPath(),
                        targetJar.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            }

            targetDirectory.listFiles()
                    .findAll { it.isFile() && it.name.startsWith("${mod_id}-") && it.name.endsWith(".jar") && it.name != targetJar.name }
                    .each { stale ->
                        if (!stale.delete()) {
                            logger.warn("Unable to remove stale deployed mod jar ${stale}")
                        }
                    }
            logger.lifecycle("Atomically deployed ${targetJar.name} to ${targetDirectory}")
        } catch (Exception ex) {
            throw new GradleException(
                    "Client mod deployment aborted; the live jar was not partially overwritten. " +
                            "Close Minecraft before retrying if ${targetJar} is locked.",
                    ex
            )
        } finally {
            if (temporaryJar.exists()) {
                temporaryJar.delete()
            }
        }
    }
}

tasks.register('validateChunkSlicedOilWorldgen') {
    group = 'verification'
    description = 'Validates complete deterministic chunk slicing for radius-48 oil and oil-sand deposits.'
    inputs.files(
            'src/main/java/com/reinhardt/hbm/worldgen/ChunkSlicedOilWorldgen.java',
            'src/main/java/com/reinhardt/hbm/worldgen/OilBubbleFeature.java',
            'src/main/java/com/reinhardt/hbm/worldgen/OilSandBubbleFeature.java',
            'src/main/java/com/reinhardt/hbm/worldgen/WorldgenFeatureBounds.java',
            'src/main/resources/data/reinhardtshbm/worldgen/placed_feature/oil_bubble.json',
            'src/main/resources/data/reinhardtshbm/worldgen/placed_feature/oil_sand_bubble.json'
    )

    doLast {
        def problems = []
        def helperSource = file('src/main/java/com/reinhardt/hbm/worldgen/ChunkSlicedOilWorldgen.java').getText('UTF-8')
        def oilSource = file('src/main/java/com/reinhardt/hbm/worldgen/OilBubbleFeature.java').getText('UTF-8')
        def oilSandSource = file('src/main/java/com/reinhardt/hbm/worldgen/OilSandBubbleFeature.java').getText('UTF-8')
        def boundsSource = file('src/main/java/com/reinhardt/hbm/worldgen/WorldgenFeatureBounds.java').getText('UTF-8')

        if (!helperSource.contains('sourceChunkSearchRadius') || !helperSource.contains('boundedCoordinateRandom')) {
            problems << 'Chunk-sliced oil helper must retain deterministic source-radius and coordinate-random functions.'
        }
        [oilSource, oilSandSource].eachWithIndex { source, index ->
            def name = index == 0 ? 'OilBubbleFeature' : 'OilSandBubbleFeature'
            if (!source.contains('WorldgenFeatureBounds.forCurrentChunk')) {
                problems << "${name} must restrict every write pass to the current chunk."
            }
            if (!source.contains('getUncachedNoiseBiome')) {
                problems << "${name} must resolve source biomes without loading remote chunks."
            }
            if (source.contains('WorldgenFeatureBounds.forFeature')) {
                problems << "${name} must not write through the surrounding 3x3 feature region."
            }
        }
        if (!oilSandSource.contains('boundedCoordinateRandom')) {
            problems << 'Oil-sand fuzz must be coordinate-deterministic so chunk borders cannot form seams.'
        }
        if (!boundsSource.contains('aroundGenerationCenter(level, origin, 0)')) {
            problems << 'WorldgenFeatureBounds must expose an exact current-chunk write boundary.'
        }

        ['oil_bubble', 'oil_sand_bubble'].each { id ->
            def placed = new groovy.json.JsonSlurper().parse(file("src/main/resources/data/reinhardtshbm/worldgen/placed_feature/${id}.json"))
            def placements = placed.placement as List
            if (placements.size() != 1 || placements[0].type != 'minecraft:biome') {
                problems << "${id} placement must run exactly once per chunk; center/Y randomness belongs to source-chunk reconstruction."
            }
        }

        def sourceRadius = { int radius -> Math.floorDiv(Math.max(0, radius) + 15, 16) }
        [[0, 0], [1, 1], [16, 1], [17, 2], [48, 3], [128, 8]].each { pair ->
            if (sourceRadius(pair[0] as int) != pair[1]) {
                problems << "Source-chunk search radius is wrong for block radius ${pair[0]}."
            }
        }

        def validateSlicing = { int centerX, int centerZ, boolean fuzzy ->
            int radius = 48
            int centerY = 64
            int diameter = radius * 2
            int radiusSquaredHalf = (radius * radius).intdiv(2)
            int randomBound = Math.max(1, radiusSquaredHalf.intdiv(3))
            def index = { int x, int y, int z ->
                int localX = x - (centerX - radius)
                int localY = y - (centerY - radius)
                int localZ = z - (centerZ - radius)
                (localX * diameter + localY) * diameter + localZ
            }
            def inside = { int x, int y, int z ->
                int xx = x - centerX
                int yy = y - centerY
                int zz = z - centerZ
                int fuzz = fuzzy ? Math.floorMod(x * 73428767 ^ y * 912931 ^ z * 438289, randomBound) : 0
                xx * xx + yy * yy * 3 + zz * zz < radiusSquaredHalf + fuzz
            }

            def whole = new java.util.BitSet(diameter * diameter * diameter)
            for (int x = centerX - radius; x < centerX + radius; x++) {
                for (int y = centerY - radius; y < centerY + radius; y++) {
                    for (int z = centerZ - radius; z < centerZ + radius; z++) {
                        if (inside(x, y, z)) {
                            whole.set(index(x, y, z))
                        }
                    }
                }
            }

            def buildSlices = { boolean reverse ->
                def slices = new java.util.BitSet(diameter * diameter * diameter)
                int sourceChunkX = centerX >> 4
                int sourceChunkZ = centerZ >> 4
                int chunkRadius = sourceRadius(radius)
                int start = reverse ? chunkRadius : -chunkRadius
                int end = reverse ? -chunkRadius : chunkRadius
                int step = reverse ? -1 : 1
                for (int offsetX = start; reverse ? offsetX >= end : offsetX <= end; offsetX += step) {
                    int chunkX = sourceChunkX + offsetX
                    int minX = Math.max(centerX - radius, chunkX << 4)
                    int maxX = Math.min(centerX + radius, (chunkX + 1) << 4)
                    for (int offsetZ = start; reverse ? offsetZ >= end : offsetZ <= end; offsetZ += step) {
                        int chunkZ = sourceChunkZ + offsetZ
                        int minZ = Math.max(centerZ - radius, chunkZ << 4)
                        int maxZ = Math.min(centerZ + radius, (chunkZ + 1) << 4)
                        for (int x = minX; x < maxX; x++) {
                            for (int y = centerY - radius; y < centerY + radius; y++) {
                                for (int z = minZ; z < maxZ; z++) {
                                    if (inside(x, y, z)) {
                                        int bit = index(x, y, z)
                                        if (slices.get(bit)) {
                                            problems << "Duplicate chunk ownership at ${x},${y},${z}."
                                        }
                                        slices.set(bit)
                                    }
                                }
                            }
                        }
                    }
                }
                slices
            }

            def forward = buildSlices(false)
            def reverse = buildSlices(true)
            def label = "${fuzzy ? 'fuzzy' : 'solid'} radius-48 bubble at ${centerX},${centerZ}"
            if (whole != forward) problems << "${label} is incomplete in forward chunk order."
            if (whole != reverse) problems << "${label} is incomplete in reverse chunk order."
            if (forward != reverse) problems << "${label} depends on chunk generation order."
        }

        validateSlicing(0, 0, false)
        validateSlicing(15, 15, false)
        validateSlicing(0, 0, true)
        validateSlicing(15, 15, true)

        if (!problems.isEmpty()) {
            throw new GradleException('Chunk-sliced oil worldgen validation failed:\n - ' + problems.unique().join('\n - '))
        }
        logger.lifecycle('Chunk-sliced oil worldgen validation passed (radius-48 completeness, unique ownership, order independence, remote-biome safety)')
    }
}

