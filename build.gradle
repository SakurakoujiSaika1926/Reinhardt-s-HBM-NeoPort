            }
        }

        def dedicatedBewlrItems = [
                'pump_steam', 'pump_electric', 'machine_bat9000', 'machine_bigasstank', 'deco_toaster',
                'red_connector', 'red_connector_super', 'red_pylon_medium_wood',
                'red_pylon_medium_wood_transformer', 'red_pylon_medium_steel', 'red_pylon_medium_steel_transformer',
                'red_pylon_large', 'substation'
        ]
        dedicatedBewlrItems.each { id ->
            if (!legacyMachineItemModel.contains("\"${id}\"")
                    || !objItemAutoFitModel.contains("\"${id}\"")) {
                problems << "Dedicated BEWLR item ${id} must be custom-rendered and excluded from generic OBJ auto-fit."
            }
        }
        if (!powerPylonBlock.contains('return RenderShape.ENTITYBLOCK_ANIMATED;')
                || !powerPylonBlock.contains('context.getHorizontalDirection().getOpposite()')
                || !wiring.contains('public InteractionResult onItemUseFirst(')) {
            problems << 'Power pylons must render only through their BER, retain 1.7.10 placement metadata, and let the cable drum interact before the block.'
        }
        [
                'texOffs(0, 96)', '16.0F, 16.0F, 16.0F',
                'texOffs(1, 1)', '4.0F, 73.0F, 4.0F',
                'texOffs(24, 1)', '6.0F, 4.0F, 6.0F',
                'texOffs(25, 17)', '6.0F, 2.0F, 6.0F',
                'LayerDefinition.create(mesh, 64, 128)'
        ].each { required ->
            if (!legacyRedPylonModel.contains(required)) {
                problems << "Ordinary red pylon is missing exact 1.7.10 ModelPylon geometry/UV contract '${required}'."
            }
        }
        if (!clientRenderers.contains('LegacyRedPylonModel.LAYER, LegacyRedPylonModel::createLayer')
                || !powerPylonRenderer.contains('poseStack.translate(0.5F, 0.625F, 0.5F);')
                || !powerPylonRenderer.contains('Axis.ZP.rotationDegrees(180.0F)')
                || !powerPylonBlockItem.contains('this.kind == PowerPylonBlock.Kind.RED_PYLON')
                || !redPylonItemModel.contains('"parent": "minecraft:item/generated"')
                || !redPylonItemModel.contains('"layer0": "reinhardtshbm:block/red_pylon"')
                || legacyMachineItemModel.contains('"red_pylon"')
                || objItemAutoFitModel.contains('|| path.equals("red_pylon")')) {
            problems << 'Ordinary red pylon must use exact legacy ModelPylon world rendering and the original 1.7.10 flat inventory icon.'
        }
        if (!powerPylonItemRenderer.contains('renderCommon() runs after renderInventory() for GUI items too.')
                || !powerPylonItemRenderer.contains('renderCommonWithStack runs after renderInventory() for GUI items too.')) {
            problems << 'Pylon item renderers must apply the 1.7.10 common transform after the GUI inventory transform.'
        }

        def oilFluidRegistrations = (capabilities =~ /Capabilities\.FluidHandler\.BLOCK,\s*HbmBlockEntities\.OIL_DERRICK\.get\(\)/).findAll().size()
        if (oilFluidRegistrations != 1
                || !oilDerrick.contains('return this.pos.relative(this.face.getOpposite()).immutable();')
                || oilDerrick.contains('public BlockPos connectorPos()')
                || !oilDerrick.contains('new Port(offset(pos, rot, 4, dir, 2), dir)')
                || !oilDerrick.contains('new Port(offset(pos, rot, 4, dir, -2), dir.getOpposite())')
                || !oilDerrickBlock.contains('refreshConnector(level, port.accessPos());')
                || !oilPumpjackBlock.contains('refreshConnector(level, port.accessPos());')) {
            problems << 'Oil derrick/pumpjack must expose one fluid capability registration and keep external pipe positions separate from internal dummy access positions.'
        }
        if (!oilDerrick.contains('OilDerrickBlock.FOOTPRINT')
                || !oilDerrick.contains('OilPumpjackBlock.FOOTPRINT')
                || !oilDerrick.contains('LegacyMachineGeometry.rotate(')) {
            problems << 'Oil derrick menus must validate player distance against the complete rotated 1.7.10 footprint.'
        }

        if (!legacyTankBlockItem.contains('tank.placeFromLegacyAnchor(context)')
                || !largeFluidTankBlock.contains('LEGACY_CORE_OFFSET = 6')
                || !largeFluidTankBlock.contains('occupiedPositions(corePos, facing)')
                || !largeFluidTank.contains('LargeFluidTankBlock.occupiedPositions(this.worldPosition, facing)')) {
            problems << 'The active Big-Ass Tank must place from the 1.7.10 offset-6 anchor and keep its full footprint valid for GUI interaction.'
        }
        if (!largeFluidTankBlock.contains('tank.dropInventoryContentsOnly(level, pos);')
                || !bigAssTankBlock.contains('tank.dropInventoryContentsOnly(level, pos);')
                || !fluidTank.contains('public void dropInventoryContentsOnly(')
                || !legacyTankItemRenderer.contains('if (this.kind == Kind.BIG_ASS_TANK)')
                || !legacyTankItemRenderer.contains('poseStack.scale(0.5F, 0.5F, 0.5F);')) {
            problems << 'Persistent giant tanks must retain fluid in their dropped item, drop only inventory slots, and keep the 1.7.10 Big-Ass Tank item scale.'
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Port regression validation failed:\n - " + problems.join('\n - '))
        }
    }
}

tasks.register('validateThermalParity') {
    group = 'verification'
    description = 'Guards the audited 1.7.10 heat-source, boiler, and solar-boiler numerical contracts.'

    def thermalSources = [
            'src/main/java/com/reinhardt/hbm/blockentity/HeaterBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/HeatBoilerBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/IndustrialBoilerBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/SolarBoilerBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/fluid/HbmThermalConversions.java'
    ]
    inputs.files(thermalSources.collect { file(it) })
    outputs.upToDateWhen { false }

    doLast {
        def source = { String path -> file(path).getText('UTF-8') }
        def heater = source('src/main/java/com/reinhardt/hbm/blockentity/HeaterBlockEntity.java')
        def boiler = source('src/main/java/com/reinhardt/hbm/blockentity/HeatBoilerBlockEntity.java')
        def industrialBoiler = source('src/main/java/com/reinhardt/hbm/blockentity/IndustrialBoilerBlockEntity.java')
        def solarBoiler = source('src/main/java/com/reinhardt/hbm/blockentity/SolarBoilerBlockEntity.java')
        def thermalConversions = source('src/main/java/com/reinhardt/hbm/fluid/HbmThermalConversions.java')
        def problems = []

        [
                'this.kind == Kind.OVEN ? 0.125D : 1.0D',
                'return baseHeat * 15;',
                'return baseHeat * 3;',
                'return baseHeat * 5;',
                'return baseHeat * 2;',
                'int baseHeat = this.kind == Kind.OVEN ? 500 : 100;',
                'this.burnHeat = heat;',
                'addHeat(this.burnHeat);',
                'return Math.max(0, stack.getBurnTime(null));'
        ].each { required ->
            if (!heater.contains(required)) {
                problems << "Heater is missing audited 1.7.10 fuel contract '${required}'."
            }
        }
        if (heater.contains('WoodBurnerBlockEntity.fuelDuration(stack)') || heater.contains('this.burnHeat = fuelHeat()')) {
            problems << 'Heater must not inherit wood-burner bonuses or overwrite the ModuleBurnTime heat value each tick.'
        }
        [
                'public static final int HEATEX_TANK_CAPACITY = 24_000;',
                'private final HbmFluidTank heatExInputTank',
                'private final HbmFluidTank heatExOutputTank',
                'private void tickHeatExchanger(Level level)',
                'int ops = Math.min(this.heatExchangerAmountToCool, Math.min(inputOps, outputOps));',
                'this.heatEnergy = (int) (this.heatEnergy * 0.999D);',
                'public List<Port> heatExchangerPorts(LevelAccessor level)'
        ].each { required ->
            if (!heater.contains(required)) {
                problems << "Heat exchanger is missing audited 1.7.10 contract '${required}'."
            }
        }
        if (heater.contains('heater.addHeat(240)')) {
            problems << 'Heat exchanger must not use the removed fixed 240 TU/t approximation.'
        }

        [
                'this.inputTank = new HbmFluidTank(HbmFluids.byName("water").orElse(HbmFluids.none()), inputCapacity);',
                'this.outputTank = new HbmFluidTank(HbmFluids.byName("steam").orElse(HbmFluids.none()), inputCapacity * 100);'
        ].each { required ->
            if (!boiler.contains(required)) {
                problems << "Heat boiler is missing audited 1.7.10 contract '${required}'."
            }
        }
        if (!thermalConversions.contains('case "water" -> heating(input, "steam", 200, 1, 100, 1.0D)')) {
            problems << 'Water-to-steam conversion must retain the 1.7.10 200 TU per 1 mB -> 100 mB steam step.'
        }
        if (!boiler.contains('if (level.isClientSide) {')) {
            problems << 'Heat boiler tank and heat mutations must remain server-authoritative as in 1.7.10.'
        }
        if (boiler.contains('outputPerPort') || boiler.contains('Math.min(outputPerPort(), this.outputTank.amount())')) {
            problems << 'Heat boiler output must not be throttled per port; 1.7.10 exposes the full tank to every connection pass.'
        }
        [
                'case "steam" -> heating(',
                'case "hotsteam" -> heating(',
                'case "superhotsteam" -> heating('
        ].each { forbidden ->
            if (thermalConversions.contains(forbidden)) {
                problems << "Boilers must not heat ${forbidden.substring(6, forbidden.indexOf('"', 6))}; 1.7.10 only exposes water\'s first boiler step."
            }
        }
        [
                'case "steam" -> cooling(input, "spentsteam", 100, 1, 200, 0.5D)',
                'case "hotsteam" -> cooling(input, "steam", 1, 10, 2, 0.5D)',
                'case "superhotsteam" -> cooling(input, "hotsteam", 1, 10, 18, 0.5D)',
                'case "ultrahotsteam" -> cooling(input, "superhotsteam", 1, 10, 120, 0.5D)',
                'case "lead_hot" -> cooling(input, "lead", 1, 1, 680, 1.0D)',
                'case "thorium_salt_hot" -> cooling(input, "thorium_salt_depleted", 1, 1, 400, 1.0D)'
        ].each { required ->
            if (!thermalConversions.contains(required)) {
                problems << "Heat exchanger thermal conversion is missing '${required}'."
            }
        }
        if (!industrialBoiler.contains('super(HbmBlockEntities.INDUSTRIAL_BOILER.get(), pos, blockState, 64_000)')
                || !industrialBoiler.contains('private static final int MAX_HEAT = 12_800_000;')) {
            problems << 'Industrial boiler must retain the 1.7.10 64,000 mB water tank and 12,800,000 TU heat capacity.'
        }

        [
                'public static final int INPUT_CAPACITY = 100;',
                'public static final int OUTPUT_CAPACITY = 10_000;',
                'this.heat += amount;',
                'this.heatDisplay = process;',
                'this.heat = 0;'
        ].each { required ->
            if (!solarBoiler.contains(required)) {
                problems << "Solar boiler is missing audited 1.7.10 contract '${required}'."
            }
        }
        if (solarBoiler.contains('0.999D') || solarBoiler.contains('MAX_HEAT')) {
            problems << 'Solar boiler must not cap or decay mirror heat; 1.7.10 treats it as a transient per-tick value.'
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Thermal parity validation failed:\n - " + problems.join('\n - '))
        }
    }
}

tasks.register('validatePowerParity') {
    group = 'verification'
    description = 'Guards audited 1.7.10 turbine generation, storage-loss, and flywheel contracts.'

    def powerSources = [
            'src/main/java/com/reinhardt/hbm/blockentity/SteamTurbineBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/SteamCondenserBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/LargeTurbineBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/IndustrialTurbineBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/LeviathanTurbineBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/GasTurbineBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/PoweredSteamCondenserBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/blockentity/BatteryReddBlockEntity.java',
            'src/main/java/com/reinhardt/hbm/fluid/HbmThermalConversions.java'
    ]
    inputs.files(powerSources.collect { file(it) })
    outputs.upToDateWhen { false }

    doLast {
        def source = { String path -> file(path).getText('UTF-8') }
        def smallTurbine = source('src/main/java/com/reinhardt/hbm/blockentity/SteamTurbineBlockEntity.java')
        def steamCondenser = source('src/main/java/com/reinhardt/hbm/blockentity/SteamCondenserBlockEntity.java')
        def largeTurbine = source('src/main/java/com/reinhardt/hbm/blockentity/LargeTurbineBlockEntity.java')
        def industrialTurbine = source('src/main/java/com/reinhardt/hbm/blockentity/IndustrialTurbineBlockEntity.java')
        def leviathan = source('src/main/java/com/reinhardt/hbm/blockentity/LeviathanTurbineBlockEntity.java')
        def gasTurbine = source('src/main/java/com/reinhardt/hbm/blockentity/GasTurbineBlockEntity.java')
        def poweredCondenser = source('src/main/java/com/reinhardt/hbm/blockentity/PoweredSteamCondenserBlockEntity.java')
        def batteryRedd = source('src/main/java/com/reinhardt/hbm/blockentity/BatteryReddBlockEntity.java')
        def thermalConversions = source('src/main/java/com/reinhardt/hbm/fluid/HbmThermalConversions.java')
        def problems = []

        [largeTurbine, industrialTurbine, poweredCondenser].eachWithIndex { machine, index ->
            def name = ['Large turbine', 'Industrial turbine', 'Powered steam condenser'][index]
            if (machine.contains('MAX_TRANSFER_PER_PORT') || machine.contains('Math.min(MAX_TRANSFER_PER_PORT')) {
                problems << "${name} must not impose a per-port fluid transfer cap; 1.7.10 provides the full tank amount to each connection pass."
            }
        }
        if (gasTurbine.contains('MAX_TRANSFER_PER_PORT') || gasTurbine.contains('Math.min(MAX_TRANSFER_PER_PORT')) {
            problems << 'Combined-cycle gas turbine must not impose a per-port fluid transfer cap; 1.7.10 exposes each tank at its full current capacity.'
        }
        if (!poweredCondenser.contains('if (convert <= 0 || this.power < (long) convert * POWER_PER_MB)')
                || poweredCondenser.contains('maxByPower')) {
            problems << 'Powered steam condenser must retain the 1.7.10 all-or-nothing conversion gate for its current steam batch.'
        }

        [smallTurbine, largeTurbine].eachWithIndex { turbine, index ->
            def name = index == 0 ? 'Small turbine' : 'Large turbine'
            [
                    'BatteryPackItem.chargeFromMachine',
                    '(long) (',
                    '* 0.95D'
            ].each { required ->
                if (!turbine.contains(required)) {
                    problems << "${name} is missing audited 1.7.10 buffer-loss contract '${required}'."
                }
            }
        }

        [
                'if (level.isClientSide) {',
                'this.items[ID_RESULT_SLOT].isEmpty()',
                'this.items[ID_RESULT_SLOT] = identifier.copy();',
                'this.items[ID_SLOT] = ItemStack.EMPTY;'
        ].each { required ->
            if (!smallTurbine.contains(required)) {
                problems << "Small turbine is missing audited 1.7.10 fluid-chain contract '${required}'."
            }
        }

        [
                'if (level.isClientSide) {',
                'condenser.tryConvert();',
                'condenser.sendOutput(level);'
        ].each { required ->
            if (!steamCondenser.contains(required)) {
                problems << "Steam condenser is missing audited 1.7.10 server-authority contract '${required}'."
            }
        }

        [
                'private static final double FLYWHEEL_MAX_ENERGY = 50_000_000.0D;',
                'private long maxPower;',
                'private long flywheelEnergy;',
                'this.flywheelEnergy += (long) (ops * step.heatEnergy() * step.turbineEfficiency() * efficiency);',
                'this.spin = this.flywheelEnergy / FLYWHEEL_MAX_ENERGY;',
                'this.lastPowerTarget = Math.min((long) (Math.max(this.spin, 0.05D) * this.maxPower), this.flywheelEnergy);',
                'this.flywheelEnergy -= this.lastPowerTarget;',
                'this.powerBuffer = this.lastPowerTarget;'
        ].each { required ->
            if (!industrialTurbine.contains(required)) {
                problems << "Industrial turbine is missing audited 1.7.10 flywheel contract '${required}'."
            }
        }
        if (industrialTurbine.contains('ACCELERATION') || industrialTurbine.contains('targetSpin')) {
            problems << 'Industrial turbine must not use the removed approximation ramp; it must use the 1.7.10 flywheel-energy model.'
        }

        [
                'case "steam" -> cooling(input, "spentsteam", 100, 1, 200, 1.0D)',
                'case "hotsteam" -> cooling(input, "steam", 1, 10, 2, 1.0D)',
                'case "superhotsteam" -> cooling(input, "hotsteam", 1, 10, 18, 1.0D)',
                'case "ultrahotsteam" -> cooling(input, "superhotsteam", 1, 10, 120, 1.0D)'
        ].each { required ->
            if (!thermalConversions.contains(required)) {
                problems << "Steam conversion chain is missing '${required}'."
            }
        }
        [
                'this.outputTank.fill(step.output(), ops * step.amountProduced(), false);',
                'long convertedHeat = (long) ops * step.heatEnergy();',
                'this.powerBuffer = (long) (convertedHeat * step.turbineEfficiency() * EFFICIENCY);'
        ].each { required ->
            if (!leviathan.contains(required)) {
                problems << "Leviathan turbine is missing audited high-throughput steam contract '${required}'."
            }
        }

        [
                'if (this.fuelTank.amount() * 10 > this.fuelTank.capacity()) {',
                'this.fuelTank.amount() * 0.0001D',
                'this.counter = 225;',
                'if (fuelConsumed > fuelBeforeBurn) {',
                'if (this.lubricantTank.amount() <= 0) {',
                'if (slot == ID_SLOT && applyIdentifier()) {',
                'private boolean setFuelType(HbmFluidDefinition next)',
                'return setFuelType(FluidIdentifierItem.primary(identifier));'
        ].each { required ->
            if (!gasTurbine.contains(required)) {
                problems << "Gas turbine is missing audited 1.7.10 runtime contract '${required}'."
            }
        }

        [
                'public static final long MAX_POWER = 10_000_000L;',
                'public static final int TANK_CAPACITY = 1_000_000;',
                'public static final int POWER_PER_MB = 10;',
                'this.power = Math.max(0L, this.power - (long) convert * POWER_PER_MB);'
        ].each { required ->
            if (!poweredCondenser.contains(required)) {
                problems << "Powered condenser is missing audited 1.7.10 contract '${required}'."
            }
        }
        def poweredCondenserClient = poweredCondenser.substring(poweredCondenser.indexOf('private void tickClient'), poweredCondenser.indexOf('private void tryConvert'))
        if (poweredCondenserClient.contains('this.waterTimer--;')) {
            problems << 'Powered condenser client animation must use the server-synchronised water timer and must not decrement it locally.'
        }

        [
                'private int redLow = MODE_INPUT;',
                'private int redHigh = MODE_OUTPUT;',
                'private PowerEndpoint.ConnectionPriority priority = PowerEndpoint.ConnectionPriority.LOW;',
                'this.level.getSignal(neighbor, direction.getOpposite()) > 0'
        ].each { required ->
            if (!batteryRedd.contains(required)) {
                problems << "FEnSU is missing audited 1.7.10 redstone or priority contract '${required}'."
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Power parity validation failed:\n - " + problems.join('\n - '))
        }
    }
}

tasks.register('validateLegacyItemPorts') {
    group = 'verification'
    description = 'Fails when a 1.7.10 standalone item is left in a generic legacy catalog fallback.'

    def unresolvedManifest = file('src/main/resources/legacy/reinhardtshbm/items.txt')
    def itemRegistry = file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java')
    inputs.file unresolvedManifest
    inputs.file itemRegistry
    outputs.upToDateWhen { false }

    doLast {
        def unresolved = unresolvedManifest.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { !it.isEmpty() && !it.startsWith('#') }
        def registrySource = itemRegistry.getText('UTF-8')
        def problems = []
        if (!unresolved.isEmpty()) {
            problems << "Unported standalone 1.7.10 item ids: ${unresolved.join(', ')}"
        }
        if (registrySource.contains('LegacyCatalogItem') || registrySource.contains('registerRemainingLegacyCatalogItems')) {
            problems << 'Generic LegacyCatalogItem fallback must not be reintroduced.'
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Legacy item-port validation failed:\n - " + problems.join('\n - '))
        }
    }
}

tasks.register('deployClientMod') {
    group = 'distribution'
    description = 'Atomically deploys the built mod jar into the configured local NeoForge mods folder.'
    dependsOn tasks.named('jar')
    dependsOn tasks.named('validateJarIntegrity')
    dependsOn tasks.named('validateThermalParity')
    dependsOn tasks.named('validatePowerParity')
    dependsOn tasks.named('validateRocketMissileRecipes')

    doLast {
        File sourceJar = tasks.named('jar').get().archiveFile.get().asFile
        File targetDirectory = localClientModsDir
        def minecraftProcesses = ProcessHandle.allProcesses()
                .findAll { process ->
                    process.pid() != ProcessHandle.current().pid()
                            && process.info().commandLine()
                            .map { commandLine ->
                                commandLine.contains('net.minecraft.client.main.Main')
                                        || commandLine.contains('net.minecraft.server.Main')
                                        || commandLine.contains('cpw.mods.bootstraplauncher.BootstrapLauncher')
                            }
                            .orElse(false)
                }
                .collect { process ->
                    def started = process.info().startInstant().map { it.toString() }.orElse('unknown start time')
                    "${process.pid()} (${started})"
                }
        if (!minecraftProcesses.isEmpty()) {
            throw new GradleException(
                    "Refusing to deploy ${sourceJar.name} while Minecraft/NeoForge is running. " +
                            "Close the game before deploying; running clients keep ZIP/class indexes open " +
                            "and can crash with missing classes or broken textures after the jar is replaced. " +
                            "Detected process ids: ${minecraftProcesses.join(', ')}"
            )
        }
        if (!targetDirectory.exists() && !targetDirectory.mkdirs()) {
            throw new GradleException("Unable to create client mods directory ${targetDirectory}")
        }

        File targetJar = new File(targetDirectory, sourceJar.name)
        File temporaryJar = new File(targetDirectory, "${sourceJar.name}.tmp-${UUID.randomUUID()}")
        try {
            // Never stream directly into the live jar: a running client may still
            // read classes/resources from that path and observe a half-written ZIP.
            java.nio.file.Files.copy(
                    sourceJar.toPath(),
                    temporaryJar.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            new java.util.zip.ZipFile(temporaryJar).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (!entry.directory) {
                        zip.getInputStream(entry).withCloseable { input ->
                            byte[] buffer = new byte[16 * 1024]
                            while (input.read(buffer) != -1) {
                                // Consume every entry so CRC and size checks run.
                            }
                        }
                    }
                }
            }

            try {
                java.nio.file.Files.move(
                        temporaryJar.toPath(),
                        targetJar.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE
                )
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(
                        temporaryJar.toPath(),
                        targetJar.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            }

            targetDirectory.listFiles()
                    .findAll { it.isFile() && it.name.startsWith("${mod_id}-") && it.name.endsWith(".jar") && it.name != targetJar.name }
                    .each { stale ->
                        if (!stale.delete()) {
                            logger.warn("Unable to remove stale deployed mod jar ${stale}")
                        }
                    }
            logger.lifecycle("Atomically deployed ${targetJar.name} to ${targetDirectory}")
        } catch (Exception ex) {
            throw new GradleException(
                    "Client mod deployment aborted; the live jar was not partially overwritten. " +
                            "Close Minecraft before retrying if ${targetJar} is locked.",
                    ex
            )
        } finally {
            if (temporaryJar.exists()) {
                temporaryJar.delete()
            }
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('validateJarIntegrity')
    dependsOn tasks.named('validateLegacyItemPorts')
    dependsOn tasks.named('runData')
    dependsOn tasks.named('validateObjModels')
    dependsOn tasks.named('validateLangFiles')
    dependsOn tasks.named('validateDamageTypes')
    dependsOn tasks.named('validateLegacyRecipes')
    dependsOn tasks.named('validateRocketMissileRecipes')
    dependsOn tasks.named('validatePortRegressionFixes')
    dependsOn tasks.named('validateThermalParity')
    dependsOn tasks.named('validatePowerParity')
    // Deployment is opt-in so validation cannot replace a running client's jar.
    if (findProperty('deploy_client_mod') == 'true') {
        finalizedBy tasks.named('deployClientMod')
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
