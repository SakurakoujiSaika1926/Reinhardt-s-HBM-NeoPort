    inputs.files(cinnabarFiles)
    outputs.upToDateWhen { false }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def problems = []
        def readJson = { String path ->
            def source = file(path)
            if (!source.isFile()) {
                problems << "Missing cinnabar-chain resource ${path}"
                return null
            }
            parser.parseText(source.getText('UTF-8').replaceFirst('^\\uFEFF', ''))
        }

        def ore = readJson("src/main/resources/data/${project.mod_id}/recipe/crystallizer/ore_cinnabar.json")
        if (ore != null) {
            if (ore.type != "${project.mod_id}:crystallizer"
                    || ore.ingredient?.tag != 'c:ores/cinnabar'
                    || ore.acid?.fluid != 'peroxide'
                    || (ore.acid?.amount as Integer) != 500
                    || (ore.duration as Integer) != 600
                    || ore.result?.id != "${project.mod_id}:crystal_cinnabar") {
                problems << 'Cinnabar ore crystallization must remain ore + 500 mB peroxide / 600 ticks -> canonical crystal_cinnabar.'
            }
        }

        def mercury = readJson("src/main/resources/data/${project.mod_id}/recipe/crystallizer/cinnabar_mercury.json")
        if (mercury != null) {
            if (mercury.type != "${project.mod_id}:crystallizer"
                    || mercury.ingredient?.tag != 'c:gems/cinnabar'
                    || mercury.acid?.fluid != 'peroxide'
                    || (mercury.acid?.amount as Integer) != 500
                    || (mercury.duration as Integer) != 600
                    || mercury.result?.id != "${project.mod_id}:nugget_mercury"
                    || (mercury.result?.count as Integer) != 3) {
                problems << 'Raw cinnabar acidizing must remain cinnabar + 500 mB peroxide / 600 ticks -> 3 mercury drops (375 mB total).'
            }
        }

        def dustCompat = readJson("src/main/resources/data/${project.mod_id}/recipe/crystallizer/cinnabar_dust_compat.json")
        if (dustCompat != null) {
            def conditions = dustCompat.get('neoforge:conditions')
            def guardedByNonEmptyDustTag = conditions instanceof Collection
                    && conditions.any { condition ->
                        condition instanceof Map
                                && condition.type == 'neoforge:not'
                                && condition.value?.type == 'neoforge:tag_empty'
                                && condition.value?.tag == 'c:dusts/cinnabar'
                    }
            if (!guardedByNonEmptyDustTag
                    || dustCompat.type != "${project.mod_id}:crystallizer"
                    || dustCompat.ingredient?.tag != 'c:dusts/cinnabar'
                    || dustCompat.acid?.fluid != 'peroxide'
                    || (dustCompat.acid?.amount as Integer) != 50
                    || (dustCompat.duration as Integer) != 100
                    || dustCompat.result?.id != "${project.mod_id}:cinnabar") {
                problems << 'Optional cinnabar dust compatibility must remain dust + 50 mB peroxide / 100 ticks -> canonical cinnabar and load only when the tag is populated.'
            }
        }

        def combination = readJson("src/main/resources/data/${project.mod_id}/recipe/combination_oven/cinnabar_crystal.json")
        if (combination != null) {
            if (combination.type != "${project.mod_id}:combination_oven"
                    || combination.input?.tag != 'c:gems/cinnabar'
                    || combination.output?.id != "${project.mod_id}:sulfur"
                    || combination.fluid?.fluid != 'mercury'
                    || (combination.fluid?.amount as Integer) != 100) {
                problems << 'Raw cinnabar combination smelting must remain cinnabar -> sulfur + 100 mB mercury.'
            }
        }

        def smelting = readJson("src/main/resources/data/${project.mod_id}/recipe/smelting_crystal_cinnabar.json")
        if (smelting != null) {
            if (smelting.type != 'minecraft:smelting'
                    || smelting.ingredient?.item != "${project.mod_id}:crystal_cinnabar"
                    || smelting.result?.id != "${project.mod_id}:cinnabar"
                    || (smelting.result?.count as Integer) != 4
                    || (smelting.cookingtime as Integer) != 200
                    || Math.abs((smelting.experience as Number).doubleValue() - 2.0D) > 0.000001D) {
                problems << 'Cinnabar crystal smelting must remain canonical crystal_cinnabar -> 4 cinnabar, 200 ticks and 2 XP.'
            }
        }

        def coltanTool = readJson("src/main/resources/data/${project.mod_id}/recipe/coltan_tool.json")
        if (coltanTool != null && coltanTool.key?.C?.tag != 'c:gems/cinnabar') {
