                    'case "sodium" -> heating(input, "sodium_hot", 400, 1, 1, 2.5D);',
                    'case "lead" -> heating(input, "lead_hot", 800, 1, 1, 0.75D);',
                    'case "thorium_salt" -> heating(input, "thorium_salt_hot", 400, 1, 1, 1.0D);',
                    'case "mug" -> 1.15D;',
                    'case "heavywater" -> 1.25D;',
                    'case "lead" -> 0.75D;',
                    'case "thorium_salt" -> 2.5D;'
            ],
            'src/main/java/com/reinhardt/hbm/blockentity/PwrControllerBlockEntity.java': [
                    'if (hasIdentifier && amountLoaded <= 0)',
                    'HbmThermalConversions.pwrModeratorMultiplier(coolant.type())',
                    'RttyInfo.PREFIX_VALUE + "coldbuf"',
                    'RttyInfo.PREFIX_VALUE + "hotbuf"',
                    'this.rodTarget = 100.0D - percent;',
                    'RttyInfo.PREFIX_FUNCTION + "jettison"'
            ],
            'src/main/java/com/reinhardt/hbm/blockentity/RbmkComponentBlockEntity.java': [
                    '(heat <= 50.0D || heaterInput.amount() <= 0)',
                    'if (heat > 50.0D && water.amount() > 0)',
                    'convertedAmount = previousAmount / 10;',
                    'convertedAmount = (int) Math.min((long) previousAmount * 1000L, steam.capacity());'
            ],
            'src/main/java/com/reinhardt/hbm/blockentity/ZirnoxReactorBlockEntity.java': [
                    'implements MachineInventory, WorldlyContainer, MenuProvider, RttyValueProvider, RttyInteractive',
                    'RttyInfo.PREFIX_FUNCTION + "ventco2"',
                    '* 7.5F);'
            ],
            'src/main/java/com/reinhardt/hbm/blockentity/CargoElevatorBlockEntity.java': [
                    'private int targetExtension;',
                    'RttyInfo.PREFIX_VALUE + "extension"',
                    'RttyInfo.PREFIX_FUNCTION + "setextension"',
                    'tag.putInt("TargetExtension", targetExtension);'
            ],
            'src/main/java/com/reinhardt/hbm/blockentity/IcfCoreBlockEntity.java': [
                    'RttyValueProvider',
                    'RttyInfo.PREFIX_VALUE + "stellarflux"'
            ],
            'src/main/java/com/reinhardt/hbm/blockentity/ExcavatorBlockEntity.java': [
                    'RttyValueProvider, RttyInteractive',
                    'RttyInfo.PREFIX_FUNCTION + "setstate"'
            ],
            'src/main/java/com/reinhardt/hbm/blockentity/GasFlareBlockEntity.java': [
                    'RttyValueProvider, RttyInteractive',
                    'RttyInfo.PREFIX_FUNCTION + "setflowstate"',
                    'RttyInfo.PREFIX_FUNCTION + "setignitionstate"'
            ],
            'src/main/java/com/reinhardt/hbm/blockentity/FusionMachineBlockEntity.java': [
                    'MenuProvider, RttyValueProvider, RttyInteractive',
                    'RttyInfo.PREFIX_FUNCTION + "settarget"',
                    'RttyInfo.PREFIX_FUNCTION + "setrecipe"'
            ],
            'src/main/java/com/reinhardt/hbm/blockentity/LegacyMachineBlockEntity.java': [
                    'ClientRenderNeighborSnapshot, RttyValueProvider',
                    'RttyInfo.PREFIX_VALUE + "afterburner"',
                    'RttyInfo.PREFIX_VALUE + "progress"'
            ],
            'src/main/java/com/reinhardt/hbm/blockentity/LegacyTurretBlockEntity.java': [
                    'RttyInfo.PREFIX_FUNCTION + "setactive"',
                    'RttyInfo.PREFIX_FUNCTION + "targetplayers"',
                    'RttyInfo.PREFIX_FUNCTION + "setmode"',
                    'RttyInfo.PREFIX_FUNCTION + "setmanual"'
            ],
            'src/main/java/com/reinhardt/hbm/satellite/SatelliteSavedData.java': [
                    'private static final String DRIVE_DISK_FLIGHTDATA = "drive_disk_flightdata";',
                    'private static final String DRIVE_DISK_ORBITDATA = "drive_disk_orbitdata";',
                    'public List<SatelliteInfoLine> infoLines(ServerLevel level)',
                    'PRECISION_LASER_CHARGE_TICKS'
            ],
            'src/main/java/com/reinhardt/hbm/satellite/SatelliteEventTracker.java': [
                    'public static void reportRay(',
                    'public static void reportRadiation('
            ],
            'src/main/java/com/reinhardt/hbm/item/PileRodMk2Item.java': [
                    'HbmItems.PILE_ROD_PU239',
                    'HbmItems.PILE_ROD_RGP',
                    'HbmItems.PILE_ROD_WASTE',
                    'HbmItems.PILE_ROD_THORIUM_FUEL'
            ]
    ]

    inputs.files contracts.keySet().collect { file(it) }
    inputs.file file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java')

    doLast {
        def problems = []
        contracts.each { relativePath, fragments ->
            File sourceFile = file(relativePath)
            if (!sourceFile.isFile()) {
                problems << "missing behavior source: ${relativePath}"
                return
            }
            String source = sourceFile.getText('UTF-8')
            fragments.each { fragment ->
                if (!source.contains(fragment)) {
                    problems << "${relativePath} lost contract fragment: ${fragment}"
                }
            }
        }

        String itemRegistry = file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java').getText('UTF-8')
        if (itemRegistry.contains('"rtty_card"')) {
            problems << 'OpenComputers-only rtty_card must remain excluded from the in-scope NeoForge registry'
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Latest-upstream behavior parity validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle('Latest-upstream behavior parity validation passed (PWR/RBMK/Zirnox, satellites, pile, elevator and native RTTY/RoR)')
    }
}

tasks.register('validateLegacyPlacementAndObjBatching') {
    group = 'verification'
    description = 'Guards the legacy supercomputer placement offset and OBJ primitive batching used by Soyuz.'

    def blockRegistry = file('src/main/java/com/reinhardt/hbm/registry/HbmBlocks.java')
    def meshSource = file('src/main/java/com/reinhardt/hbm/client/render/LegacyEntityObjMesh.java')
    def deathBlastRenderer = file('src/main/java/com/reinhardt/hbm/client/render/LegacyDeathBlastEntityRenderer.java')
    def soyuzRenderer = file('src/main/java/com/reinhardt/hbm/client/render/SoyuzLaunchpadBlockEntityRenderer.java')
    def soyuzModel = file("src/main/resources/assets/${mod_id}/models/obj/machine/launchpad_soyuz.obj")
    inputs.files blockRegistry, meshSource, deathBlastRenderer, soyuzRenderer, soyuzModel

    doLast {
        def problems = []
        String blocks = blockRegistry.getText('UTF-8').replace('\r\n', '\n')
        String supercomputerRegistration = '''private static DeferredBlock<Block> supercomputer(String name) {
        DeferredBlock<Block> block = registerBlockWithoutItem(name, () -> new SupercomputerBlock(metal()
                .strength(5.0F, 30.0F)
                .noOcclusion()));
        HbmItems.ITEMS.register(name, () -> new ObjMachineLegacyOffsetBlockItem(
                block.get(), new Item.Properties(), 8, true));
        return block;
    }'''
        if (!blocks.contains(supercomputerRegistration)) {
            problems << 'machine_supercomputer must use the legacy OBJ block item with the exact eight-block behind-player core offset'
        }

        String mesh = meshSource.getText('UTF-8').replace('\r\n', '\n')
        if (!mesh.contains('renderFacesAsQuads(faces, poseStack, consumer, packedLight, packedOverlay, argb);')
                || !mesh.contains('void renderAllTriangles(')
                || !mesh.contains('emitVertex(third, pose, consumer, packedLight, packedOverlay, red, green, blue, alpha);\n                emitVertex(third, pose, consumer, packedLight, packedOverlay, red, green, blue, alpha);')) {
            problems << 'legacy OBJ faces must emit complete four-vertex batches by default while retaining an explicit triangle-mode path'
        }

        String deathBlast = deathBlastRenderer.getText('UTF-8')
        if (deathBlast.count('SPHERE.renderAllTriangles(') != 2 || deathBlast.contains('SPHERE.renderAll(')) {
            problems << 'the death-blast sphere uses a TRIANGLES RenderType and must use only renderAllTriangles'
        }

        String soyuz = soyuzRenderer.getText('UTF-8')
        if (!soyuz.contains('RenderType.entityCutoutNoCull(PAD_TEXTURE)') || !soyuz.contains('PAD.renderGroup(')) {
            problems << 'Soyuz launchpad must remain on its dedicated cutout-no-cull group renderer'
        }

        def faces = soyuzModel.readLines('UTF-8')
                .findAll { it.trim().startsWith('f ') }
                .collect { it.trim().split(/\s+/).length - 1 }
        int triangularFaces = faces.count { it == 3 }
        if (faces.size() != 4862 || triangularFaces != 4862) {
            problems << "launchpad_soyuz.obj must retain its reviewed 4,862 triangular faces (found ${faces.size()} faces, ${triangularFaces} triangular)"
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Legacy placement/OBJ batching validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle('Legacy placement/OBJ batching validation passed (supercomputer offset 8; Soyuz 4,862 triangles packed into complete quad batches)')
    }
}

