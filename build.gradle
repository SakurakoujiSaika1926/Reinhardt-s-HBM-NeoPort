                        type: "${hbm}:purex", group: 'autoswitch.pile', duration: 40, power: 100,
                        input_items: [counted(item('pile_rod_thorium_fuel'), 1)],
                        input_fluids: [[fluid: 'sulfuric_acid', amount: 100]],
                        output_items: [output('billet_thorium_fuel', 2), output('billet_nuclear_waste')]
                ],
                'purex/pile_waste.json': [
                        type: "${hbm}:purex", group: 'autoswitch.pile', duration: 40, power: 100,
                        input_items: [counted(item('pile_rod_waste'), 1)],
                        input_fluids: [[fluid: 'sulfuric_acid', amount: 100]],
                        output_items: [output('billet_nuclear_waste', 2), output('billet_polonium')]
                ]
        ]
        expectedRecipes.each { String relative, Map expected ->
            File recipeFile = new File(recipeRoot, relative)
            if (!recipeFile.isFile()) {
                problems << "Missing Chicago Pile MK2 recipe ${relative}."
            } else if (parseJson(recipeFile) != expected) {
                problems << "Chicago Pile MK2 recipe differs from current upstream: ${relative}."
            }
        }

        def anvilSource = anvilRecipes.getText('UTF-8').replaceAll(/\s+/, ' ')
        def anvilContracts = [
                'Ra226Be rod': 'List.of(ingredient("billet_ra226be", 3)), item("pile_rod_ra226be", 1), 2',
                'Po210Be rod': 'List.of(ingredient("billet_po210be", 3)), item("pile_rod_po210be", 1), 2',
                'zirconium rod': 'List.of(tagIngredient(commonTag("billets/zirconium"), 3, hbm("billet_zirconium"))), item("pile_rod_zr", 1), 2',
                'natural-uranium rod': 'List.of(tagIngredient(commonTag("billets/uranium"), 3, hbm("billet_uranium"))), item("pile_rod_nu", 1), 2'
        ]
        anvilContracts.each { name, fragment ->
            if (!anvilSource.contains(fragment)) problems << "Missing exact tier-2 anvil construction recipe for ${name}."
        }

        def itemSource = itemRegistry.getText('UTF-8')
        def rods = [
                pile_rod_ra226be: 'RA226BE', pile_rod_po210be: 'PO210BE', pile_rod_zr: 'ZR',
                pile_rod_nu: 'NU', pile_rod_pu239: 'PU239', pile_rod_rgp: 'RGP',
                pile_rod_waste: 'WASTE', pile_rod_thorium: 'THORIUM',
                pile_rod_thorium_fuel: 'THORIUM_FUEL'
        ]
        def en = parseJson(enUs)
        def zh = parseJson(zhCn)
        rods.each { String id, String kind ->
            def constant = id.toUpperCase(java.util.Locale.ROOT)
            def registration = java.util.regex.Pattern.compile(
                    "(?s)public\\s+static\\s+final\\s+DeferredItem<Item>\\s+${constant}\\s*=\\s*reactorItem\\(\\s*\"${id}\"\\s*,\\s*\\(\\)\\s*->\\s*new\\s+PileRodMk2Item\\(new\\s+Item\\.Properties\\(\\),\\s*PileRodMk2Item\\.Kind\\.${kind}\\)\\s*\\);"
            )
            if (!registration.matcher(itemSource).find()) {
                problems << "Missing independent Chicago Pile rod registration ${id} -> ${kind}."
            }
            File modelFile = new File(modelRoot, "item/${id}.json")
            if (!modelFile.isFile()) {
                problems << "Missing Chicago Pile rod model ${id}.json."
            } else {
                def model = parseJson(modelFile)
                if (model.parent != 'minecraft:item/generated' || model.textures?.layer0 != "${hbm}:item/${id}") {
                    problems << "Chicago Pile rod model ${id}.json does not use its dedicated texture."
                }
            }
            File textureFile = new File(textureRoot, "item/${id}.png")
            if (!textureFile.isFile() || textureFile.length() <= 0L) {
                problems << "Missing Chicago Pile rod texture ${id}.png."
            }
            def langKey = "item.${hbm}.${id}".toString()
            if (!en.containsKey(langKey) || !zh.containsKey(langKey)) {
                problems << "Missing bilingual Chicago Pile rod localization for ${id}."
            }
        }

        def blockSource = blockRegistry.getText('UTF-8')
        def blocks = [
                pile_brick: 'PILE_BRICK', pile_block: 'PILE_BLOCK', pile_loader: 'PILE_LOADER',
                pile_vent: 'PILE_VENT', pile_control: 'PILE_CONTROL'
        ]
        blocks.each { String id, String constant ->
            if (!blockSource.contains("DeferredBlock<Block> ${constant} =")) {
                problems << "Missing Chicago Pile block registration ${id}."
            }
            File stateFile = new File(blockstateRoot, "${id}.json")
            File itemModel = new File(modelRoot, "item/${id}.json")
            File lootFile = new File(lootRoot, "${id}.json")
            if (!stateFile.isFile()) problems << "Missing Chicago Pile blockstate ${id}.json."
            if (!itemModel.isFile()) problems << "Missing Chicago Pile item model ${id}.json."
            if (!lootFile.isFile()) {
                problems << "Missing Chicago Pile loot table ${id}.json."
            } else {
                def loot = parseJson(lootFile)
                if (id == 'pile_block') {
                    if (loot['pools'] != []) problems << 'Formed Chicago Pile blocks must remain no-drop internal structure blocks.'
                } else {
                    def lootText = lootFile.getText('UTF-8')
                    def selfDrop = java.util.regex.Pattern.compile(
                            '\"name\"\\s*:\\s*\"' + java.util.regex.Pattern.quote("${hbm}:${id}") + '\"'
                    )
                    if (!selfDrop.matcher(lootText).find()) problems << "Chicago Pile block ${id} does not drop itself."
                }
            }
            def langKey = "block.${hbm}.${id}".toString()
            if (!en.containsKey(langKey) || !zh.containsKey(langKey)) {
                problems << "Missing bilingual Chicago Pile block localization for ${id}."
            }
        }
        ['pile_brick.json', 'pile_block.json', 'pile_block_core.json', 'pile_block_input.json',
         'pile_block_output.json', 'pile_block_control.json', 'pile_loader_all.json',
         'pile_vent_all.json', 'pile_control_all.json'].each { model ->
            if (!new File(modelRoot, "block/${model}").isFile()) {
                problems << "Missing Chicago Pile block model ${model}."
            }
        }

        def rodSource = rodItem.getText('UTF-8').replaceAll(/\s+/, ' ')
        [
                'RA226BE("ra226be", 0.0D, 0.0D, 0.0D, 1.0D)',
                'PO210BE("po210be", 0.0D, 0.0D, 0.0D, 1.0D)',
                'ZR("zr", 0.0D, 0.0D, 0.0D, 0.0D)',
                'NU("nu", 1.0D, 25_000.0D, 0.25D, 0.0D)',
                'PU239("pu239", 1.0D, 500.0D, 0.5D, 0.0D)',
                'RGP("rgp", 1.0D, 1_000.0D, 0.5D, 0.0D)',
                'WASTE("waste", 1.0D, 0.0D, 1.5D, 0.0D)',
                'THORIUM("thorium", 1.0D, 35_000.0D, 0.25D, 0.0D)',
                'THORIUM_FUEL("thorium_fuel", 1.0D, 2_000.0D, 0.5D, 0.0D)',
                'return Math.sqrt(value + 1.0D / ((value + 2.0D) * (value + 2.0D))) - 1.0D / (value + 2.0D);',
                'case NU -> HbmItems.PILE_ROD_PU239.get();',
                'case PU239 -> HbmItems.PILE_ROD_RGP.get();',
                'case RGP, WASTE, THORIUM_FUEL -> HbmItems.PILE_ROD_WASTE.get();',
                'case THORIUM -> HbmItems.PILE_ROD_THORIUM_FUEL.get();'
        ].each { fragment ->
            if (!rodSource.contains(fragment)) problems << "Chicago Pile rod behavior lost exact upstream fragment: ${fragment}"
        }

        def behaviorContracts = [
                (coreEntity): [
                        'public static final int MAX_HEAT = 800;',
                        'public static final int MAX_AIR = 1_000;',
                        'fuel.heat *= 1.0D - airCapacity * 0.05D;',
                        'channel.air -= (int) Math.ceil(airCapacity * 5.0D);',
                        'level.explode(null, averageX, explosionY, averageZ, 15.0F, true,',
                        'PileDebrisEntity.spawnMeltdownFragments(level,'
                ],
                (loaderEntity): [
                        'private static final double SPEED = 1.0D / 7.0D;',
                        'if (redstone && !wasRedstone && delay <= 0 && actuatorLevel <= 0.0D)',
                        'delay = 5;',
                        'return false;',
                        'return slot == SLOT_ROD && PileRodMk2Item.isPileRod(stack);'
                ],
                (ventEntity): [
                        'public static final int CAPACITY = 4_000;',
                        'vent.fan += 45.0F;',
                        'return side == null || side == facing() ? input : null;',
                        'channel.addAir(moved);'
                ],
                (controlEntity): [
                        'private static final double SPEED = 1.0D / 60.0D;',
                        'BlockPos entry = worldPosition.below();',
                        'if (redstone && !wasRedstone) targetLevel = 1.0D;',
                        'if (!redstone && wasRedstone) targetLevel = 0.0D;'
                ]
        ]
        behaviorContracts.each { File sourceFile, List<String> fragments ->
            def source = sourceFile.getText('UTF-8')
            fragments.each { fragment ->
                if (!source.contains(fragment)) problems << "${sourceFile.name} lost exact Chicago Pile behavior fragment: ${fragment}"
            }
        }

        def debrisSource = pileDebris.getText('UTF-8')
        [
                'private static final double INACCURACY = 0.35D;',
                'private static final double VELOCITY = 1.0D;',
                'private static final double GRAVITY = 0.1D;',
                'private static final int LIFETIME = 200;',
                'private static final float EXPLOSION_STRENGTH = 5.0F;',
                'for (int index = 0; index < 15; index++)',
                'level.random.nextDouble() * 0.5D + 1.0D',
                'HbmParticleTypes.FLAMETHROWER_FIRE.get()',
                'Level.ExplosionInteraction.NONE'
        ].each { fragment ->
            if (!debrisSource.contains(fragment)) problems << "PileDebrisEntity.java lost exact upstream fragment: ${fragment}"
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Chicago Pile MK2 parity validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle('Chicago Pile MK2 parity validation passed (10 manufacturing recipes, 4 PUREX recipes, 4 anvil recipes, 9 flattened rods).')
    }
}

tasks.register('validateFlattenedFoundryMolds') {
    group = 'verification'
    description = 'Guards the independently registered foundry molds and rejects the legacy component-backed mold item.'

    def itemRegistry = file('src/main/java/com/reinhardt/hbm/registry/HbmItems.java')
    def moldItem = file('src/main/java/com/reinhardt/hbm/item/FoundryMoldItem.java')
    def creativeTabs = file('src/main/java/com/reinhardt/hbm/registry/HbmCreativeTabs.java')
    def anvilRecipes = file('src/main/java/com/reinhardt/hbm/recipe/anvil/HbmAnvilRecipes.java')
    def modelRoot = file("src/main/resources/assets/${project.mod_id}/models/item")
    def zhCnFile = file("src/main/resources/assets/${project.mod_id}/lang/zh_cn.json")
    def enUsFile = file("src/main/resources/assets/${project.mod_id}/lang/en_us.json")
    inputs.files(itemRegistry, moldItem, creativeTabs, anvilRecipes, zhCnFile, enUsFile)
    inputs.dir(modelRoot)
    outputs.upToDateWhen { false }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def registrySource = itemRegistry.getText('UTF-8')
        def itemSource = moldItem.getText('UTF-8')
        def creativeSource = creativeTabs.getText('UTF-8')
        def anvilSource = anvilRecipes.getText('UTF-8')
        def zhCn = parser.parse(zhCnFile)
        def enUs = parser.parse(enUsFile)
        def problems = []
        def expected = [
                mold_nugget: 0, mold_billet: 1, mold_ingot: 2, mold_plate: 3, mold_wire: 4,
                mold_blade: 5, mold_blades: 6, mold_stamp: 7, mold_shell: 8, mold_pipe: 9,
                mold_ingots: 10, mold_plates: 11, mold_block: 12, mold_pipes: 13,
                mold_plates_cast: 15, mold_plate_cast: 19, mold_wire_dense: 20,
                mold_wires_dense: 21, mold_mechanism: 26
        ]

        expected.each { id, moldId ->
            if (!registrySource.contains("foundryMold(\"${id}\", ${moldId})")) {
                problems << "Missing independent item registration ${project.mod_id}:${id} for mold id ${moldId}."
            }
            if (!file("${modelRoot}/${id}.json").isFile()) {
                problems << "Missing independent item model ${id}.json."
            }
            def translationKey = "item.${project.mod_id}.${id}".toString()
            if (!zhCn.containsKey(translationKey) || !enUs.containsKey(translationKey)) {
                problems << "Missing zh_cn or en_us translation for ${translationKey}."
            }
            if (!itemSource.contains("shape(${moldId},") && !itemSource.contains("multi(${moldId},")) {
                problems << "Foundry mold id ${moldId} has no casting behavior definition."
            }
        }

        if (registrySource.contains('DeferredItem<Item> MOLD =')
                || itemSource.contains('DataComponents')
                || itemSource.contains('CustomModelData')
                || itemSource.contains('mold_id')
                || itemSource.contains('addCreativeVariants')
                || creativeSource.contains('instanceof FoundryMoldItem')
                || file("${modelRoot}/mold.json").exists()) {
            problems << 'Legacy component-backed foundry mold registration/model path must not be reintroduced.'
        }
        if (!anvilSource.contains('FoundryMoldItem.stackFor(moldId)')
                || anvilSource.contains('FoundryMoldItem.stackFor(HbmItems.MOLD')) {
            problems << 'Anvil mold recipes must output the dedicated mold item selected by mold id.'
        }
        if (!registrySource.contains('PIPES_STEEL = material(MISC_MATERIALS, "pipes_steel")')) {
            problems << 'The batch pipe mold output reinhardtshbm:pipes_steel is not registered.'
        }
        if (!anvilSource.contains('FoundryShape.DENSE_WIRE, "red_copper", 1')
                || !anvilSource.contains('FoundryShape.DENSE_WIRE, "red_copper", 9')) {
            problems << 'Dense-wire mold references must retain the 1.7.10 MINGRADE/red-copper material mapping.'
        }

        def actualRegistrations = (registrySource =~ /foundryMold\("(mold_[a-z_]+)",\s*(\d+)\)/)
                .collect { match -> [match[1], Integer.parseInt(match[2])] }
        def expectedRegistrations = expected.collect { id, moldId -> [id.toString(), moldId] }
        if (actualRegistrations != expectedRegistrations) {
            problems << "Expected exactly ${expected.size()} ordered flattened mold registrations, found ${actualRegistrations}."
        }

        if (!problems.isEmpty()) {
            throw new GradleException("Flattened foundry-mold validation failed:\n - " + problems.join('\n - '))
        }
        logger.lifecycle("Flattened foundry-mold validation passed (${expected.size()} independent items).")
    }
}

